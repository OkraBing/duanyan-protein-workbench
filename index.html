<!doctype html><html lang="zh-CN"><head><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233F38C9'/%3E%3Cpath d='M8 10h16M8 16h11M8 22h6' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>端砚 生物蛋白</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.5.2/3Dmol-min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:28px;--s7:36px;--s8:48px;--s9:72px;
  /* 画布与内容同色：靠间距与字重分组，不靠盒子 */
  --paper:#FDFDFC;--surface:#FFFFFF;--surface-2:#F7F6FA;--surface-3:#F1F0F5;
  --ink:#121218;--ink-2:#4B4E61;--ink-3:#6B6E80;--ink-4:#A9ABBA;
  --line:#E9E8F0;--line-2:#F2F1F6;
  /* 只有两个色相承担含义：靛紫=干/计算/通过，琥珀=湿/实验。
     红只给真错误，和琥珀拉开 33° 且饱和度不同。绿色已删除——
     「通过」用靛紫，不再需要第三个色相。 */
  --dry:#3F38C9;--dry-soft:#EEECFC;--dry-ink:#2A24A0;--dry-dim:#9A95E8;
  --wet:#8A5A12;--wet-soft:#F7F0E4;--wet-dim:#C9A66A;
  --ok:#2A24A0;--ok-soft:#EEECFC;
  --err:#B3261E;--err-soft:#FBE9E8;
  --focus:#3F38C9;--on-dry:#FFFFFF;
  --sh-1:0 1px 1px rgba(18,18,24,.04);
  --sh-2:0 2px 10px rgba(18,18,24,.06),0 1px 2px rgba(18,18,24,.04);
  --sh-3:0 20px 60px rgba(18,18,24,.18);
  --r1:5px;--r2:8px;--r3:12px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --art:.3;--f1:12px;--f2:13px;--bg:var(--surface);--bg-2:var(--surface-2);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C0C11;--surface:#121218;--surface-2:#17171F;--surface-3:#1F1F29;
  --ink:#F0EFF4;--ink-2:#AFAFC2;--ink-3:#8E8EA4;--ink-4:#5C5C70;
  --line:#242430;--line-2:#1B1B24;
  --dry:#A79FF8;--dry-soft:#1E1A44;--dry-ink:#C3BCFB;--dry-dim:#5A519E;
  --wet:#D6A458;--wet-soft:#332508;--wet-dim:#8A6B2E;
  --ok:#A79FF8;--ok-soft:#1E1A44;
  --err:#F08A80;--err-soft:#3A1816;
  --focus:#A79FF8;--on-dry:#15151C;
  --sh-1:0 1px 1px rgba(0,0,0,.4);
  --sh-2:0 2px 10px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --sh-3:0 20px 60px rgba(0,0,0,.7);
  --art:.46;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0C0C11;--surface:#121218;--surface-2:#17171F;--surface-3:#1F1F29;
  --ink:#F0EFF4;--ink-2:#AFAFC2;--ink-3:#8E8EA4;--ink-4:#5C5C70;
  --line:#242430;--line-2:#1B1B24;
  --dry:#A79FF8;--dry-soft:#1E1A44;--dry-ink:#C3BCFB;--dry-dim:#5A519E;
  --wet:#D6A458;--wet-soft:#332508;--wet-dim:#8A6B2E;
  --ok:#A79FF8;--ok-soft:#1E1A44;
  --err:#F08A80;--err-soft:#3A1816;
  --focus:#A79FF8;--on-dry:#15151C;
  --sh-1:0 1px 1px rgba(0,0,0,.4);
  --sh-2:0 2px 10px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --sh-3:0 20px 60px rgba(0,0,0,.7);
  --art:.46;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-size:13.5px;line-height:1.6;
  font-family:Inter,"PingFang SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  font-feature-settings:"cv05","ss01";-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.022em}
p{margin:0}
a{color:var(--dry);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}
::selection{background:var(--dry-soft);color:var(--dry-ink)}

/* 数值一律等宽 —— 这是「仪器」和「后台」的分界线 */
.num,td.num,th.num,.v,code,pre{font-family:var(--mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;font-feature-settings:"zero"}
.t-xs{font-size:10.5px}.t-sm{font-size:11.5px}.t-md{font-size:12.5px}
.mut{color:var(--ink-2)}.mut2{color:var(--ink-3)}
/* 小标签：10px，字距拉开，这是整套设计的声音 */
.lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:var(--s3)}
.col{display:flex;flex-direction:column}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 外壳 ---------- */
#app{display:flex;min-height:100vh;align-items:stretch}
#side{flex:0 0 212px;background:var(--paper);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:auto;padding-left:env(safe-area-inset-left,0px)}
#side[data-collapsed="1"]{flex-basis:60px}
#side[data-collapsed="1"] .nav-tx,#side[data-collapsed="1"] .lbl,#side[data-collapsed="1"] .side-foot{display:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);
  border-left:1px solid var(--line)}
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:var(--s3);min-height:49px;
  padding-inline:max(var(--s6),env(safe-area-inset-left,0px)) max(var(--s5),env(safe-area-inset-right,0px))}
#view{padding-block:var(--s7) var(--s9);
  padding-inline:max(var(--s5),env(safe-area-inset-left,0px)) max(var(--s5),env(safe-area-inset-right,0px))}
@media(min-width:1000px){#view{padding-inline:max(var(--s7),env(safe-area-inset-left,0px)) max(var(--s7),env(safe-area-inset-right,0px))}}
/* 一个页壳，所有页面同宽同节距。之前三种页宽两种节距，是「错乱」的根源 */
.page{display:flex;flex-direction:column;gap:var(--s7);max-width:1180px}
/* 两栏：主栏 + 固定 300px 侧栏，所有页面一致 */
.cols{display:grid;gap:var(--s7);grid-template-columns:minmax(0,1fr) 300px;align-items:start}
@media(max-width:1060px){.cols{grid-template-columns:minmax(0,1fr)}}
/* 区块底部操作条：紧贴内容，不浮在远处 */
.sec-f{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding-top:var(--s4);border-top:1px solid var(--line-2)}
/* 只在换路由时入场；状态重渲染不动，否则勾一个筛选框整页会闪 */
.enter{animation:in .26s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.enter{animation:none}}

.brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s5) var(--s4) var(--s6)}
.brand-mark{width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.nav-group{display:flex;flex-direction:column;gap:1px;padding:0 var(--s3) var(--s5)}
.nav-group .lbl{padding:var(--s3) var(--s3) var(--s2)}
.nav{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:31px;padding:0 var(--s3);
  border:0;background:transparent;border-radius:var(--r2);color:var(--ink-2);cursor:pointer;
  text-align:left;font-size:12.5px;font-weight:450;position:relative}
.nav:hover{background:var(--surface-3);color:var(--ink)}
.nav[aria-current="page"]{color:var(--dry);font-weight:600;background:transparent}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;
  width:2px;border-radius:2px;background:var(--dry)}
.nav svg{flex:0 0 15px;opacity:.75}
.nav[aria-current="page"] svg{opacity:1}
.side-foot{margin-top:auto;padding:var(--s4) var(--s4) var(--s5)}

/* ---------- 控件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:30px;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r2);
  background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:background .14s,border-color .14s,color .14s}
.btn:hover{background:var(--surface-3);border-color:var(--ink-4)}
.btn:active{transform:translateY(.5px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-pri{background:var(--dry);border-color:var(--dry);color:var(--on-dry);font-weight:550;box-shadow:var(--sh-1)}
.btn-pri:hover{background:var(--dry-ink);border-color:var(--dry-ink);color:var(--on-dry)}
.btn-gh{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-gh:hover{background:var(--surface-3);border-color:transparent;color:var(--ink)}
.btn-ic{width:30px;padding:0;flex:0 0 30px}
@media(max-width:860px){.btn{min-height:40px}.btn-ic{width:40px;flex-basis:40px}}

/* ⌘K 搜索：不是一个大输入框 */
#q{display:flex;align-items:center;gap:var(--s2);height:28px;padding:0 var(--s2) 0 var(--s3);
  border:1px solid var(--line);border-radius:999px;background:var(--surface-2);
  color:var(--ink-3);font-size:12px;cursor:pointer;min-width:168px}
#q:hover{border-color:var(--ink-4);color:var(--ink-2)}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;
  padding:1px 4px;background:var(--surface);color:var(--ink-3)}

/* ---------- 容器：默认不是盒子 ---------- */
.card{background:transparent;border:0;border-radius:0;box-shadow:none}
.card-h{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding:0 0 var(--s3);border-bottom:1px solid var(--line);margin-bottom:var(--s4)}
.card-h>strong{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.card-b{padding:0}
/* 可点的才是盒子 */
button.card,.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  box-shadow:var(--sh-1);transition:border-color .16s,box-shadow .16s,transform .16s}
button.card:hover,.tile:hover{border-color:var(--ink-4);box-shadow:var(--sh-2);transform:translateY(-1px)}
button.card .card-b,.tile .card-b{padding:var(--s4)}
button.card .card-h,.tile .card-h{border-bottom:0;margin-bottom:0;padding:0}

/* 状态：圆点加文字，不是实心药丸 */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;
  white-space:nowrap;color:var(--ink-2);padding:0;height:auto;background:none}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px}
.c-dry{color:var(--dry)}.c-wet{color:var(--wet)}.c-ok{color:var(--ok)}.c-err{color:var(--err)}
.c-mut{color:var(--ink-3)}
.chip .dot{display:none}
/* 需要强调的少数场合 */
.chip-solid{padding:1px 8px;border-radius:999px;background:var(--surface-3);font-size:11px}
.dot{width:5px;height:5px;border-radius:50%;flex:0 0 5px}

.field{display:flex;flex-direction:column;gap:5px}
.label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.input,select.input{width:100%;min-height:32px;padding:0 var(--s3);border:1px solid var(--line);
  border-radius:var(--r2);background:var(--surface);transition:border-color .14s,box-shadow .14s}
textarea.input{min-height:72px;padding:var(--s3);resize:vertical;line-height:1.65}
.input:hover{border-color:var(--ink-4)}
.input:focus{outline:0;border-color:var(--dry);box-shadow:0 0 0 3px var(--dry-soft)}
 #asbar,#syncbar{gap:var(--s3);padding:var(--s3) var(--s4);border:1px solid var(--wet-dim);
  border-radius:5px;background:var(--wet-soft);margin-bottom:var(--s5);flex-wrap:wrap}
#syncbar{border-color:var(--err);background:var(--err-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;height:36px}
.seg-i{appearance:none;border:0;background:var(--bg);color:var(--ink-2);font:inherit;font-size:var(--f2);
  padding:0 12px;cursor:pointer;border-left:1px solid var(--line)}
.seg-i:first-child{border-left:0}
.seg-i[aria-checked="true"]{background:var(--dry-soft);color:var(--dry-ink);font-weight:550}
.seg-i:hover:not([aria-checked="true"]){background:var(--bg-2)}
.seg-i:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.sym{text-transform:none;letter-spacing:0}
tr.grp>td{background:var(--surface-2);border-top:1px solid var(--line);padding:var(--s3) var(--s4)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.why{margin-top:var(--s2)}
.why>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;
  font-size:var(--f1);color:var(--dry);line-height:1.5;padding:2px 0;border-radius:3px}
.why>summary::-webkit-details-marker{display:none}
.why>summary::before{content:"＋";font-size:11px;width:11px;text-align:center;opacity:.8}
.why[open]>summary::before{content:"－"}
.why>summary:hover{text-decoration:underline}
.why>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.why>.why-b{margin-top:var(--s2);padding-left:var(--s3);border-left:2px solid var(--line-2);
  font-size:var(--f1);color:var(--ink-3);line-height:1.65;max-width:62ch}
.hint{font-size:11.5px;color:var(--ink-3)}

/* ---------- 表格：去框，只留发丝线 ---------- */
.tbl-wrap{overflow:auto;border-radius:0;border:0;background:transparent}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:0 var(--s4) var(--s2) 0;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:last-child{padding-right:0}
tbody td{padding:var(--s3) var(--s4) var(--s3) 0;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody td:last-child{padding-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{font-size:12px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.sort-i{opacity:.3;margin-left:4px}
th[aria-sort]{color:var(--dry)}
th[aria-sort] .sort-i{opacity:1}

.empty{display:flex;flex-direction:column;align-items:center;gap:var(--s3);
  padding:var(--s9) var(--s5);text-align:center;color:var(--ink-3)}
.skel{background:linear-gradient(90deg,var(--surface-3) 25%,var(--line-2) 37%,var(--surface-3) 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:var(--r1)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

.bar{height:3px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex}

/* ---------- 数字组：标签压小，数字放大 ---------- */
.kpi{display:grid;gap:var(--s6) var(--s7);background:transparent;border:0;border-radius:0;overflow:visible;
  padding:var(--s2) 0 var(--s5);border-bottom:1px solid var(--line)}
.kpi>div{background:transparent;padding:0}
.kpi .t-sm{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-size:32px;font-weight:500;line-height:1.1;margin-top:var(--s2);letter-spacing:-.03em;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .v .t-md{font-size:14px;color:var(--ink-3)}

.toast-host{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--s6) + env(safe-area-inset-bottom,0px));
  z-index:100;display:flex;flex-direction:column;gap:var(--s2);align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:var(--s2) var(--s4);border-radius:999px;
  font-size:12.5px;box-shadow:var(--sh-3);max-width:min(92vw,520px);
  animation:in .2s cubic-bezier(.2,.7,.3,1)}
dialog{border:1px solid var(--line);padding:0;border-radius:var(--r3);background:var(--surface);
  color:var(--ink);box-shadow:var(--sh-3);max-width:min(94vw,440px);width:100%}
dialog .card-h,dialog .card-b{padding:var(--s5)}
dialog .card-h{margin:0;border-bottom:1px solid var(--line)}
dialog .card-h>strong{font-size:13.5px;letter-spacing:-.02em;text-transform:none;color:var(--ink)}
dialog::backdrop{background:rgba(12,12,17,.5);backdrop-filter:blur(2px)}

/* ---------- 工作台 ---------- */
.hero{position:relative;overflow:hidden;border:0;border-radius:0;background:transparent;box-shadow:none}
.hero-art{position:absolute;top:2px;right:0;pointer-events:none;opacity:var(--art);line-height:0}
.hero-art svg{display:block}
@media(max-width:980px){.hero-art{display:none}}
.hero-in{position:relative;padding:0 0 var(--s6)}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dry)}
.hero h1{font-size:34px;line-height:1.14;letter-spacing:-.035em;text-wrap:balance;margin-top:var(--s3)}
@media(max-width:700px){.hero h1{font-size:26px}}
.hero .lede{color:var(--ink-2);max-width:48ch;margin-top:var(--s3);font-size:13.5px}
.rule{height:2px;border-radius:999px;display:flex;overflow:hidden;width:56px;margin-top:var(--s5)}
.ask{margin-top:var(--s6);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r3);box-shadow:var(--sh-1);transition:box-shadow .18s,border-color .18s}
.ask:focus-within{border-color:var(--dry);box-shadow:0 0 0 4px var(--dry-soft)}
.ask .card-b{padding:var(--s4) var(--s4) var(--s3)}

@media(max-width:860px){
  #app{flex-direction:column}
  #side{position:static;height:auto;flex-basis:auto;width:100%;flex-direction:row;overflow-x:auto;
    border-right:0;border-bottom:1px solid var(--line);padding:var(--s2) var(--s3);gap:var(--s1);align-items:center}
  #main{border-left:0}
  #side .brand,#side .side-foot,#side .lbl{display:none}
  #side .nav-group{flex-direction:row;padding:0;margin:0}
  .nav{white-space:nowrap}
  .nav[aria-current="page"]::before{display:none}
  .nav[aria-current="page"]{background:var(--dry-soft)}
}
#searchrow{display:none;border-bottom:1px solid var(--line);background:var(--surface);
  padding:var(--s3) max(var(--s5),env(safe-area-inset-left,0px));position:sticky;top:49px;z-index:19}
#searchrow[data-open="1"]{display:block}
#qbtn{display:none}
@media(max-width:780px){#q{display:none}#qbtn{display:inline-flex}}

/* 滑块：细轨道，实心把手 */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:var(--surface-3)}
input[type=range]::-moz-range-track{height:3px;border-radius:999px;background:var(--surface-3)}

/* ===== 数据模型（ARCHITECTURE 第一节）=====
   变体是项目级实体，不属于任何一轮。Variant : Round 多对多，经 DesignInstance 连接。
   这是查重与反查历史的前提。 */

   前者是有信息的负样本参与重训，后者什么都不是。 */
const DISPOSITION={
  designed:{n:'已设计',train:false,note:'生成出来了，本轮没选上'},
  deduped:{n:'查重排除',train:false,note:'与历史重复，不占板位也不花钱'},
  selected:{n:'已入选',train:false,note:'选上了，还没排板'},
  plated:{n:'已排板',train:false,note:'占了孔位，还没送检'},
  ordered:{n:'已送检',train:false,note:'在服务商手里'},
  measured:{n:'有结果',train:true,note:'有有效数值，参与重训'},
  failed:{n:'测定失败',train:true,note:'有信息的负样本，参与重训'},
  untested:{n:'未测',train:false,note:'没有任何信息，不参与重训'}};
/* 失败是有类型的；「未测」没有类型，因为它不是一种结果 */

  no_expression:'表达量为零',aggregation:'聚集',purification:'纯化失败',

/* 从服务商返回的质量字段推断缺失原因——接口里没有 missing_reason，这是我们的推断 */
function inferFailure(r){
  if(r.expression==='none'||r.expression==='low')return {k:'no_expression',by:'expression 字段'};
  if(r.fit_quality==='poor')return {k:'bad_fit',by:'fit_quality 字段'};
  if(r.rmse>30)return {k:'bad_fit',by:'rmse_max_signal_pct > 30'};
  if(r.binding==='none')return {k:'no_binding',by:'binding 字段'};
  return null;

(function seed(){let s=42;const r=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;
 const aa='ACDEFGHIKLMNPQRSTVWY';

             ['p2',24,['kd'],      [31,44,58,71],        [1,1,2,2]],
             ['p3',36,['kcat','km'],[88,121,154,190],    [6,6,6,6]]];
 let no=0;
 PLAN.forEach(([pid,n,fields,sites,rounds])=>{
 for(let i=0;i<n;i++){const pos=sites[Math.floor(r()*sites.length)];
  const to=aa[Math.floor(r()*20)];
  const ip=Math.round((.32+r()*.64)*1000)/1000;
  const lit=r()>.75;
  const m={};
  if(fields.indexOf('dTm')>=0)m.dTm=Math.round((-2+ip*9)*10)/10;
  if(fields.indexOf('kd')>=0){m.kd=Math.round((.6+(1-ip)*22)*10)/10;
    m.kdLogSd=Math.round((.08+r()*.22)*100)/100}
  if(fields.indexOf('kcat')>=0)m.kcat=Math.round((1.2+ip*7.4)*100)/100;
  if(fields.indexOf('km')>=0)m.km=Math.round((12+(1-ip)*180)*10)/10;
  DB.cands.push({pid:pid,id:'V-'+String(++no).padStart(3,'0'),mut:'N'+pos+to,pos:pos,to:to,
   iptm:ip,rmsd:Math.round((.8+(1-ip)*4.2)*100)/100,dev:Math.round((.4+ip*.58)*100)/100,

   这个关系决定了「哪条路走通了、哪条路走死了」。设计页已经在说「最优亲本延伸」，

   规则：亲本只能从更早轮次里**有结果**的变体里挑——没测过的不能当亲本，
   因为那等于拿一条不知道好坏的序列当起点。 */
function seedVariantHistory(){
  DB.projects.forEach(project=>{
    const records=DB.cands.filter(c=>c.pid===project.id),seen=new Map();
    const rounds=[...new Set(records.map(c=>c.firstRound))].sort((a,b)=>a-b);
    rounds.forEach(rn=>{
      const pool=records.filter(c=>c.firstRound<rn&&c.disposition==='measured');
      records.filter(c=>c.firstRound===rn).forEach((c,j)=>{
        const pa=pool.length?pool[(j*7+rn*3)%pool.length]:null;
        c.parent=pa?pa.id:null;const base=pa?pa.muts.slice():[];
        const mutation='N'+c.pos+c.to;
        const k=base.findIndex(m=>m.replace(/^[A-Z]/,'').replace(/[A-Z]$/,'')===String(c.pos));
        if(k>=0)base[k]=mutation;else base.push(mutation);
        c.muts=base;c.mut=base.join('/');
        const key=base.slice().sort().join('+'),first=seen.get(key);
        c.dupOf=first?first.id:null;
        if(first){c.disposition='deduped';c.m={}}else seen.set(key,c);
      });
    });

}
/* 查重。「查重排除」这个处置一直存在，但数据里有两条变体突变集完全相同却都没被标出来——
   一个声称会查重的产品里躺着没查出来的重复，比不查更糟。
   口径：突变集相同（与顺序无关）即为重复，保留第一条，其余标 deduped 并指向保留的那条。 */
/* 去重与谱系在 seedVariantHistory 中逐轮完成，避免先取亲本再把亲本去重。 */
function variantById(id){return DB.cands.find(c=>c.id===id)||null}
/* 从野生型到这条变体的完整路径。环路保护：坏数据不该让界面崩。 */
function lineageOf(c){const out=[];let cur=c,guard=0;
  while(cur&&guard++<12){out.unshift(cur);cur=cur.parent?variantById(cur.parent):null}
  return out}
/* 变体归到批次：R3 → B-2409；R4 的一半到 B-2411、一半到 B-2412（这两个批次宿主不同，

   R5 还没下单——这两种都没有批次，分组时退回该轮的计划上下文并标明是计划。 */
DB.cands.forEach((c,i)=>{

function kdCI(c){
  const m=c&&c.m, v=mv(c,'kd');
  if(!m||v==null||m.kdCiLevel!==0.95||!m.kdCiMethod||!m.kdCiSource)return null;
  const lo=m.kdCiLow,hi=m.kdCiHigh;
  return Number.isFinite(lo)&&Number.isFinite(hi)&&lo>0&&lo<=v&&hi>=v&&hi>=lo?{lo,hi}:null;
}
const kdFmt=c=>{const n=mv(c,'kd');if(n==null)return '—';return n<10?n.toFixed(1):Math.round(n)};
function kdCell(c){const ci=kdCI(c),v=mv(c,'kd');
  if(v==null)return `<span class="col" style="gap:0"><span class="num mut2">—</span><span class="t-xs mut2">${esc((DISPOSITION[c.disposition]||{n:'缺少有效值'}).n)}</span></span>`;
  return `<span class="col" style="gap:0"><span class="num">${kdFmt(c)} nM</span><span class="t-xs mut2 num">${ci?'95% CI '+ci.lo.toPrecision(3)+'–'+ci.hi.toPrecision(3):'未提供有效 95% CI'}</span></span>`;
}

/* 几何平均：对数空间求均值再还原 */
function kdGeoMean(list){
  const L=statCandidates(list).filter(c=>c.disposition==='measured'&&mv(c,'kd')!=null);
  if(!L.length)return NaN;
  const m=L.reduce((a,c)=>a+Math.log10(mv(c,'kd')),0)/L.length;
  return Math.pow(10,m);

      return {i:r.i, hit:hitStats(L,p), rate:tcpRates(L,p)}}).filter(x=>x.rate.n);
    const stuck=rt.primary!=null&&st.byMeasured===0&&rt.primary>0.1;
    return `<section class="card"><div class="card-h"><strong>目标与命中${ann('M5-F07')}</strong>

        <div class="col" style="gap:2px">

        <div class="col" style="gap:2px">

        <span class="grow"></span>
      </div>
      <p class="hint" style="margin-top:calc(var(--s4) * -1)">两个分母差的那部分就是测定失败与未测。分母写出来，是因为这两个数常被混着用。</p>

      <div class="row wrap" style="gap:var(--s3);padding-top:var(--s4);border-top:1px solid var(--line-2)">

        ${projFields(p).map(k=>`<span class="chip c-dry"><span class="sym">${FIELD[k].n}</span>${FIELD[k].unit}</span>`).join('')}
        <span class="t-sm mut2">测定方法 ${assayMethods(p).join('、')||'未填'}</span>
      </div>
      ${fieldMismatch(p).length?`<div style="border-left:2px solid var(--err);padding-left:var(--s4)">

        <p class="t-md mut" style="margin-top:4px">
          ${fieldMismatch(p).map(k=>`<span class="sym">${FIELD[k].n}</span> 需要 ${FIELD[k].from.join(' 或 ')}`).join('；')}，
          而这个项目的实验上下文里没有。要么补上测定方法，要么把这个字段从项目里去掉——
          留着它，表里会一直有一列永远是空的。</p></div>`:''}
      <div class="col" style="gap:var(--s3);padding-top:var(--s4);border-top:1px solid var(--line-2)">
        <span class="lbl">逐项达成率（分母：有结果 ${rt.n} 条）</span>
        ${[{n:'主目标　'+ruleText(t.primary),rate:rt.primary,count:rt.primaryN,pri:true}]
          .concat(rt.perConstraint.map(x=>({n:'约束　'+x.n+'（'+ruleText(x.rule)+'）',rate:x.rate,count:x.count})))

          <tbody>${perRound.map(x=>`<tr>
            <td class="num">Round ${x.i}</td><td class="num">${x.rate.n}</td>
            <td class="num">${x.hit.hits}</td>
            <td class="num" style="color:${x.hit.hits?'var(--dry)':'var(--err)'}">${pct(x.hit.byMeasured)}</td>
            <td class="num">${pct(x.rate.primary)}</td></tr>`).join('')}
          </tbody></table></div>
      </div>
    </div></section>`})()}

  <section class="card">
    <div class="card-h"><strong>轮次${ann('M1-F02')}</strong><span class="grow"></span>
      ${archived?'<span class="t-sm mut2">项目已归档，仅可查看</span>'
        :`<span class="t-sm mut2">当前轮次 ${esc(D.why)}</span>
          <button class="btn btn-gh" type="button" data-act="advance">确认收口</button>`}</div>
    <div class="card-b" style="display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">
    ${p.rounds.map(r=>{const[rs,rc]=STATE_MAP[r.state];const cur=r.i===S.round;
      return `<button class="card tile" type="button" data-round="${r.i}" style="text-align:left;cursor:pointer;padding:0;${cur?'border-color:var(--dry);box-shadow:0 0 0 3px var(--dry-soft)':''}">
      <div class="card-b col" style="gap:var(--s2)">
        <div class="row"><strong class="t-md num">Round ${r.i}</strong><span class="grow"></span><span class="chip ${rc}">${rs}</span></div>
        <div class="t-sm mut2 num">${r.v} 变体 · ${r.r} 回流 · ${r.ma}</div>

      </div></button>`}).join('')}
    </div>
    <div class="card-b col" style="gap:var(--s4);padding-top:var(--s4)">
      <div class="col" style="gap:var(--s2)">
        <span class="lbl">本轮批次</span>
        ${BATCHES_OF().filter(x=>x.round===cur.i).map(x=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line-2)">
          <span class="t-md num" style="min-width:76px">${x.id}</span>
          <span class="t-sm mut2" style="min-width:68px">${x.vendor}</span>
          <span class="chip ${x.status==='done'?'c-ok':'c-wet'} grow">${mapStatus(x.status)}</span>

<details class="why"><summary>为什么这样定</summary><div class="why-b">方向只有一个：服务商 → 批次 → 轮次。唯一保留人工的是「确认收口」——那是人的判断，数据推不出来。</div></details>
    </div>

  <div style="display:grid;gap:var(--s6);grid-template-columns:repeat(auto-fit,minmax(336px,1fr))">
    <section class="card">
      <div class="card-h"><strong>活动${ann('M1-F03')}</strong>
        <span class="chip c-mut">不可编辑</span></div>
      <div class="card-b col" style="gap:0;padding-block:0">
      ${DB.acts.map((x,i)=>`<div class="row" style="align-items:flex-start;gap:var(--s3);padding:var(--s4) 0;${i<DB.acts.length-1?'border-bottom:1px solid var(--line-2)':''}">
        <span class="chip ${x.k==='dry'?'c-dry':x.k==='wet'?'c-wet':'c-err'}">${x.k==='dry'?'计算':x.k==='wet'?'实验':'异常'}</span>
        <span class="grow col" style="gap:2px"><span class="t-md">${esc(x.t)}</span>
          <span class="t-sm mut2 num">Round ${x.r} · ${esc(x.at)} · ${esc(x.by)}</span></span>
      </div>`).join('')}
      </div>
      <div class="card-b" style="padding-top:var(--s4)">
        <div class="row"><span class="hint grow">会改变结论的动作都会留痕，记录只能追加更正，不能改也不能删。</span>
          <button class="btn btn-gh" type="button" data-act="amend">追加更正</button></div>

      <div class="card-b col" style="gap:var(--s5)">
      ${CLAIMS.map(c=>{const cov=evCoverage(c);
        return `<div class="col" style="gap:var(--s3)">
        <div class="row wrap" style="gap:var(--s3)">
          <p class="t-md grow" style="font-weight:550;line-height:1.5;min-width:220px">${esc(c.text)}</p>

            六要素 ${EV_KINDS.length-cov.missing.length}/${EV_KINDS.length}</span></div>
        <div class="row wrap" style="gap:var(--s2)">
          ${EV_KINDS.map(([n])=>`<span class="chip ${cov.have.has(n)?'c-ok':''}"
            style="${cov.have.has(n)?'':'opacity:.5'}" title="${cov.have.has(n)?'已挂证据':'缺这一类'}">${n}</span>`).join('')}
        </div>
        ${cov.missing.length?`<p class="t-sm" style="color:var(--err)">缺 ${cov.missing.join('、')}——

        ${c.ev.map(e=>`<div class="row" style="align-items:flex-start;gap:var(--s3)">

          <span class="col grow" style="gap:1px">
            <span class="t-sm mut">${esc(e.t)}</span>
            <span class="t-xs mut2 num">${esc(evDetail(e))}${evValid(e)?'':'　⚠ '+EV_MAP[e.k][4]}</span></span>

      </div>`}).join('')}
        <p class="hint">六要素口径与端砚一致：文献、数据、代码、工具调用、计算结果、实验记录。</p>
<details class="why"><summary>为什么要凑齐六类</summary><div class="why-b">缺字段的证据不予接受。三个月后回头看，没有版本号和 n 值的数字没人说得清是怎么来的，等于没有。
少了数据与代码更糟：结论连重跑的入口都没有。端砚的证据链就是按这六类组织的，这里对齐它的口径，
是为了这条链能直接接上去，而不是到时候再做一次映射。</div></details>
      </div>
    </section>

    ${(function(){const sc=reviewSelfCheck();
      const localN=REVIEW_DIMS.filter(d=>d.local).length;
      const pass=REVIEW_DIMS.filter(d=>d.local&&sc[d.k]&&sc[d.k].ok).length;
      return `<section class="card"><div class="card-h"><strong>评审七维${ann('M8-F08')}</strong>
        <span class="grow"></span>

        <div class="row wrap" style="gap:var(--s3)">
          <span class="hint grow">正确性、产物质量、历史审查这三项，本地自查做不了——

/* M9 假设页。一轮从「这一轮要回答什么问题」开始。 */
V.hypo=()=>{const p=PRJ(),r=p.rounds.find(x=>x.i===S.round)||p.rounds[p.rounds.length-1];
  const hs=hypoOf(p.id).sort((a,b)=>b.round-a.round),picked=CANDS().filter(c=>S.sel.has(c.id)&&c.firstRound===r.i);
  const dr=designReview(picked.length?picked:CANDS().filter(c=>c.firstRound===r.i),CANDS());
  return `<div class="page">${roundTabs('hypo')}
    <div class="row wrap"><div class="col grow" style="gap:6px"><h1 style="font-size:26px">这一轮要回答什么</h1><p class="mut t-md">先定义候选集合和数值规则，再送检；机制与因果陈述需要单独验证。</p></div>
    <button class="btn btn-pri" type="button" data-act="newhypo">新建假设</button></div>
    ${!hs.length?'<section class="card"><div class="card-b">本项目尚未建立假设。</div></section>':''}
    ${hs.map(h=>{const ev=evidenceFor(h),vd=hypoVerdict(h),st=HYPO_STATE[vd.state];return `<section class="card"><div class="card-h"><strong>${esc(h.id)} · Round ${h.round}</strong><span class="grow"></span><span class="chip ${st[1]}">${st[0]}</span></div>
      <div class="card-b col" style="gap:var(--s4)"><p class="t-md" style="font-weight:550">${esc(h.text)}</p>
      <p class="t-sm mut2">涉及位点需同时出现：${h.sites.join('、')}。数值规则：${ruleText({k:h.effect.k,cmp:h.effect.dir,v:h.effect.v})}，并同时检查锁定时的项目约束。</p>
      <div class="col" style="gap:var(--s3)"><span class="lbl">可追查线索</span>${ev.rows.map(x=>`<div class="row wrap" style="gap:var(--s3);align-items:flex-start"><span class="chip">${x.v}</span><span class="col grow" style="min-width:220px"><span class="t-md">${x.k}</span><span class="t-sm mut2">${esc(x.say)}</span></span></div>`).join('')}</div>
      <div class="col" style="gap:var(--s3);border-top:1px solid var(--line);padding-top:var(--s4)"><span class="lbl">锁定与判定</span>
      ${h.pre?`<p class="t-md">支持线 ≥ ${pct(h.pre.support)} · 推翻线 &lt; ${pct(h.pre.refute)}<br><span class="t-sm mut2">${esc(h.pre.lockedAt)} · ${esc(h.pre.by)} · 锁定候选 ${h.pre.cohort?h.pre.cohort.length:'未记录'} 条</span></p>
      <p class="t-md">本批完整结果：${vd.rate==null?'—':pct(vd.rate)+'（'+vd.good+' / '+vd.n+'）'}</p><p class="hint">${esc(vd.why||'落在两条线之间，本批不能区分。')}</p>`:
      `<p class="hint">锁定时会固定本轮候选 ID、突变身份、效应阈值和项目约束；已有送检或结果的轮次不能追认预注册。</p><div>${h.round===r.i?`<button class="btn" type="button" data-lock="${h.id}">锁定判据</button>`:`<button class="btn" type="button" data-round="${h.round}" data-pid="${h.pid}">进入该轮次后锁定</button>`}</div>`}
      <p class="hint">达到数值规则只描述这个候选集合，不证明整句机制、因果关系或总体效应；演示数据不构成真实科研证据。</p></div></div></section>`}).join('')}
    <section class="card"><div class="card-h"><strong>实验单位与重复测量</strong></div><div class="card-b col" style="gap:var(--s3)"><p class="t-md">当前不能据重复孔数计算功效或最小可检出效应。</p><p class="hint">需要先记录独立表达或制备的实验单位、技术重复归属、配对方式，以及相同测定条件下的方差。技术重复用于评估测量波动，不会自动增加独立样本量。已有标准差也不能直接标为均值的 95% 置信区间。</p></div></section>
    <section class="card"><div class="card-h"><strong>本批覆盖检查</strong></div><div class="card-b col" style="gap:var(--s3)"><p class="t-md">本批 ${dr.n} 条候选 · ${dr.pos.length} 个位点 · 最高 ${dr.maxOrder} 重突变</p><p class="t-md">按本批已出现的替换加野生型枚举，全组合为 ${Number.isSafeInteger(dr.full)?dr.full.toLocaleString():'超出可精确显示范围'} 种（未含重复）。</p><p class="hint">${dr.levels.map(x=>'位点 '+x.pos+'：'+x.n+' 个水平').join('；')||'尚无候选'}</p><p class="hint">${dr.noAlone.length?'以下位点没有可用单突变测定记录：'+dr.noAlone.join('、')+'。':'已发现各位点的单突变测定记录。'} 历史条件可能不同；此处仅检查覆盖，未检查设计矩阵的秩、混杂、基线匹配和误差结构，不能断言主效应可分离。</p><p class="hint">上位效应检验至少需要匹配的野生型、单突变与组合突变，并先指定加和或乘法尺度。出现过一个单突变不等于验证了所有氨基酸替换。</p></div></section>
  </div>`};

V.round=()=>{const p=PRJ();const r=p.rounds.find(x=>x.i===S.round)||p.rounds[p.rounds.length-1];
 const _tabs=roundTabs('round');
 const pass=CANDS().filter(c=>c.iptm>=S.gate).length;const[rs,rc]=STATE_MAP[r.state];
 return `<div class="page">
  ${_tabs}
  <div class="row wrap">
    <div class="col grow" style="gap:6px"><div class="row"><h1 style="font-size:26px;letter-spacing:-.03em">Round ${r.i}</h1><span class="chip ${rc}">${rs}</span></div>
      <p class="mut t-md">${esc(r.note)}</p></div>

/* ================= M1 项目与轮次 ================= */
/* 批次：状态由服务商拥有，我们只镜像。一轮可以有多个批次。 */
/* 批次也要带项目。此前 BATCHES 是全局表，p2/p3 会把 p1 的批次算成自己的，
   「这一轮用了哪些测定方法」于是跨项目串台。 */
const BATCHES=[
 {id:'B-2409',pid:'p1',round:3,vendor:'Adaptyv',status:'done',results:'all',n:72,
  ctx:{host:'CHO',assay:['SPR','DSF'],reps:'n = 3',buffer:'HBS-EP+',temp:'25℃'}},
 {id:'B-2411',pid:'p1',round:4,vendor:'Adaptyv',status:'done',results:'partial',n:96,
  ctx:{host:'CHO',assay:['SPR','DSF'],reps:'n = 3',buffer:'PBS pH 7.4',temp:'25℃'}},
 /* 同一轮的第二个批次换了宿主——这正是上下文不能挂在轮次上的理由。 */
 {id:'B-2412',pid:'p1',round:4,vendor:'Adaptyv',status:'in_production',results:'none',n:96,
  ctx:{host:'HEK293',assay:['BLI'],reps:'n = 3',buffer:'PBS pH 7.4',temp:'25℃'}}];
/* 重训尝试：可能失败、可能退步回滚。轮次指向的是尝试，不是结果。 */
/* 重训是「尝试」，不是必然成功的事件。轮次指向尝试，这样才查得到「那一轮试过但没用上」。 */
const RETRAINS=[
 {round:2,at:'2026-10-12 16:05',batch:'B-2407',n:44,from:'v1',to:'v1',before:.58,after:.54,
  status:'rolled_back',measured:30,failed:14},
 {round:3,at:'2026-10-28 09:40',batch:'B-2409',n:56,from:'v1',to:'v2',before:.58,after:.61,
  status:'active',measured:41,failed:15},
 {round:4,at:'2026-11-11 14:19',batch:'B-2411',n:93,from:'v2',to:'v3',before:.61,after:.68,
  status:'active',measured:71,failed:22}];
RETRAINS.forEach(r=>r.pid=r.pid||'p1');
DB.cands.forEach(c=>{const b=BATCHES.find(x=>x.pid===c.pid&&x.id===c.batch);
  if(b&&b.results==='none'&&['measured','failed'].includes(c.disposition)){c.disposition='ordered';c.m={}}});
seedVariantHistory();
const RETRAIN_STATUS={active:['已启用','c-ok'],rolled_back:['退步，已回滚','c-err'],
  failed:['训练失败','c-err'],running:['训练中','c-dry']};

/* 轮次状态是推导态，不是手工态。
   方向只有一个：服务商 → 批次 → 轮次。不存在反过来改。 */
const ROUND_LABEL={active:'进行中',assay:'送检中',reflux:'回流中',done:'已归档'};
function deriveRound(roundNo,archived){
  if(archived)return {state:'done',why:'用户已确认收口'};
  const bs=BATCHES_OF().filter(b=>b.round===roundNo);
  if(!bs.length){const r=PRJ().rounds.find(x=>x.i===roundNo);
    return r&&r.state!=='active'?{state:r.state,why:'历史轮次记录；本演示未列出对应批次'}:{state:'active',why:'尚无送检批次'}}
  if(bs.every(b=>b.status==='draft'))return {state:'active',why:'批次都还是草稿'};
  if(!bs.every(b=>b.status==='done'))
    return {state:'assay',why:`${bs.filter(b=>b.status!=='done').length} 个批次未完成`};
  const rt=RETRAINS.find(r=>r.pid===S.pid&&r.round===roundNo);
  if(!rt)return {state:'reflux',why:'批次全部完成，重训尚未进行'};
  return {state:'reflux',why:'重训已完成，等待人工确认收口'};
}

/* 卡片页脚三个数字由轮次实时聚合，不手填 */
function aggregate(p){
  return {rounds:p.rounds.length,
    variants:p.rounds.reduce((a,r)=>a+r.v,0),
    returned:p.rounds.reduce((a,r)=>a+r.r,0)};
}
/* 证据链：计算类必须带模型版本，实验类必须带批次与 n */
/* 证据链六要素，口径对齐端砚（E2，上海 AI 实验室官方发布）：
   文献、数据、代码、工具调用、计算结果、实验记录。
   之前这里只有 计算 / 实验 / 文献 三类——少了 数据、代码、工具调用。
   少的那三类恰好是「能不能重跑」的关键：没有输入数据和代码，结论就只是一句话。
   所以不但要能挂这三类，还要把缺哪一类**显式标出来**，不能靠「有四条证据」糊过去。 */
const EV_KINDS=[
  ['文献','c-mut',  e=>!!e.ref,                  'ref',  '需出处'],
  ['数据','c-mut',  e=>!!(e.dataset&&e.rows),    'dataset','需数据集与条数'],
  ['代码','c-dry',  e=>!!(e.repo&&e.commit),     'repo', '需仓库与 commit'],
  ['工具调用','c-dry',e=>!!(e.tool&&e.ver),      'tool', '需工具名与版本'],
  ['计算','c-dry',  e=>!!e.model,                'model','需模型版本'],
  ['实验','c-wet',  e=>!!(e.batch&&e.n),         'batch','需批次号与 n 值']];
const EV_MAP={};EV_KINDS.forEach(k=>EV_MAP[k[0]]=k);
function evValid(e){const k=EV_MAP[e.k];return k?k[2](e):false}
function evDetail(e){
  if(e.k==='计算')return `任务 ${e.task} · 模型 ${e.model}`;
  if(e.k==='实验')return `批次 ${e.batch} · n=${e.n} · 宿主 ${e.host}`;
  if(e.k==='数据')return `${e.dataset} · ${e.rows} 条`;
  if(e.k==='代码')return `${e.repo} @ ${e.commit}`;
  if(e.k==='工具调用')return `${e.tool} ${e.ver}`;
  return e.ref||'';
}
/* 六要素覆盖：哪几类有、哪几类缺。缺的要点名。 */
function evCoverage(c){
  const have=new Set(c.ev.filter(evValid).map(e=>e.k));
  return {have:have, missing:EV_KINDS.map(k=>k[0]).filter(n=>!have.has(n))};
}
/* 评审七维，口径对齐端砚的评审智能体（E2）：
   需求完成度、正确性、证据与来源、可复现性、产物质量、工具执行、历史审查。

   为什么要在产品里立这个面板：这个项目到现在没有任何第三方评审——
   实现、验收、走查都是同一方做的。平台恰好有一个独立评审能力，
   那就应该把它的七个维度摆在产品里，而不是自己另造一套「自验证」。

   四项我们能在本地自查，三项不能——不能的那三项**明说需要端砚的评审智能体**，
   不拿自查去冒充评审。 */
const REVIEW_DIMS=[
 {k:'need', n:'需求完成度', what:'目标达成到什么程度', local:true},
 {k:'correct', n:'正确性', what:'结论能否被独立重新推出来', local:false},
 {k:'evidence',n:'证据与来源', what:'每条结论的六要素是否齐全', local:true},
 {k:'repro', n:'可复现性', what:'复现包是否能在相同条件下重跑', local:true},
 {k:'artifact',n:'产物质量', what:'导出物能否被下游直接用', local:false},
 {k:'tool', n:'工具执行', what:'工具调用是否真的成功过', local:true},
 {k:'history',n:'历史审查', what:'上一轮遗留问题是否复查', local:false}];
function reviewSelfCheck(){
  const P=PRJ(), st=hitStats(CANDS(),P), t=tcpOf(P);
  const goal=t&&t.primary?ruleText(t.primary):'（本项目未设结构化目标）';
  const cov=CLAIMS.map(evCoverage);
  const full=cov.filter(x=>!x.missing.length).length;
  const keyKinds=['数据','代码'];
  const reproOk=CLAIMS.every(c=>keyKinds.every(k=>evCoverage(c).have.has(k)));
  return {
    need:{ok:st.hits>0,
      say:st.hits>0?`已有 ${st.hits} 条命中（${goal} 且约束全满足）`
                   :`命中 0 条，主目标 ${goal} 尚未与约束同时满足`},
    evidence:{ok:full===CLAIMS.length,
      say:`${full}/${CLAIMS.length} 条结论六要素齐全`+
        (full<CLAIMS.length?`；缺口：${cov.filter(x=>x.missing.length).map(x=>x.missing.join('、')).join('｜')}`:'')},
    repro:{ok:reproOk,
      say:reproOk?'每条结论都挂了数据与代码，复现包三件套齐全'
                 :'有结论没挂数据或代码，相同条件下重跑不出来'},
    /* 「没报错」不等于「成功过」。从没调用过的工具不能算自查通过——
       那正是把空白当成绿色，和被预先勾好的质检框一个毛病。 */
    tool:(function(){
      const st=LS.get('mstat',null);          // {ok:bool, at:'…', msg:'…'}，连通性测试写入
      if(!st)return {ok:false,say:MC.ready()?'密钥已填，但还没成功调用过——去设置页跑一次连通性测试'
                                            :'基模未配置密钥，尚未成功调用过'};
      return {ok:!!st.ok, say:st.ok?`最近一次调用成功（${st.at}）`:`最近一次调用失败：${st.msg||'未知错误'}`};
    })()
  };
}
/* ================= M9 假设与实验设计 =================
   研究员关心的是：我有一个想法，怎么佐证它、怎么验它、这批实验能不能验得出来。
   而这个产品在加这一块之前只回答「怎么让这个数变大」——它是个优化引擎，不是科研仪器。
   数据模型里原本只有「结论」（CLAIMS，事后的），**没有「假设」**。

   一条假设是可证伪的陈述 + 它覆盖哪些位点 + 预期效应的方向与大小。 */
const HYPO=[
 {id:'H-01',pid:'p1',round:4,
  text:'N55 区域的突变能在不损失亲和力的前提下把 ΔTm 提到 +5℃ 以上',
  sites:[55],effect:{k:'dTm',dir:'>=',v:5},
  /* 预先声明的判据。锁定之后不能改——事后调判据等于没有判据。 */
  pre:{support:0.20,refute:0.05,lockedAt:'2026-11-05 09:12',by:'张哲娴'},
  state:'testing'},
 {id:'H-02',pid:'p1',round:3,
  text:'W33 位点任何突变都会破坏折叠',
  sites:[33],effect:{k:'iptm',dir:'<=',v:0.5},
  pre:{support:0.60,refute:0.20,lockedAt:'2026-10-21 15:40',by:'李'},
  state:'testing'},
 {id:'H-03',pid:'p1',round:5,
  text:'N46 与 N97 的双突变有正向上位效应',
  sites:[46,97],effect:{k:'dTm',dir:'>=',v:6},
  pre:null,state:'draft'}];
function hypoOf(pid,round){return HYPO.filter(h=>h.pid===(pid||S.pid)&&(round==null||h.round===round))}
const HYPO_STATE={draft:['草稿','','尚未锁定候选集合与数值规则'],
  testing:['待完成','c-dry','锁定候选仍有未完成结果'],
  supported:['本批达到支持线','c-ok','仅描述锁定候选的筛选结果'],
  refuted:['本批低于推翻线','c-err','仅描述锁定候选的筛选结果'],
  inconclusive:['无法判定','c-wet','信息或设计不足，不等于假设被推翻']};
const posOfMut=m=>{const x=/^[A-Z](\d+)[A-Z]$/.exec(String(m));return x?Number(x[1]):NaN};
function hitsSite(c,sites){const ps=(c.muts||[c.mut]).map(posOfMut);return sites.length>0&&sites.every(p=>ps.includes(p))}
function hypothesisSignature(c){return (c.muts||[c.mut]).slice().sort().join('/')}
function evidenceFor(h){
  const rel=statCandidates(CANDS(h.pid)).filter(c=>hitsSite(c,h.sites));
  const measured=rel.filter(c=>c.disposition==='measured'&&mv(c,h.effect.k)!=null&&!c.statsConflict);
  const lit=rel.filter(c=>c.ref),fold=rel.filter(c=>Number.isFinite(c.iptm)&&c.iptm>=S.gate).length;
  const good=measured.filter(c=>ruleOk({k:h.effect.k,cmp:h.effect.dir,v:h.effect.v},c)).length;
  return {rel,measured,支持:0,不支持:0,rows:[
    {k:'文献线索',v:'待核实',say:lit.length+' 条记录带文献字段；尚未核对原文、方向和适用条件，不能据此认定支持。'},
    {k:'进化信息',v:'待核实',say:'需要可追溯的序列比对与位点保守性定义；保守性分数不能直接证明目标效应。'},
    {k:'结构筛选',v:'描述',say:`${rel.length} 条同位点组合中，${fold} 条达到当前 ipTM 闸门。ipTM 是复合物界面预测置信度，不证明单体折叠、结合活性或稳定性。`},
    {k:'项目记录',v:'描述',say:`${measured.length} 条有有效字段，${good} 条达到数值阈值。跨批次、适应性筛选与多重比较尚未校正；演示记录不构成真实实验证据。`}
  ]};
}
function freezeHypothesis(h,support,refute){
  if(h.pid!==S.pid||h.round!==S.round)return {ok:false,why:'请先进入该假设所属项目与轮次，再锁定判据。'};
  if(h.pre)return {ok:false,why:'判据已锁定，不能覆盖。'};
  if(!Number.isFinite(support)||!Number.isFinite(refute)||refute<0||support>1||refute>=support)return {ok:false,why:'需满足 0 ≤ 推翻线 < 支持线 ≤ 1。'};
  if(!FIELD[h.effect.k]||!['>=','<='].includes(h.effect.dir)||!Number.isFinite(h.effect.v))return {ok:false,why:'效应规则无效。'};
  const round=CANDS(h.pid).filter(c=>c.firstRound===h.round);
  if(round.some(c=>['measured','failed','ordered'].includes(c.disposition)))return {ok:false,why:'本轮已有送检或结果，不能追认“送检前锁定”；请在新轮次建立验证。'};
  const selected=round.filter(c=>S.sel.has(c.id));
  const cohort=statCandidates(selected.length?selected:round).filter(c=>hitsSite(c,h.sites)&&!['deduped','untested'].includes(c.disposition));
  if(!cohort.length)return {ok:false,why:'没有同时覆盖所有涉及位点的本轮候选；先准备候选再锁定。'};
  const P=DB.projects.find(p=>p.id===h.pid),t=tcpOf(P);
  const rules=[{k:h.effect.k,cmp:h.effect.dir,v:h.effect.v}].concat(t?t.constraints:[]);
  h.pre={support,refute,lockedAt:nowStamp(),by:'张哲娴',registered:true,statement:h.text,
    sites:h.sites.slice(),rules:JSON.parse(JSON.stringify(rules)),
    cohort:cohort.map(c=>({id:c.id,signature:hypothesisSignature(c)}))};

}
function hypoVerdict(h){
  if(!h.pre)return {state:'draft',rate:null,n:0,why:'尚未锁定。'};
  const p=h.pre;
  const unknown=why=>({state:'inconclusive',rate:null,n:0,why});
  if(!p.registered||!Array.isArray(p.cohort)||!p.cohort.length||!Array.isArray(p.rules))return unknown('旧演示记录没有锁定候选集合和规则快照，不能作为预注册验证。');
  if(!p.rules.length||!FIELD[p.rules[0].k]||FIELD[p.rules[0].k].kind!=='assay')return unknown('计算置信度不能用来证实折叠或湿实验效应；当前规则只可作计算筛选。');
  if(/上位|协同|epistasis/i.test(p.statement||h.text))return unknown('上位效应需要同条件下的野生型、两条单突变和双突变，并预先指定加和尺度；绝对阈值不足以检验。');
  const all=CANDS(h.pid),rel=p.cohort.map(x=>all.find(c=>c.id===x.id));
  if(rel.some((c,i)=>!c||hypothesisSignature(c)!==p.cohort[i].signature))return unknown('候选丢失或序列身份已变化，锁定集合不再完整。');
  if(rel.some(c=>!['measured','failed'].includes(c.disposition)))return {state:'testing',rate:null,n:0,why:'等待锁定集合全部结束，避免边看结果边提前停止。'};
  if(rel.some(c=>c.disposition!=='measured'||!completeRules(c,p.rules)))return unknown('有测定失败或判据字段缺失；不能把未知值当作阴性。');
  const contexts=rel.map(c=>ctxOf(c));
  if(contexts.some(x=>x.planned)||new Set(contexts.map(x=>JSON.stringify(x.ctx))).size!==1)return unknown('缺实际实验上下文或跨条件混合，不能直接合并判定。');
  const good=rel.filter(c=>p.rules.every(r=>ruleOk(r,c))).length,rate=good/rel.length;
  return {state:rate>=p.support?'supported':rate<p.refute?'refuted':'inconclusive',rate,n:rel.length,good,
    why:'仅描述锁定候选是否达到数值规则及约束；未做总体推断、显著性检验或机制验证。'};
}

/* ---- 设计实验（一）：可检出效应 ----
   两样本均值比较，α=0.05 双侧，功效 80%：δ = 2.80 · σ · √(2/n)
   σ 必须来自本项目自己的重复数据。没有重复数据就给不出来——
   这时候要说「先测重复」，而不是编一个 σ。 */
function detectable(k,nrep){
  const f=FIELD[k];if(!f)return null;
  return {sigma:null,k:k,n:Number.isInteger(nrep)&&nrep>0?nrep:3,
    why:'尚不能计算：当前记录没有区分技术重复与独立实验单位，也没有与本轮条件匹配的组间方差和比较设计。重复孔数不能直接作为统计样本量 n。'};
}

/* ---- 设计实验（二）：这板子能不能分辨主效应 ----
   依据：部分因子设计那篇（bioRxiv 298273）。七个位点两水平全因子 128 条，
   1/8 部分因子 16 条就能估主效应，工作量降为 1/8；
   代价是二因子效应之间部分混杂，必须说清谁和谁混。 */
function designReview(list,history){
  const live=statCandidates(list),sets=live.map(c=>(c.muts||[c.mut]).filter(Boolean));
  const pos=[...new Set(sets.flat().map(posOfMut).filter(Number.isFinite))].sort((a,b)=>a-b);
  const levels={};pos.forEach(p=>{levels[p]=new Set(['WT']);sets.forEach(ms=>ms.filter(m=>posOfMut(m)===p).forEach(m=>levels[p].add(m)))});
  const hist=statCandidates(history||[]).filter(c=>c.disposition==='measured'&&!c.statsConflict);
  const aloneOf={};pos.forEach(p=>{aloneOf[p]=hist.filter(c=>{const m=c.muts||[c.mut];return m.length===1&&posOfMut(m[0])===p}).length});
  const noAlone=pos.filter(p=>!aloneOf[p]);
  return {n:live.length,pos,aloneOf,noAlone,conf:[],histN:hist.length,
    full:pos.length?pos.reduce((a,p)=>a*levels[p].size,1):0,
    levels:pos.map(p=>({pos:p,n:levels[p].size})),maxOrder:sets.length?Math.max(...sets.map(x=>x.length)):0};
}

/* 输入解析只去掉格式空白；非法字符不能被静默删除。 */
function fastaRecords(raw){
  const records=[];let cur=null;
  String(raw||'').replace(/\r\n?/g,'\n').split('\n').forEach((line,i)=>{
    if(/^\s*>/.test(line)){
      const hdr=line.replace(/^\s*>/,'').trim();
      cur={id:hdr.split(/[|\s]/)[0]||'',hdr:hdr,seq:'',line:i+1};records.push(cur);
    }else if(cur)cur.seq+=line.replace(/\s/g,'').toUpperCase();
  });return records;
}
function parseSeq(raw,fullHeader){
  const txt=String(raw||'').trim();
  if(!txt)return {ok:false,err:'空输入'};
  let fmt,chains=[];
  if(/^\s*>/.test(txt)){fmt='FASTA';chains=fastaRecords(txt);if(fullHeader)chains.forEach(c=>{c.id=c.hdr})}
  else if(/^\s*\d+\s+[A-Za-z]/.test(txt)||/[A-Za-z]{5,}\s+\d+\s*$/m.test(txt)){
    fmt='带编号';chains=[{id:'A',seq:txt.split(/\r?\n/).map(line=>line.replace(/^\s*\d+\s+/,'').replace(/\s+\d+\s*$/,'')).join('').replace(/\s/g,'').toUpperCase()}];
  }else{fmt='裸序列';chains=[{id:'A',seq:txt.replace(/\s/g,'').toUpperCase()}]}
  const ids=new Set();
  for(const c of chains){
    if(!c.id)return {ok:false,err:'FASTA 标题缺少链名',fmt,chains,raw:txt};
    if(!c.seq)return {ok:false,err:'链 '+c.id+' 的序列为空',fmt,chains,raw:txt};
    if(ids.has(c.id))return {ok:false,err:'链名重复：'+c.id,fmt,chains,raw:txt};
    ids.add(c.id);
  }
  if(!chains.length)return {ok:false,err:'没有解析出任何残基',fmt};
  const ns=[],bad=[];
  chains.forEach(c=>{for(let i=0;i<c.seq.length;i++){const ch=c.seq[i];
    if(AA20.indexOf(ch)>=0)continue;
    (NONSTD[ch]?ns:bad).push({chain:c.id,pos:i+1,ch})}});
  const tooLong=chains.filter(c=>c.seq.length>MAX_SEQ_LEN);
  return {ok:bad.length===0&&!tooLong.length,fmt,chains,ns,bad,raw:txt,
    tooLong:tooLong.map(c=>({id:c.id,len:c.seq.length})),total:chains.reduce((a,c)=>a+c.seq.length,0)};
}
/* CSV 引号、转义引号和引号内换行保留为一个单元格。 */
function csvRecords(raw){
  const out=[];let cells=[],cell='',quoted=false,closed=false,line=1,start=1,error='';
  const push=()=>{cells.push(cell.trim());if(cells.some(Boolean)||error)out.push({cells,line:start,error});cells=[];cell='';closed=false;error='';start=line+1};
  const txt=String(raw||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(quoted){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++}else{quoted=false;closed=true}}else{cell+=c;if(c==='\n')line++}continue}
    if(c==='"'&&!cell.trim()&&!closed){cell='';quoted=true;continue}
    if(c===','){cells.push(cell.trim());cell='';closed=false;continue}
    if(c==='\n'){push();line++;continue}
    if(c==='"'||(closed&&!/\s/.test(c)))error='CSV 引号格式不正确';
    cell+=c;
  }
  if(quoted)error='CSV 引号未闭合';
  if(cell||cells.length||error)push();
  return out;
}
function parseBatch(raw,max){
  max=Number.isInteger(max)&&max>0?Math.min(max,384):384;
  const txt=String(raw||'').trim(),acc=[],rej=[],dup=[],seen=new Set(),ids=new Set();
  if(!txt)return {acc,rej,dup,fmt:'—'};
  const fasta=/^\s*>/.test(txt),fmt=fasta?'FASTA':'CSV';
  let rows;
  if(fasta)rows=fastaRecords(txt);
  else{
    const csv=csvRecords(txt);let idCol=0,seqCol=1;
    if(csv.length){const h=csv[0].cells.map(x=>x.toLowerCase());
      const ni=h.findIndex(x=>['id','name','variant','variant_id','变体','变体名','名称'].includes(x));
      const si=h.findIndex(x=>['seq','sequence','序列'].includes(x));
      if(ni>=0&&si>=0){idCol=ni;seqCol=si;csv.shift()}}
    rows=csv.map(r=>({id:r.cells[idCol]||'',seq:(r.cells[seqCol]||'').replace(/\s/g,'').toUpperCase(),line:r.line,
      error:r.error||(r.cells.length<=Math.max(idCol,seqCol)?'列数不足，至少需要 变体名,序列':'')}));
  }
  rows.forEach(c=>{
    const no=c.line,id=c.id||'—',seq=c.seq;
    const reject=why=>rej.push({line:no,id,why});
    if(c.error){reject(c.error);return}
    if(!c.id){reject('变体名为空');return}
    if(/[\r\n]/.test(c.id)){reject('变体名不能包含换行');return}
    if(!seq){reject('序列为空');return}
    const ill=[...seq].find(x=>AA20.indexOf(x)<0&&!NONSTD[x]);
    if(ill){reject(`第 ${seq.indexOf(ill)+1} 位是非法字符「${ill}」`);return}
    if(seq.length>MAX_SEQ_LEN){reject(`长度 ${seq.length} 超过单条上限 ${MAX_SEQ_LEN}`);return}
    if(seen.has(seq)){dup.push({line:no,id,why:'序列与前面某条重复'});return}
    if(ids.has(c.id)){reject('变体名重复，请使用唯一名称');return}
    if(acc.length>=max){reject(`超出单次上限 ${max} 条`);return}
    seen.add(seq);ids.add(c.id);acc.push({id:c.id,seq,line:no});
  });return {acc,rej,dup,fmt};
}
function parseRanges(str,maxLen){
  const out=new Set(),bad=[],limit=Number.isInteger(maxLen)&&maxLen>0?Math.min(maxLen,MAX_SEQ_LEN):MAX_SEQ_LEN;
  String(str||'').split(/[,，;；]/).forEach(tok=>{
    tok=tok.trim();if(!tok)return;
    const m=tok.match(/^(\d+)\s*[-–~]\s*(\d+)$/);
    let a,b;
    if(m){a=Number(m[1]);b=Number(m[2]);if(a>b)[a,b]=[b,a]}
    else if(/^\d+$/.test(tok)){a=b=Number(tok)}
    else{bad.push(tok+'（格式无法识别）');return}
    if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a<1||b>limit){bad.push(tok+'（位点须在 1–'+limit+' 之间）');return}
    for(let i=a;i<=b;i++)out.add(i);
  });return {set:out,bad};
}
function fmtRanges(set){
  const a=[...set].sort((x,y)=>x-y);if(!a.length)return '';
  const out=[];let s0=a[0],prev=a[0];
  for(let i=1;i<=a.length;i++){const v=a[i];
    if(v===prev+1){prev=v;continue}
    out.push(s0===prev?String(s0):s0+'-'+prev);s0=v;prev=v}
  return out.join(', ');
}

/* 本地 Skill 草稿：方法编排定义，不执行工具，不连接 MCP。 */
const SKILL_STORE='skill_drafts_v1';
const TOOL_ID_MAP={'VenusFactory':'venusfactory','Protenix':'protenix','UniProt 取序':'uniprot-sequence','PDB 取结构':'pdb-structure','可开发性描述符':'developability','自洽回折校验':'fold-self-check','送检下单':'assay-order','回流解析':'reflux-parse','板位生成':'plate-layout','ThermoMPNN':'thermompnn','MSA 构建':'msa-build','证据链检索':'evidence-search'};
function toolCatalogue(){return DB.tools.filter(t=>TOOL_ID_MAP[t.n]).map(t=>({...t,id:TOOL_ID_MAP[t.n]}))}
const SKILL_FIELDS=[['name','名称',80,'例如：抗体稳定性候选复核'],['objective','科研目标',2000,'说明要回答的科研问题与适用范围'],['inputs','必需输入',2000,'每行一项，例如候选序列、参考结构、测定结果'],['context','必需实验上下文',2000,'例如表达宿主、测定方法、重复数；不适用时写明原因'],['steps','执行步骤',4000,'每行一步，写清顺序与引用工具 ID；这里只保存步骤，不会执行'],['outputs','预期输出',2000,'例如包含候选 ID、证据来源与风险标记的复核清单'],['acceptance','验收标准',2000,'说明如何判断输出齐全、可复核或需要人工退回'],['confirmations','人工确认点',2000,'每行一个，例如确认输入、确认候选取舍、送检前批准']];
function skillLines(s){return String(s||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}
function validateSkillDraft(d){
  const errors={};
  SKILL_FIELDS.forEach(([k,label,max])=>{if(typeof d[k]!=='string'||!d[k].trim())errors[k]='请填写'+label;else if(d[k].trim().length>max)errors[k]=label+'不能超过 '+max+' 字符'});
  const ids=toolCatalogue().map(t=>t.id);
  if(!Array.isArray(d.toolIds)||!d.toolIds.length||d.toolIds.some(id=>typeof id!=='string'||!ids.includes(id)))errors.toolIds='请选择至少一个目录中的工具';
  if(typeof d.steps==='string'&&skillLines(d.steps).length>20)errors.steps='执行步骤最多 20 条';
  if(typeof d.confirmations==='string'&&skillLines(d.confirmations).length>10)errors.confirmations='人工确认点最多 10 条';

function skillPublicData(d){

function saveSkillDraft(data,id){
  if(!canAct('newskill'))return {errors:{permission:'当前身份不能创建草稿，或工作区已变化。请关闭后重新打开。'}};
  const errors=validateSkillDraft(data);if(Object.keys(errors).length)return {errors};
  const rows=readSkillDrafts(),existing=id?rows.find(d=>d.id===id):null;
  if(id&&!existing)return {errors:{storage:'这份草稿已不存在，请关闭后重新打开。'}};
  if(!existing&&rows.length>=100)return {errors:{storage:'本机最多保存 100 份草稿，请先下载已有草稿。'}};
  if(rows.some(d=>d.id!==id&&d.name.toLocaleLowerCase()===data.name.trim().toLocaleLowerCase()))return {errors:{name:'已有同名草稿，请使用可区分的名称'}};
  const now=new Date().toISOString();
  const clean={id:existing?existing.id:'skill-'+(globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),createdAt:existing?existing.createdAt:now,updatedAt:now,toolIds:[...new Set(data.toolIds)]};
  SKILL_FIELDS.forEach(([k])=>{clean[k]=data[k].trim()});
  const draft=skillPublicData(clean);
  if(!LS.set(SKILL_STORE,existing?rows.map(d=>d.id===id?draft:d):[draft,...rows]))return {errors:{storage:'浏览器未能保存草稿。内容仍在表单中，请检查站点存储后重试。'}};
  return {draft};
}

/* MSA 是整条链上唯一的长耗时环节，粒度是轮次不是单条序列。

  cached:{n:'复用已有 MSA',note:'复用前需核对序列哈希、数据库与检索参数；不能仅凭同一靶点复用',priv:'不外流'}};

/* 适用场景来自 Tamarind 的 MPNN 系列产品页（E1）。数据截止与参数规模多数厂商未公开，
   不知道就写「未公开」，不编（规则 R3）。 */
const DESIGN_MODELS=[
 {id:'ProteinMPNN',fam:'MPNN',use:'通用逆折叠',cut:'2021-08',size:'1.7 M',why:'覆盖面最广，没有特殊偏好时的默认项'},
 {id:'SolubleMPNN',fam:'MPNN',use:'偏溶解度',cut:'未公开',size:'1.7 M',why:'训练集剔除了膜蛋白，偏向可溶表达'},
 {id:'HyperMPNN',fam:'MPNN',use:'偏热稳定',cut:'未公开',size:'未公开',why:'在嗜热菌蛋白上微调'},
 {id:'AbMPNN',fam:'MPNN',use:'针对抗体',cut:'未公开',size:'未公开',why:'在抗体结构上微调，CDR 区表现更好'},
 {id:'LigandMPNN',fam:'MPNN',use:'针对小分子复合物',cut:'未公开',size:'未公开',why:'显式建模配体原子'}];
const FOLD_MODELS=[
 {id:'AlphaFold2',fam:'AF',cut:'2018-04',size:'93 M',note:'单体折叠的事实基线'},
 {id:'Protenix',fam:'Protenix',cut:'按版本核对',size:'按版本核对',note:'v2 权重有单独限制，请核对官方许可'},
 {id:'ESMFold',fam:'ESM',cut:'2020-12',size:'690 M',note:'无需 MSA，快'}];
const PEERS=[['ThermoMPNN','预测点突变稳定性变化 ΔΔG，不能作为序列生成模型直接替换'],['IgDesign','同样面向抗体设计'],
 ['AntiFold','同样面向抗体，逆折叠路线'],['DiffAb','同为抗体设计，扩散路线']];

const CFG={design:'ProteinMPNN', fold:'AlphaFold2', verify:true, rmsd:2.0,
  sites:'34-42, 73-80', n:88, round:'Round 5',
  adv:{temp:'0.1', seed:'20363', steps:'200', recycles:'10'},
  budget:20, pauseSite:true, pauseSend:true, advOpen:false};
const famClash=()=>{
  const d=DESIGN_MODELS.find(m=>m.id===CFG.design), f=FOLD_MODELS.find(m=>m.id===CFG.fold);
  return !!(CFG.verify&&d&&f&&d.fam===f.fam);
};
function configErrors(){
  const errors=[],max=IN.parsed&&IN.parsed.chains&&IN.parsed.chains[0]?IN.parsed.chains[0].seq.length:MAX_SEQ_LEN;
  const sites=parseRanges(CFG.sites,max);
  if(!sites.set.size||sites.bad.length)errors.push('设计位点须为序列范围内的正整数或区间');
  if(!Number.isInteger(Number(CFG.n))||Number(CFG.n)<1||Number(CFG.n)>88)errors.push('候选数须为 1–88 的整数');
  if(!DESIGN_MODELS.some(m=>m.id===CFG.design))errors.push('设计模型尚未接入');
  if(CFG.verify&&!FOLD_MODELS.some(m=>m.id===CFG.fold))errors.push('回折模型尚未接入');
  if(!String(CFG.adv.temp).trim()||!Number.isFinite(Number(CFG.adv.temp))||Number(CFG.adv.temp)<=0)errors.push('采样温度须为大于 0 的有限数');
  ['seed','steps','recycles'].forEach(k=>{const n=Number(CFG.adv[k]);if(!String(CFG.adv[k]).trim()||!Number.isSafeInteger(n)||n<(k==='seed'?0:1))errors.push(({seed:'随机种子',steps:'扩散步数',recycles:'循环轮数'})[k]+'须为有效整数')});
  if(!Number.isFinite(Number(CFG.budget))||Number(CFG.budget)<=0)errors.push('预算须为大于 0 的有限数');
  if(CFG.verify&&(!Number.isFinite(Number(CFG.rmsd))||Number(CFG.rmsd)<0.5||Number(CFG.rmsd)>5))errors.push('RMSD 上限须在 0.5–5 Å 之间');
  if(!Number.isFinite(estHours()))errors.push('参数过大，无法估算算力');
  return errors;
}
const estHours=()=>Math.round((CFG.n*(+CFG.adv.steps/200)*(+CFG.adv.recycles/10)*0.077)*10)/10;
const estInk=()=>Math.round(estHours()*50);

V.config=()=>{
  const clash=famClash(), over=estHours()>CFG.budget;
  const D=DESIGN_MODELS.find(m=>m.id===CFG.design)||DESIGN_MODELS[0];
return `<div class="page">

V.results=()=>{

    const av=mv(a,k),bv=mv(b,k);
    if(av==null)return bv==null?0:1;
    if(bv==null)return -1;
    return (av-bv)*d});

  const lit=all.filter(c=>c.src==='文献推断');

return `<div class="page">
  ${_tabs}
  <div class="row wrap" style="align-items:flex-start">

        </div>`:''})()}

          .map(([k,v])=>`<div class="col" style="gap:2px"><span class="lbl">${k}</span>

      ${(function(){const L=fltApply(all),fp=L.filter(c=>c.iptm>=S.gate),on=fltCount()>0;

/* M2-F06 最后一条：结果页按实验上下文分组。
   不同宿主、不同测定方法、不同缓冲体系测出来的数不能直接比——
   放在同一张表里按同一列排序，等于在比不可比的东西。
   分组不是为了好看，是为了让人看见「这两段数来自不同条件」。 */
function ctxSig(c0){
  const {ctx,src,planned}=ctxOf(c0);
  const parts=[ctx.host,asList(ctx.assay).join('+'),ctx.buffer,ctx.temp].filter(Boolean);
  return {key:(planned?'plan|':'')+(parts.join('|')||'未填'),
    label:parts.length?parts.join(' · '):'未填实验上下文',
    src:src, planned:planned};
}
function groupRows(rows){
  const m=new Map();
  rows.forEach(c=>{const g=ctxSig(c);
    if(!m.has(g.key))m.set(g.key,{label:g.label,src:g.src,planned:g.planned,rows:[]});
    m.get(g.key).rows.push(c)});
  const multi=m.size>1;
  return [...m.values()].map(v=>[{label:v.label,src:v.src,planned:v.planned,warn:multi},v.rows]);
}

function greet(){const h=new Date().getHours();

/* 工作台主视觉：接触图。对角带 = 序列上相邻的残基必然接触；
   两块对称的离对角簇 = 两个结构域之间的界面。固定尺寸、硬边、带框。 */
function ribbonArt(){
  const N=16,cell=9,gap=2,q=cell+gap,S0=N*q-gap,PAD=9;
  let seed=7;const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648};
  let cells='';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const d=Math.abs(i-j);let v=0;
    if(d<=1)v=1;
    else if(d===2)v=.62;
    else if(d===3)v=.3;
    else if((i>=3&&i<=6&&j>=11&&j<=14)||(j>=3&&j<=6&&i>=11&&i<=14))v=.5+rnd()*.42;
    else if((i>=8&&i<=10&&j>=0&&j<=2)||(j>=8&&j<=10&&i>=0&&i<=2))v=.34+rnd()*.26;
    else if(rnd()<.045)v=.2;
    if(v)cells+=`<rect x="${(PAD+j*q).toFixed(1)}" y="${(PAD+i*q).toFixed(1)}" width="${cell}" height="${cell}" rx="1.5" fill="var(--dry)" opacity="${v.toFixed(2)}"/>`;
  }
  const T=S0+PAD*2;
  return `<svg width="${T}" height="${T}" viewBox="0 0 ${T} ${T}" aria-hidden="true">
    <rect x=".5" y=".5" width="${T-1}" height="${T-1}" rx="7" fill="none" stroke="var(--dry)" stroke-opacity=".3"/>
    ${cells}</svg>`;
}

/* Tokenize CIF quoted/multiline values before reading atom_site loops. */
function cifTokens(text){
  const out=[];let i=0;
  while(i<text.length){
    if(/\s/.test(text[i])){i++;continue}
    if(text[i]==='#'){while(i<text.length&&text[i]!=='\n')i++;continue}
    if(text[i]===';'&&(i===0||text[i-1]==='\n')){
      const end=text.indexOf('\n;',i+1);if(end<0)throw Error('mmCIF 多行文本未结束');
      out.push(text.slice(i+1,end));i=end+2;continue;
    }
    if(text[i]==="'"||text[i]==='"'){
      const q=text[i++],start=i;while(i<text.length&&!(text[i]===q&&(i+1===text.length||/\s/.test(text[i+1]))))i++;
      if(i===text.length)throw Error('mmCIF 引号未结束');out.push(text.slice(start,i++));continue;
    }
    const start=i;while(i<text.length&&!/\s/.test(text[i]))i++;out.push(text.slice(start,i));
  }

}

    if(!STRUCT_AA[o.resn]||!Number.isInteger(o.resi)||[o.x,o.y,o.z].some(x=>x==null))return;
    if(firstModel===null)firstModel=o.model;if(o.model!==firstModel)return;
    const key=residueKey(o.ch,o.resi,o.icode),old=per.get(key);

    if(!old||altScore(o.alt)>altScore(old.alt)||(altScore(o.alt)===altScore(old.alt)&&(o.occ||0)>(old.occ||0)))per.set(key,Object.assign(o,{key}));

    for(let i=0;i<tokens.length;i++){

      const end=i;i--;

        const group=get('group_PDB');if(group&&group!=='ATOM'&&group!=='HETATM')continue;
        add({serial:(p-start)/cols.length,atom:get('auth_atom_id','label_atom_id'),resn:get('auth_comp_id','label_comp_id'),ch:get('auth_asym_id','label_asym_id'),

          b:num(get('B_iso_or_equiv')),occ:num(get('occupancy')),x:num(get('Cartn_x')),y:num(get('Cartn_y')),z:num(get('Cartn_z')),model:get('pdbx_PDB_model_num')||'1'});

    perConstraint:t?t.constraints.map(r=>Object.assign({n:r.n||ruleText(r),rule:r},
      (()=>{const x=stats(r);return {rate:x.rate,count:x.count,denominator:x.n}})())):[]};
}
/* 统计单位是唯一候选变体。重复孔不增加候选数；无送检记录的“未测”不入已送检分母。 */
function hitStats(list,pr){
  const t=tcpOf(pr),L=statCandidates(list),rules=t?[t.primary].concat(t.constraints):[];
  const ordered=L.filter(c=>['ordered','measured','failed'].includes(c.disposition)||(c.disposition==='untested'&&!!c.orderedAt));
  const measured=L.filter(c=>c.disposition==='measured'&&t&&completeRules(c,rules));
  const hits=measured.filter(c=>isHit(c,pr));
  return {hits:hits.length,measured:measured.length,ordered:ordered.length,
    incomplete:L.filter(c=>c.disposition==='measured'&&!measured.includes(c)).length,
    byMeasured:measured.length?hits.length/measured.length:null,
    byOrdered:ordered.length?hits.length/ordered.length:null,list:hits};
}

/* C1 送检前的预期命中。做法上有两条路：训一个校准模型，或者用本项目历史实测外推。
   我们没有校准数据，所以走后者，并且把这件事写在界面上——
   一个来历不明的「预期命中率 18%」比没有更糟。 */
function forecast(n,pr){
  return {basis:'none',rounds:[],why:'暂无可校准的预期命中数：历史轮次的设计选择、测定条件和缺失比例不同，历史最高/最低命中率不是下一批的预测区间。'};
}

/* C2 这一轮该继续、重设计，还是收手。
   三个可测信号：边际收益（主目标达成率的轮间变化）、headroom（最好值距目标还差多少）、
   命中数趋势。给建议，不替人做决定——界面上要写清是哪三个数推出来的。 */
function roundAdvice(pr){
  const P=pr||PRJ(),t=tcpOf(P);if(!t||!FIELD[t.primary.k])return null;
  const f=FIELD[t.primary.k],per=P.rounds.map(r=>{
    const L=statCandidates(CANDS(P.id).filter(c=>c.firstRound===r.i));
    const values=L.filter(c=>c.disposition==='measured'&&!c.statsConflict).map(c=>mv(c,t.primary.k)).filter(v=>v!=null);
    return {i:r.i,rt:tcpRates(L,P),st:hitStats(L,P),best:values.length?(f.better==='high'?Math.max(...values):Math.min(...values)):null};
  }).filter(x=>x.rt.n>0);
  return {verdict:'review',per,field:f,primaryRule:t.primary,head:null,
    why:['以下只列当前记录中的最好值。不同批次、筛选集合及样本量会影响结果，尚未形成可比趋势。',
      '缺少匹配对照、独立重复和不确定性评估，不能自动判定平台期、建议放弃或证明目标已完成。请按实验设计复核后决定下一轮。']};
}

function controlAllocations(){
  const n=Math.max(0,Math.min(PLATE.fmt,Math.floor(Number(PLATE.ctrl)||0)));
  if(!n)return [];
  const types=OUR_CONTROLS.slice(0,Math.min(OUR_CONTROLS.length,n)),base=Math.floor(n/types.length),extra=n%types.length;
  return types.map((c,i)=>({...c,count:base+(i<extra?1:0)}));
}
function platePlan(){
  const [rows,cols,plates]=PLATE_FMT[PLATE.fmt],perPlate=rows*cols;
  const controls=controlAllocations().flatMap(c=>Array.from({length:c.count},()=>c));
  const selected=ROUND_CANDS().filter(c=>S.sel.has(c.id)),slots=[];
  let ci=0,vi=0;
  for(let p=1;p<=plates;p++){
    const nctrl=Math.floor(controls.length/plates)+(p<=controls.length%plates?1:0);
    for(let i=0;i<perPlate;i++){
      const well='ABCDEFGHIJKLMNOP'[Math.floor(i/cols)]+(i%cols+1);
      if(i<nctrl){const c=controls[ci++];slots.push({plate:p,well,kind:'control',variant:'',label:c.n,control:c.k});continue}
      const c=selected[vi++];
      slots.push(c?{plate:p,well,kind:'candidate',variant:c.id,label:c.id,control:'',eligible:selectable(c)&&c.iptm>=S.gate}
        :{plate:p,well,kind:'unassigned',variant:'',label:'待分配',control:''});
    }
  }
  return {rows,cols,plates,perPlate,slots,overflow:selected.slice(PLATE.fmt-controls.length),selected:selected.length};
}

  const picked=CANDS().filter(c=>S.sel.has(c.id));

const CAP=96, CTRL=8, USABLE=CAP-CTRL;
function fltApply(L){const f=S.flt;
  return L.filter(c=>(!f.noCys||!c.cys)&&(c.dev>=f.devMin)
    &&(f.src==='全部'||c.src===f.src)&&(!f.passOnly||c.iptm>=S.gate))}
function fltCount(){const f=S.flt;let n=0;
  if(f.noCys)n++;if(f.devMin>0)n++;if(f.src!=='全部')n++;if(f.passOnly)n++;return n}

/* M2-F02 公共库取回。先走真实接口，失败再回落到内置样本；错误区分三类 */
async function fetchAcc(){
  const v=(IN.acc||'').trim(), t=idType(v);
  IN.err=null;invalidateInput();
  if(!t){IN.err={kind:'标识符格式不对',
    msg:`「${v}」不符合任何一个库的编号规则。`,
    hint:'PDB 是四位且首位为数字（1BRS）；UniProt 形如 P00644；AFDB 形如 AF-P00644-F1。'};
    render();return}
  const requestId=++intakeRequestVersion,requestScope=JSON.stringify([S.pid,S.round]);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
  IN.busy=true;render();
  const urls={PDB:`https://www.rcsb.org/fasta/entry/${v.toUpperCase()}`,
    UniProt:`https://rest.uniprot.org/uniprotkb/${v.toUpperCase()}.fasta`,
    AFDB:`https://rest.uniprot.org/uniprotkb/${(v.match(/^AF-([A-Z0-9]+)-F\d+$/i)||[,''])[1].toUpperCase()}.fasta`};
  let txt=null,netErr=null,missing=false;
  try{
    const res=await fetch(urls[t],{headers:{Accept:'text/plain'},signal:controller.signal});
    if(res.status===404)missing=true;
    else if(!res.ok)netErr='HTTP '+res.status;
    else txt=await res.text();
  }catch(e){netErr=controller.signal.aborted?'请求超时':'网络或跨域错误'}finally{clearTimeout(timer)}
  if(requestId!==intakeRequestVersion||requestScope!==JSON.stringify([S.pid,S.round]))return;
  IN.busy=false;if(v!==(IN.acc||'').trim()){render();toast('标识符已修改，请重新取回');return}
  const key=Object.keys(BUILTIN).find(k=>k.toUpperCase()===v.toUpperCase());
  if(!txt&&key){
    const B=BUILTIN[key];
    IN.parsed=parseSeq(B.chains.map(c=>'>'+c.id+'|'+B.name+'\n'+c.seq).join('\n'));
    IN.parsed.pdb=key;IN.rawSeq=IN.parsed.raw;IN.confirmed=false;IN.dirty=false;IN.resErr=null;IN.editChains=null;IN.sel=new Set();
    IN.err={kind:'用的是内置样本',
      msg:`未从 ${B.src} 取得记录（${netErr||'无可用响应'}），已改用内置的这条记录。`,
      hint:'这是内置示例，不代表当前公共数据库中的记录。'};
    render();toast(`已载入 ${key}：${B.chains.length} 条链`);return;
  }
  if(missing){IN.err={kind:'库里没有这条',
    msg:`${t} 中不存在 ${v}。`,hint:'检查编号是否打错，或该条目是否已被撤销合并。'};render();return}
  if(netErr){IN.err={kind:'取回失败',
    msg:`请求 ${t} 时出错：${netErr}。`,
    hint:'可能是网络不通或跨域被拦。可改用「粘贴序列」直接贴入，或先试内置样本。'};render();return}
  IN.parsed=parseSeq(txt);IN.parsed.pdb=v.toUpperCase();IN.rawSeq=txt;
  IN.parsed.rawResp=txt;IN.confirmed=false;IN.dirty=false;IN.resErr=null;IN.editChains=null;IN.sel=new Set();render();
  toast(IN.parsed.ok?`已从 ${t} 取回：${IN.parsed.chains.length} 条链 ${IN.parsed.total} 个残基`:'已收到响应，但未解析出有效序列，请检查回显');
}

  'deepseek-flash':{label:'deepseek-flash',note:'DeepSeek-V4.1-Flash',

function modelConfig(c){
  if(!c||typeof c!=='object')throw new Error('CONFIG');
  let u;try{u=new URL(String(c.base||''))}catch(e){throw new Error('CONFIG')}
  const local=['localhost','127.0.0.1','[::1]'].includes(u.hostname);
  if((u.protocol!=='https:'&&!(local&&u.protocol==='http:'))||u.username||u.password||u.search||u.hash)throw new Error('CONFIG');
  const name=String(c.name||'').trim(),key=String(c.key||'').trim();
  if(!name||/[\r\n]/.test(name)||/[\r\n]/.test(key))throw new Error('CONFIG');
  return {base:u.href.replace(/\/$/,''),name,key};
}
const MC={
  cfg(){const c=LS.get('model',{});return {base:'https://api.deepseek.com',name:'deepseek-flash',key:'',...(c&&typeof c==='object'?c:{})}},
  save(c){const valid=modelConfig(c);try{localStorage.setItem('dy_model',JSON.stringify(valid))}catch(e){throw new Error('STORAGE')}LS.set('mstat',null)},
  ready(){try{return !!modelConfig(MC.cfg()).key}catch(e){return false}},
  async chat(messages,opt){
    const c=modelConfig(opt&&opt.cfg||MC.cfg());
    if(!c.key)throw new Error('NOKEY');
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);
    try{
      const res=await fetch(c.base+'/chat/completions',{
        method:'POST',redirect:'error',signal:controller.signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
        body:JSON.stringify({model:c.name,messages,stream:false,...(new URL(c.base).hostname==='api.deepseek.com'?{thinking:{type:'disabled'}}:{}),max_tokens:(opt&&opt.max)||900,
          temperature:(opt&&opt.temp)!=null?opt.temp:0.2})
      });
      if(!res.ok)throw new Error('HTTP:'+res.status);
      let j;try{j=await res.json()}catch(e){throw new Error('RESPONSE')}
      const content=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(typeof content!=='string'||!content.trim())throw new Error('RESPONSE');
      const n=j.usage&&j.usage.total_tokens;
      return {text:content,usage:Number.isSafeInteger(n)&&n>=0?{total_tokens:n}:null};
    }catch(e){
      if(controller.signal.aborted)throw new Error('TIMEOUT');
      if(/^HTTP:\d+$|^RESPONSE$/.test(String(e&&e.message)))throw e;
      throw new Error('NETWORK');
    }finally{clearTimeout(timeout)}
  }
};
function planDraft(raw){
  let j;try{j=JSON.parse(raw.replace(/^[^{]*/,'').replace(/[^}]*$/,''))}catch(e){return null}
  if(!j||typeof j!=='object'||Array.isArray(j))return null;
  if(!['target','objective','sites','assay'].every(k=>typeof j[k]==='string'))return null;
  if(!Number.isInteger(j.n)||j.n<1||j.n>88)return null;
  if(!Array.isArray(j.models)||j.models.some(v=>typeof v!=='string'))return null;
  if(!Array.isArray(j.missing)||j.missing.some(v=>typeof v!=='string'))return null;
  if(!j.gate||j.gate.metric!=='ipTM'||typeof j.gate.min!=='number'||!Number.isFinite(j.gate.min)||j.gate.min<0.3||j.gate.min>0.95)return null;
  return j;
}
function applyPlanDraft(j){
  if(!planDraft(JSON.stringify(j))){toast('草案字段不完整或参数无效，请重新生成');return false}
  const design=j.models.find(id=>DESIGN_MODELS.some(m=>m.id===id)),fold=j.models.find(id=>FOLD_MODELS.some(m=>m.id===id));
  const unknown=j.models.filter(id=>!DESIGN_MODELS.some(m=>m.id===id)&&!FOLD_MODELS.some(m=>m.id===id));
  if(j.missing.length||unknown.length){toast(j.missing.length?'草案仍有待确认信息，请补充需求后重新生成':'草案包含尚未接入的模型：'+unknown.join('、'));return false}
  CFG.n=j.n;CFG.sites=j.sites==='auto'?'':j.sites;if(design)CFG.design=design;if(fold)CFG.fold=fold;
  CFG.round='Round '+S.round;CFG.planSuggestion={target:j.target,objective:j.objective,assay:j.assay,gate:j.gate};

/* 最小 ZIP（仅存储，不压缩）*/
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const name of Object.keys(files)){
    const nb=enc.encode(name),db=enc.encode(files[name]),crc=crc32(db);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),
      ...u16(0),...u16(0),...u32(crc),...u32(db.length),...u32(db.length),
      ...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]), nb);
    off+=lh.length+nb.length+db.length;
  }
  const cs=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(Object.keys(files).length),...u16(Object.keys(files).length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}

  return d.roles.length===4&&new Set(d.cands.map(c=>c&&c.id)).size===d.cands.length&&d.cands.every(c=>c&&ids.has(c.pid)&&typeof c.id==='string'&&typeof c.mut==='string'&&c.m&&c.dims&&Array.isArray(c.muts)&&DISPOSITION[c.disposition]&&d.projects.find(p=>p.id===c.pid).rounds.some(r=>r.i===c.firstRound))&&d.batches.every(b=>b&&ids.has(b.pid));
}
function restoreWorkspace(){
  const saved=LS.get('workspace_v1',null);
  if(saved&&saved.version===1&&validWorkspace(saved.data)){
    const d=saved.data;DB.projects=d.projects;DB.cands=d.cands;DB.acts=d.acts;
    [[BATCHES,d.batches],[RETRAINS,d.retrains],[HYPO,d.hypotheses],[AUDIT,d.audit],[ROLES,d.roles]].forEach(([dest,src])=>dest.splice(0,dest.length,...src));
    if(d.roundWork&&typeof d.roundWork==='object'&&!Array.isArray(d.roundWork))Object.assign(ROUND_WORK,d.roundWork);
    workspaceRevision=saved.revision;
  }else if(saved){workspaceLoadError='本地工作区格式无效，已载入初始演示数据；原保存仍保留。'}
  Object.assign(S,normalizeLocation(S.route,S.pid,S.round));
  if(!S.sort||!['asc','desc'].includes(S.sort.dir))S.sort={k:'dTm',dir:'desc'};
  if(!S.flt||typeof S.flt!=='object'||Array.isArray(S.flt))S.flt={noCys:false,devMin:0,src:'全部',passOnly:false};
  if(!Number.isInteger(S.as)||S.as<0||S.as>=ROLES.length)S.as=0;
  workspaceReady=true;loadRound();workspaceLast=JSON.stringify(workspaceData());
}
function workspaceCurrent(){
  if(workspaceConflict||workspaceLoadError)return false;
  const saved=LS.get('workspace_v1',null);
  if((saved&&saved.revision||null)!==workspaceRevision){workspaceConflict=true;return false}
  return true;
}
function persistWorkspace(){
  if(!workspaceReady)return;stashRound();const data=workspaceData(),json=JSON.stringify(data);
  if(json===workspaceLast)return;
  if(!workspaceCurrent())return;
  const revision=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
  if(LS.set('workspace_v1',{version:1,revision,data})){workspaceRevision=revision;workspaceLast=json}
}
function paintSaveState(){
  let el=document.getElementById('savebar');const msg=workspaceLoadError||LS.error||(workspaceConflict?'另一个标签页更新了工作区。为防覆盖，本页编辑已暂停；刷新后继续。':'');

function editAllowed(roundBound=true){return can('edit')&&workspaceCurrent()&&(!roundBound||!roundReadOnly())}
function guardEditControls(){
  const groups=[
    ['[data-vadd],[data-vdel]',()=>editAllowed(false)],
    ['[data-role]',()=>S.as===0&&meRole().r==='负责人'&&workspaceCurrent()],
    ['[data-lock],[data-pick],#selAll,#gate,#gatenum,[data-pfmt],#ctrl,[data-etype],[data-emeth],[data-erep],[data-eenz],[data-estatus],[data-cx],[data-cxm],[data-cfg],[data-adv],[data-dm],[data-fold],#rm,#bd,[data-act2],[data-msa],[data-res],[data-chain],[data-bsrc],#res,#seqin,#bin,#acc',()=>editAllowed()]
  ];
  groups.forEach(([selector,allowed])=>view.querySelectorAll(selector).forEach(el=>{

    ['onclick','onchange','oninput'].forEach(event=>{const fn=el[event];if(!fn)return;el[event]=function(e){if(!allowed()){toast('当前身份、归档状态或工作区版本不允许修改');return}return fn.call(this,e)}});
  }));

function currentBatch(){return BATCHES_OF().filter(b=>b.round===S.round).slice(-1)[0]||null}
function orderProblem(pk){
  if(!pk.length)return '还没有选中任何变体';
  if(pk.some(c=>!selectable(c)))return '选中集含其他轮次、已送检或已有结果的变体，不能覆盖重送';
  if(pk.some(c=>!Number.isFinite(c.iptm)||c.iptm<S.gate))return '有变体未通过准入闸门，不能送检';
  if(pk.length>PLATE.fmt-PLATE.ctrl)return '选中条数超过孔板可用容量';
  if(pk.length>96)return '超出自助演示上限，需要人工报价';
  const t=EXP_TYPES.find(x=>x.k===WET.type);if(!t)return '实验类型无效';
  if(t.need.includes('enzyme')&&!String(WET.enzyme||'').trim())return '酶活类型必须填写酶';
  if(t.methods.length&&!t.methods.includes(WET.method))return '测定方法与实验类型不符';
  if(!Number.isInteger(WET.nrep)||WET.nrep<1||WET.nrep>5)return '重复数必须为 1–5 的整数';
  const cx=roundCtx();if(!String(cx.host||'').trim()||!asList(cx.assay).length||!String(cx.reps||'').trim())return '请先补全本轮实验上下文';
  return '';
}

    <span class="t-md">另一个标签页改了<strong>${name}</strong>。本页还是旧值，两边会对同一批数据给出不同结论。</span>
    <span class="grow"></span>
    <button class="btn" type="button" onclick="location.reload()">用新值刷新本页</button>
