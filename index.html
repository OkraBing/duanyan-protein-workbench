  if(a==='reuse'){IN.tab=0;IN.rawSeq='>N55_scaffold\n'+BUILTIN['1BRS'].chains[0].seq;invalidateInput();render();
    toast('已载入该位点的参考骨架');return}
  if(a==='shclear'){S.tq='';S.dom='全部';S.use='全部';render();return}
  if(a==='flt'){S.fltOpen=S.fltOpen?0:1;render();return}
  if(a==='fltclear'){S.flt={noCys:false,devMin:0,src:'全部',passOnly:false};LS.set('flt',S.flt);S.page=1;render();toast('已清除筛选');return}
  if(a==='nodetail'){S.detail=null;render();return}
  if(a==='reseed'){toast('未接入计算服务，无法重跑。可在任务配置中保存参数草稿');return}
  if(a==='export'){const L=fltApply(ROUND_CANDS());
    /* 空单元格在下游是歧义的：pandas 读成 NaN，Excel 读成空，没人分得清
       「没测过」和「测了但没拿到值」。所以数值缺失一律写 NA，
       并把处置与推断出的缺失原因作为独立两列带上。
       测定列按**本项目实际测的字段**出，不写死 KD / ΔTm——
       酶活项目导出一列空的 kd_nm，下游只会被误导。 */
    const F=projFields();
    const colName=k=>({dTm:'delta_tm_c',kd:'kd_nm',ec50:'ec50_nm',kcat:'kcat_per_s',
                       km:'km_um',titer:'titer_mg_per_l'})[k]||k;
    const head=['variant','mutation','iptm','gate_pass']
      .concat(F.map(colName)).concat(F.filter(k=>FIELD[k].sdKey).map(k=>colName(k)+'_log_sd'))
      .concat(['developability','self_rmsd_a','disposition','missing_reason','missing_reason_source','source','reference']);
    const na=v=>v==null||v===''?'NA':v;
    const pk=(tcpOf()&&tcpOf().primary.k)||F[0];
    const csv=[head.join(',')].concat(L.map(c=>[
      c.id,c.mut,c.iptm,c.iptm>=S.gate?'pass':'fail']
      .concat(F.map(k=>na(mv(c,k))))
      .concat(F.filter(k=>FIELD[k].sdKey).map(k=>na(sdOf(c,k))))
      .concat([c.dev,c.rmsd,c.disposition,
      mv(c,pk)==null?(c.disposition==='failed'?(FAIL_REASON[c.failKind]||'NA'):'NA'):'NA',
      mv(c,pk)==null&&c.disposition==='failed'?'inferred_by_us':'NA',
      c.src,c.ref||'NA']).map(csvCell).join(','))).join('\n');
    dl('results_'+S.pid+'_R'+S.round+'_demo.csv',csv,'text/csv').then(r=>toast(r==='saved'?`已导出 ${L.length} 条`:r==='declined'?'已取消':'导出失败，可用复现包里的复制'));return}
  if(a==='repro'){reproModal();return}
  /* 原先这里是第二条送检路径：自己一套条数、周期、费用、对照数，而且不过准入闸门。
     两个入口两套算法，等于前门装了闸、后门敞着。
     现在结果页只负责「选」，规格、报价、闸门校验、下单都在送检页一处完成。 */
  if(a==='send'){
    const pk=CANDS().filter(c=>S.sel.has(c.id));
    if(!pk.length){toast('先选中要送的变体');return}
    const bl=pk.filter(c=>c.iptm<S.gate);
    LS.set('sel',[...S.sel]);
    go('wetlab');
    toast(bl.length?`已带 ${pk.length} 条到送检页，其中 ${bl.length} 条未通过准入，需先处理`
                   :`已带 ${pk.length} 条到送检页，核对规格与报价后下单`);
    return}
  if(a==='order'){
    const pk=ROUND_CANDS().filter(c=>S.sel.has(c.id));
    const issue=orderProblem(pk);if(issue){toast(issue);return}
    const capturedScope=scopeKey();
    const c=pk.length*14900;   // 只算已知价的部分，额外重复待服务商报价
    const extraN=Math.max(0,WET.nrep-2);
    modal('送检确认',`<p class="t-md">将 <strong class="num">${pk.length}</strong> 条送至 Adaptyv Bio，
      实验类型 ${esc((EXP_TYPES.find(x=>x.k===WET.type)||{n:'—'}).n)}，n=${WET.nrep}，
      已知部分 <strong class="num">$${(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</strong>${extraN?`，另有每条 ${extraN} 次额外重复（共 ${extraN*pk.length} 次）待服务商报价`:''}。</p>
      <p class="hint" style="margin-top:var(--s3)">单价取自官网公开价 $149 / 蛋白（含 2 次重复，查证于 2026-11-11），不是接口实时返回。周期由服务商在接单后给出。</p>`,
      '确认',()=>{
        /* 下单这一刻才产生批次号，并把该轮的计划上下文复制成这个批次的事实上下文。
           复制而不是引用：之后改计划不应该追溯改写已经送出去的那一批。 */
        if(capturedScope!==scopeKey()||!canAct('order')){toast('项目、轮次或权限已变化，请重新确认');return false}
        const issue=orderProblem(pk);if(issue){toast(issue);return false}
        const no='B-'+(Math.max(2412,...BATCHES.map(b=>Number(String(b.id).replace(/^B-/,''))||0))+1);
        const plan=cloneData(roundCtx());
        BATCHES.push({id:no,pid:S.pid,round:S.round,vendor:'Adaptyv',status:'in_queue',results:'none',
          n:pk.length,ctx:plan,spec:{type:WET.type,method:WET.method,nrep:WET.nrep,enzyme:WET.enzyme},demo:true});
        pk.forEach(c=>{c.batch=no;c.disposition='ordered';c.m={}});
        const r=PRJ().rounds.find(x=>x.i===S.round);r.v+=pk.length;r.state='assay';
        AUDIT.unshift({t:nowStamp(),who:'张哲娴',act:'送检批准',obj:no,
          from:'未送检',to:`${pk.length} 条 · ${plan.host||'—'} · ${plan.assay||'—'}`,r:S.round});
        DB.acts.unshift({k:'wet',t:`送检 ${pk.length} 条 · 批次 ${no}`,r:S.round,p:PRJ().name,at:'刚刚',by:'张哲娴'});
        S.sel.clear();LS.set('sel',[]);
        toast(`已送检 ${pk.length} 条 · 批次 ${no}，上下文已随批次记录`);render()});return}
  if(a==='editctx'){
    const p0=PRJ();const r=p0.rounds.find(x=>x.i===S.round)||p0.rounds[p0.rounds.length-1];
    /* 轮次持有的是「计划」(plan)，批次才有 ctx。两层上下文改造之后这里没跟着改，
       于是编辑保存进了一个没人读的 r.ctx——界面看起来保存成功，其实什么都没变。 */
    const c=r.plan||(r.plan={host:'',assay:[],reps:'',buffer:'',temp:''});
    const body=`<div class="col" style="gap:var(--s4)">
      <div style="display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${CTX_FIELDS.map(([k,lbl,v0,req,multi])=>{
        const vocab=k==='host'?HOSTS:k==='assay'?ASSAYS:v0;
        if(vocab&&multi){const sel=asList(c[k]);
          return `<div class="field"><span class="label">${lbl}　可多选</span>
          <div class="row wrap" style="gap:var(--s2)">${vocab.map(o=>`<label class="chip" style="cursor:pointer;${sel.indexOf(o)>=0?'background:var(--dry-soft);border-color:var(--dry);color:var(--dry-ink);font-weight:600':''}">
            <input type="checkbox" data-mk="${k}" value="${esc(o)}" ${sel.indexOf(o)>=0?'checked':''}
              style="margin-right:4px;vertical-align:-1px" aria-label="${esc(o)}">${esc(o)}</label>`).join('')}</div></div>`}
        if(vocab)return `<div class="field"><label class="label" for="cx_${k}">${lbl}</label>
          <select class="input" id="cx_${k}">${vocab.map(v=>`<option ${c[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;
        return `<div class="field"><label class="label" for="cx_${k}">${lbl}${req?'':' <span class="t-xs mut2" style="font-weight:400">选填</span>'}</label>
          <input class="input" id="cx_${k}" type="text" value="${esc(c[k]||'')}"
            placeholder="${k==='batch'?'B-2411':k==='buffer'?'PBS pH 7.4':k==='temp'?'25℃':''}"></div>`}).join('')}
      </div>
      <p class="hint">宿主与测定方法是受控词表，不接受自由填写。改动会进审计日志。
        这一份上下文属于 Round ${r.i}，输入页与这里改的是同一份。</p></div>`;
    modal(`Round ${r.i} 实验上下文`,body,'保存',()=>{
      if(!canAct('editctx')||S.pid!==p0.id||S.round!==r.i){toast('上下文已变化，请重新打开编辑');return false}
      const next=cloneData(c);
      const before=CTX_FIELDS.map(([k,l,v,req,multi])=>k+'='+(multi?asList(c[k]).join('+'):(c[k]==null?'':c[k]))).join(' ');
      CTX_FIELDS.forEach(([k,l,v,req,multi])=>{
        if(multi){next[k]=[...document.querySelectorAll(`[data-mk="${k}"]:checked`)].map(x=>x.value);return}
        const el=document.getElementById('cx_'+k);if(!el)return;next[k]=el.value.trim()});
      const miss=CTX_FIELDS.filter(([k,l,v,req,multi])=>req&&
        (multi?!asList(next[k]).length:!String(next[k]||'').length)).map(x=>x[1]);
      if(miss.length){toast('必填项还空着：'+miss.join('、'));return false}
      Object.assign(c,next);
      DB.acts.unshift({k:'wet',t:`Round ${r.i} 实验上下文已更新`,r:r.i,p:p0.name,at:'刚刚',by:'张哲娴'});
      AUDIT.unshift({t:nowStamp(),who:'张哲娴',act:'实验上下文变更',obj:`Round ${r.i}`,
        from:before.slice(0,42),
        to:CTX_FIELDS.map(([k,l,v,req,multi])=>k+'='+(multi?asList(c[k]).join('+'):c[k])).join(' ').slice(0,42),r:r.i});
      toast('实验上下文已保存，并记入审计日志');render()});
    return}
  if(a==='group'){S.group=S.group?0:1;LS.set('group',S.group);
    if(S.group){S.page=1;
      const n=new Set(fltApply(CANDS()).map(c=>ctxSig(c).key)).size;
      toast(n>1?`按实验上下文分成 ${n} 组——跨组的测定值不能直接比`:'本页数据都来自同一套实验上下文')}
    render();return}
  if(a==='newhypo'){
    const P=PRJ(),t=tcpOf(P);
    const fields=projFields(P).concat(['iptm','dev']);
    modal(`Round ${S.round} 新建假设`,`<div class="col" style="gap:var(--s4)">
      <div class="field"><label class="label" for="hy_t">可证伪的陈述</label>
        <input class="input" id="hy_t" placeholder="如：N46 区域的突变能把 ΔTm 提到 +5℃ 以上"></div>
      <div class="row wrap" style="gap:var(--s3)">
        <div class="field" style="width:150px"><label class="label" for="hy_s">涉及位点</label>
          <input class="input num" id="hy_s" placeholder="46、97"></div>
        <div class="field" style="min-width:140px"><label class="label" for="hy_k">预期效应</label>
          <select class="input" id="hy_k">${fields.map(k=>`<option value="${k}" ${t&&k===t.primary.k?'selected':''}>${FIELD[k].n}${FIELD[k].unit}</option>`).join('')}</select></div>
        <div class="field" style="width:76px"><label class="label" for="hy_d">方向</label>
          <select class="input" id="hy_d"><option value=">=">≥</option><option value="<=">≤</option></select></div>
        <div class="field" style="width:100px"><label class="label" for="hy_v">阈值</label>
          <input class="input num" id="hy_v" type="number" step="0.01" value="${t?t.primary.v:1}"></div>
      </div>
      <p class="hint">先写陈述，判据另外锁。陈述要能被数据推翻——
        「N46 可能有用」不是假设，「N46 的突变里至少两成能到 +5℃」才是。</p>
    </div>`,'建立',()=>{
      const txt=(document.getElementById('hy_t')||{}).value||'';
      const sites=((document.getElementById('hy_s')||{}).value||'').split(/[、,，\s]+/)
        .filter(Boolean).map(x=>/^\d+$/.test(x)?Number(x):NaN);
      const k=(document.getElementById('hy_k')||{}).value;
      const dir=(document.getElementById('hy_d')||{}).value;
      const v=parseFloat((document.getElementById('hy_v')||{}).value);
      if(txt.trim().length<8){toast('陈述太短，写清楚它说了什么');return false}
      if(!sites.length||sites.some(x=>!Number.isSafeInteger(x)||x<1||x>MAX_SEQ_LEN)||new Set(sites).size!==sites.length){toast('位点需为范围内不重复的正整数');return false}
      if(!Number.isFinite(v)||!fields.includes(k)||!['>=','<='].includes(dir)){toast('效应字段、方向或阈值无效');return false}
      const id='H-'+String(HYPO.length+1).padStart(2,'0');
      HYPO.unshift({id:id,pid:P.id,round:S.round,text:txt.trim(),sites:sites,
        effect:{k:k,dir:dir,v:Math.round(v*100)/100},pre:null,state:'draft'});
      AUDIT.unshift({t:nowStamp(),who:'张哲娴',act:'新建假设',obj:id,
        from:'—',to:txt.trim().slice(0,40),r:S.round});
      DB.acts.unshift({k:'dry',t:'新建假设 '+id+'：'+txt.trim().slice(0,30),r:S.round,p:P.name,at:'刚刚',by:'张哲娴'});
      toast(id+' 已建立。判据还没锁，锁定之后才会被自动判定');render()});
    return}
  if(a==='edittcp'){
    const P=PRJ();const t=tcpOf(P);
    if(!t){toast('这个项目还没有结构化目标');return}
    const rows=[['primary',t.primary,'主目标']].concat(t.constraints.map((r,i)=>['c'+i,r,'约束：'+(r.n||ruleText(r))]));
    modal('改目标',`<div class="col" style="gap:var(--s4)">
      <p class="t-md mut">改目标会改变命中判定、逐项达成率、预期命中与轮次建议——
        它们读的是同一份数据。历史数据不会变，但对历史的判定会跟着变。</p>
      ${rows.map(([k,r,lbl])=>{
        const opts=projFields(P).concat(['dev','iptm','cys']).filter(x=>FIELD[x]);
        return `<div class="row wrap" style="gap:var(--s3);align-items:flex-end">
        <div class="field" style="min-width:150px"><label class="label" for="tf_${k}">${esc(lbl)}</label>
          <select class="input" id="tf_${k}" ${opts.length<2?'disabled':''}>
            ${opts.map(o=>`<option value="${o}" ${o===r.k?'selected':''}>${FIELD[o].n}${FIELD[o].unit}</option>`).join('')}
          </select></div>
        <div class="field" style="width:88px"><label class="label" for="to_${k}">方向</label>
          <select class="input" id="to_${k}">
            ${['>=','<='].map(o=>`<option value="${o}" ${o===r.cmp?'selected':''}>${CMP[o]}</option>`).join('')}
          </select></div>
        <div class="field" style="width:120px"><label class="label" for="tc_${k}">阈值</label>
          <input class="input num" id="tc_${k}" type="number" step="0.01" value="${r.v}"></div>
      </div>`}).join('')}
      <p class="hint">可选的指标只有本项目实际测的那几个，加上计算字段。
        要用一个没测过的指标，先去实验上下文里加上能测它的方法。</p>
    </div>`,'保存',()=>{
      const before=goalText(P);
      let bad=null;
      rows.forEach(([k,r])=>{
        const fe=document.getElementById('tf_'+k),oe=document.getElementById('to_'+k),
              el=document.getElementById('tc_'+k);
        if(!el)return;const v=parseFloat(el.value);
        if(!isFinite(v)){bad=k;return}
        if(fe&&FIELD[fe.value])r.k=fe.value;
        if(oe)r.cmp=oe.value;
        r.v=Math.round(v*100)/100;
        if(r.k==='cys'){r.cmp='==';r.v=0}});
      if(bad){toast('阈值要是一个数');return false}
      const dup=rows.map(x=>x[1].k);
      if(new Set(dup).size!==dup.length){toast('同一个指标不能既当主目标又当约束');return false}
      AUDIT.unshift({t:nowStamp(),who:'张哲娴',act:'变更项目目标',obj:P.name,
        from:before.slice(0,46),to:goalText(P).slice(0,46),r:S.round});
      DB.acts.unshift({k:'dry',t:'项目目标变更：'+goalText(P),r:S.round,p:P.name,at:'刚刚',by:'张哲娴'});
      toast('目标已更新，命中判定与建议已跟着重算');render()});
    return}
  if(a==='dyreview'){
    modal('请端砚评审这一轮',`<div class="col" style="gap:var(--s3)">
      <p class="t-md">会把这一轮的证据链（六要素）、复现包与导出物提交给端砚的评审智能体，
        由它在 正确性 / 产物质量 / 历史审查 三个维度独立核验并按等级输出结论。</p>
      <p class="t-md mut">本地自查过的四项也会一并提交复核——自查通过不代表评审通过。</p>
      <p class="hint" style="color:var(--err)">本环境没有接入端砚。接口形态尚未确认，
        这一步现在只能走到这里。</p></div>`,'我知道了',()=>{});
    return}
  if(a==='asself'){S.as=0;LS.set('as',0);toast('已回到本人身份');render();return}
  if(a==='dropblocked'){const bl=CANDS().filter(c=>S.sel.has(c.id)&&c.iptm<S.gate);
    bl.forEach(c=>S.sel.delete(c.id));LS.set('sel',[...S.sel]);
    toast(`已移除 ${bl.length} 条未通过准入的变体`);render();return}
  if(a==='reflux'){
    modal('结果导入与训练尚未接入',`<p class="t-md">当前原型没有结果文件导入或训练服务。质检勾选只记录人工复核，不能生成测定值、模型版本或验证分数。</p><p class="hint">项目数据、当前模型与轮次均未更改。</p>`,'知道了');return}
  toast(M[a]||'该操作尚未接入，未执行外部任务');
}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
document.getElementById('q2').addEventListener('input',paintSearch);
document.getElementById('q2').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){const first=document.querySelector('[data-search-hit]');if(first){e.preventDefault();first.focus()}}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&!document.getElementById('dlg').open){e.preventDefault();act('qopen')}
  if(e.key==='Escape'&&document.getElementById('searchrow').dataset.open==='1'){
    document.getElementById('searchrow').dataset.open='0';
    document.getElementById('qbtn').setAttribute('aria-expanded','false');document.getElementById('q').setAttribute('aria-expanded','false');
    document.getElementById(window.innerWidth<=780?'qbtn':'q').focus();
  }
});
restoreWorkspace();
Object.assign(S,readRoute(location.hash));loadRound();
history.replaceState(null,'',routeHash());
render();
</script>
</body></html>
