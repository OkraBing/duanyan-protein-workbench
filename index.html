<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>端砚 生物蛋白</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.5.2/3Dmol-min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:28px;--s7:36px;--s8:48px;--s9:72px;
  /* 画布与内容同色：靠间距与字重分组，不靠盒子 */
  --paper:#FDFDFC;--surface:#FFFFFF;--surface-2:#F7F6FA;--surface-3:#F1F0F5;
  --ink:#121218;--ink-2:#4B4E61;--ink-3:#6B6E80;--ink-4:#A9ABBA;
  --line:#E9E8F0;--line-2:#F2F1F6;
  /* 只有两个色相承担含义：靛紫=干/计算/通过，琥珀=湿/实验。
     红只给真错误，和琥珀拉开 33° 且饱和度不同。绿色已删除——
     「通过」用靛紫，不再需要第三个色相。 */
  --dry:#3F38C9;--dry-soft:#EEECFC;--dry-ink:#2A24A0;--dry-dim:#9A95E8;
  --wet:#8A5A12;--wet-soft:#F7F0E4;--wet-dim:#C9A66A;
  --ok:#2A24A0;--ok-soft:#EEECFC;
  --err:#B3261E;--err-soft:#FBE9E8;
  --focus:#3F38C9;--on-dry:#FFFFFF;
  --sh-1:0 1px 1px rgba(18,18,24,.04);
  --sh-2:0 2px 10px rgba(18,18,24,.06),0 1px 2px rgba(18,18,24,.04);
  --sh-3:0 20px 60px rgba(18,18,24,.18);
  --r1:5px;--r2:8px;--r3:12px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --art:.3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C0C11;--surface:#121218;--surface-2:#17171F;--surface-3:#1F1F29;
  --ink:#F0EFF4;--ink-2:#AFAFC2;--ink-3:#8E8EA4;--ink-4:#5C5C70;
  --line:#242430;--line-2:#1B1B24;
  --dry:#A79FF8;--dry-soft:#1E1A44;--dry-ink:#C3BCFB;--dry-dim:#5A519E;
  --wet:#D6A458;--wet-soft:#332508;--wet-dim:#8A6B2E;
  --ok:#A79FF8;--ok-soft:#1E1A44;
  --err:#F08A80;--err-soft:#3A1816;
  --focus:#A79FF8;--on-dry:#15151C;
  --sh-1:0 1px 1px rgba(0,0,0,.4);
  --sh-2:0 2px 10px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --sh-3:0 20px 60px rgba(0,0,0,.7);
  --art:.46;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0C0C11;--surface:#121218;--surface-2:#17171F;--surface-3:#1F1F29;
  --ink:#F0EFF4;--ink-2:#AFAFC2;--ink-3:#8E8EA4;--ink-4:#5C5C70;
  --line:#242430;--line-2:#1B1B24;
  --dry:#A79FF8;--dry-soft:#1E1A44;--dry-ink:#C3BCFB;--dry-dim:#5A519E;
  --wet:#D6A458;--wet-soft:#332508;--wet-dim:#8A6B2E;
  --ok:#A79FF8;--ok-soft:#1E1A44;
  --err:#F08A80;--err-soft:#3A1816;
  --focus:#A79FF8;--on-dry:#15151C;
  --sh-1:0 1px 1px rgba(0,0,0,.4);
  --sh-2:0 2px 10px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --sh-3:0 20px 60px rgba(0,0,0,.7);
  --art:.46;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-size:13.5px;line-height:1.6;
  font-family:Inter,"PingFang SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  font-feature-settings:"cv05","ss01";-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.022em}
p{margin:0}
a{color:var(--dry);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}
::selection{background:var(--dry-soft);color:var(--dry-ink)}

/* 数值一律等宽 —— 这是「仪器」和「后台」的分界线 */
.num,td.num,th.num,.v,code,pre{font-family:var(--mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;font-feature-settings:"zero"}
.t-xs{font-size:10.5px}.t-sm{font-size:11.5px}.t-md{font-size:12.5px}
.mut{color:var(--ink-2)}.mut2{color:var(--ink-3)}
/* 小标签：10px，字距拉开，这是整套设计的声音 */
.lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:var(--s3)}
.col{display:flex;flex-direction:column}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 外壳 ---------- */
#app{display:flex;min-height:100vh;align-items:stretch}
#side{flex:0 0 212px;background:var(--paper);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:auto;padding-left:env(safe-area-inset-left,0px)}
#side[data-collapsed="1"]{flex-basis:60px}
#side[data-collapsed="1"] .nav-tx,#side[data-collapsed="1"] .lbl,#side[data-collapsed="1"] .side-foot{display:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);
  border-left:1px solid var(--line)}
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:var(--s3);min-height:49px;
  padding-inline:max(var(--s6),env(safe-area-inset-left,0px)) max(var(--s5),env(safe-area-inset-right,0px))}
#view{padding-block:var(--s7) var(--s9);
  padding-inline:max(var(--s5),env(safe-area-inset-left,0px)) max(var(--s5),env(safe-area-inset-right,0px))}
@media(min-width:1000px){#view{padding-inline:max(var(--s7),env(safe-area-inset-left,0px)) max(var(--s7),env(safe-area-inset-right,0px))}}
/* 一个页壳，所有页面同宽同节距。之前三种页宽两种节距，是「错乱」的根源 */
.page{display:flex;flex-direction:column;gap:var(--s7);max-width:1180px}
/* 两栏：主栏 + 固定 300px 侧栏，所有页面一致 */
.cols{display:grid;gap:var(--s7);grid-template-columns:minmax(0,1fr) 300px;align-items:start}
@media(max-width:1060px){.cols{grid-template-columns:minmax(0,1fr)}}
/* 区块底部操作条：紧贴内容，不浮在远处 */
.sec-f{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding-top:var(--s4);border-top:1px solid var(--line-2)}
/* 只在换路由时入场；状态重渲染不动，否则勾一个筛选框整页会闪 */
.enter{animation:in .26s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.enter{animation:none}}

.brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s5) var(--s4) var(--s6)}
.brand-mark{width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.nav-group{display:flex;flex-direction:column;gap:1px;padding:0 var(--s3) var(--s5)}
.nav-group .lbl{padding:var(--s3) var(--s3) var(--s2)}
.nav{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:31px;padding:0 var(--s3);
  border:0;background:transparent;border-radius:var(--r2);color:var(--ink-2);cursor:pointer;
  text-align:left;font-size:12.5px;font-weight:450;position:relative}
.nav:hover{background:var(--surface-3);color:var(--ink)}
.nav[aria-current="page"]{color:var(--dry);font-weight:600;background:transparent}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;
  width:2px;border-radius:2px;background:var(--dry)}
.nav svg{flex:0 0 15px;opacity:.75}
.nav[aria-current="page"] svg{opacity:1}
.side-foot{margin-top:auto;padding:var(--s4) var(--s4) var(--s5)}

/* ---------- 控件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:30px;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r2);
  background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:background .14s,border-color .14s,color .14s}
.btn:hover{background:var(--surface-3);border-color:var(--ink-4)}
.btn:active{transform:translateY(.5px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-pri{background:var(--dry);border-color:var(--dry);color:var(--on-dry);font-weight:550;box-shadow:var(--sh-1)}
.btn-pri:hover{background:var(--dry-ink);border-color:var(--dry-ink);color:var(--on-dry)}
.btn-gh{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-gh:hover{background:var(--surface-3);border-color:transparent;color:var(--ink)}
.btn-ic{width:30px;padding:0;flex:0 0 30px}
@media(max-width:860px){.btn{min-height:40px}.btn-ic{width:40px;flex-basis:40px}}

/* ⌘K 搜索：不是一个大输入框 */
#q{display:flex;align-items:center;gap:var(--s2);height:28px;padding:0 var(--s2) 0 var(--s3);
  border:1px solid var(--line);border-radius:999px;background:var(--surface-2);
  color:var(--ink-3);font-size:12px;cursor:pointer;min-width:168px}
#q:hover{border-color:var(--ink-4);color:var(--ink-2)}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;
  padding:1px 4px;background:var(--surface);color:var(--ink-3)}

/* ---------- 容器：默认不是盒子 ---------- */
.card{background:transparent;border:0;border-radius:0;box-shadow:none}
.card-h{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding:0 0 var(--s3);border-bottom:1px solid var(--line);margin-bottom:var(--s4)}
.card-h>strong{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.card-b{padding:0}
/* 可点的才是盒子 */
button.card,.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  box-shadow:var(--sh-1);transition:border-color .16s,box-shadow .16s,transform .16s}
button.card:hover,.tile:hover{border-color:var(--ink-4);box-shadow:var(--sh-2);transform:translateY(-1px)}
button.card .card-b,.tile .card-b{padding:var(--s4)}
button.card .card-h,.tile .card-h{border-bottom:0;margin-bottom:0;padding:0}

/* 状态：圆点加文字，不是实心药丸 */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;
  white-space:nowrap;color:var(--ink-2);padding:0;height:auto;background:none}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px}
.c-dry{color:var(--dry)}.c-wet{color:var(--wet)}.c-ok{color:var(--ok)}.c-err{color:var(--err)}
.c-mut{color:var(--ink-3)}
.chip .dot{display:none}
/* 需要强调的少数场合 */
.chip-solid{padding:1px 8px;border-radius:999px;background:var(--surface-3);font-size:11px}
.dot{width:5px;height:5px;border-radius:50%;flex:0 0 5px}

.field{display:flex;flex-direction:column;gap:5px}
.label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.input,select.input{width:100%;min-height:32px;padding:0 var(--s3);border:1px solid var(--line);
  border-radius:var(--r2);background:var(--surface);transition:border-color .14s,box-shadow .14s}
textarea.input{min-height:72px;padding:var(--s3);resize:vertical;line-height:1.65}
.input:hover{border-color:var(--ink-4)}
.input:focus{outline:0;border-color:var(--dry);box-shadow:0 0 0 3px var(--dry-soft)}
 #asbar,#syncbar{gap:var(--s3);padding:var(--s3) var(--s4);border:1px solid var(--wet-dim);
  border-radius:5px;background:var(--wet-soft);margin-bottom:var(--s5);flex-wrap:wrap}
#syncbar{border-color:var(--err);background:var(--err-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;height:36px}
.seg-i{appearance:none;border:0;background:var(--bg);color:var(--ink-2);font:inherit;font-size:var(--f2);
  padding:0 12px;cursor:pointer;border-left:1px solid var(--line)}
.seg-i:first-child{border-left:0}
.seg-i[aria-checked="true"]{background:var(--dry-soft);color:var(--dry-ink);font-weight:550}
.seg-i:hover:not([aria-checked="true"]){background:var(--bg-2)}
.seg-i:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.sym{text-transform:none;letter-spacing:0}
tr.grp>td{background:var(--surface-2);border-top:1px solid var(--line);padding:var(--s3) var(--s4)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.why{margin-top:var(--s2)}
.why>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;
  font-size:var(--f1);color:var(--dry);line-height:1.5;padding:2px 0;border-radius:3px}
.why>summary::-webkit-details-marker{display:none}
.why>summary::before{content:"＋";font-size:11px;width:11px;text-align:center;opacity:.8}
.why[open]>summary::before{content:"－"}
.why>summary:hover{text-decoration:underline}
.why>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.why>.why-b{margin-top:var(--s2);padding-left:var(--s3);border-left:2px solid var(--line-2);
  font-size:var(--f1);color:var(--ink-3);line-height:1.65;max-width:62ch}
.hint{font-size:11.5px;color:var(--ink-3)}

/* ---------- 表格：去框，只留发丝线 ---------- */
.tbl-wrap{overflow:auto;border-radius:0;border:0;background:transparent}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:0 var(--s4) var(--s2) 0;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:last-child{padding-right:0}
tbody td{padding:var(--s3) var(--s4) var(--s3) 0;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody td:last-child{padding-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{font-size:12px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.sort-i{opacity:.3;margin-left:4px}
th[aria-sort]{color:var(--dry)}
th[aria-sort] .sort-i{opacity:1}

.empty{display:flex;flex-direction:column;align-items:center;gap:var(--s3);
  padding:var(--s9) var(--s5);text-align:center;color:var(--ink-3)}
.skel{background:linear-gradient(90deg,var(--surface-3) 25%,var(--line-2) 37%,var(--surface-3) 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:var(--r1)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

.bar{height:3px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex}

/* ---------- 数字组：标签压小，数字放大 ---------- */
.kpi{display:grid;gap:var(--s6) var(--s7);background:transparent;border:0;border-radius:0;overflow:visible;
  padding:var(--s2) 0 var(--s5);border-bottom:1px solid var(--line)}
.kpi>div{background:transparent;padding:0}
.kpi .t-sm{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-size:32px;font-weight:500;line-height:1.1;margin-top:var(--s2);letter-spacing:-.03em;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .v .t-md{font-size:14px;color:var(--ink-3)}

.toast-host{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--s6) + env(safe-area-inset-bottom,0px));
  z-index:100;display:flex;flex-direction:column;gap:var(--s2);align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:var(--s2) var(--s4);border-radius:999px;
  font-size:12.5px;box-shadow:var(--sh-3);max-width:min(92vw,520px);
  animation:in .2s cubic-bezier(.2,.7,.3,1)}
dialog{border:1px solid var(--line);padding:0;border-radius:var(--r3);background:var(--surface);
  color:var(--ink);box-shadow:var(--sh-3);max-width:min(94vw,440px);width:100%}
dialog .card-h,dialog .card-b{padding:var(--s5)}
dialog .card-h{margin:0;border-bottom:1px solid var(--line)}
dialog .card-h>strong{font-size:13.5px;letter-spacing:-.02em;text-transform:none;color:var(--ink)}
dialog::backdrop{background:rgba(12,12,17,.5);backdrop-filter:blur(2px)}

/* ---------- 工作台 ---------- */
.hero{position:relative;overflow:hidden;border:0;border-radius:0;background:transparent;box-shadow:none}
.hero-art{position:absolute;top:2px;right:0;pointer-events:none;opacity:var(--art);line-height:0}
.hero-art svg{display:block}
@media(max-width:980px){.hero-art{display:none}}
.hero-in{position:relative;padding:0 0 var(--s6)}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dry)}
.hero h1{font-size:34px;line-height:1.14;letter-spacing:-.035em;text-wrap:balance;margin-top:var(--s3)}
@media(max-width:700px){.hero h1{font-size:26px}}
.hero .lede{color:var(--ink-2);max-width:48ch;margin-top:var(--s3);font-size:13.5px}
.rule{height:2px;border-radius:999px;display:flex;overflow:hidden;width:56px;margin-top:var(--s5)}
.ask{margin-top:var(--s6);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r3);box-shadow:var(--sh-1);transition:box-shadow .18s,border-color .18s}
.ask:focus-within{border-color:var(--dry);box-shadow:0 0 0 4px var(--dry-soft)}
.ask .card-b{padding:var(--s4) var(--s4) var(--s3)}

@media(max-width:860px){
  #app{flex-direction:column}
  #side{position:static;height:auto;flex-basis:auto;width:100%;flex-direction:row;overflow-x:auto;
    border-right:0;border-bottom:1px solid var(--line);padding:var(--s2) var(--s3);gap:var(--s1);align-items:center}
  #main{border-left:0}
  #side .brand,#side .side-foot,#side .lbl{display:none}
  #side .nav-group{flex-direction:row;padding:0;margin:0}
  .nav{white-space:nowrap}
  .nav[aria-current="page"]::before{display:none}
  .nav[aria-current="page"]{background:var(--dry-soft)}
}
#searchrow{display:none;border-bottom:1px solid var(--line);background:var(--surface);
  padding:var(--s3) max(var(--s5),env(safe-area-inset-left,0px));position:sticky;top:49px;z-index:19}
#searchrow[data-open="1"]{display:block}
#qbtn{display:none}
@media(max-width:780px){#q{display:none}#qbtn{display:inline-flex}}

/* 滑块：细轨道，实心把手 */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:var(--surface-3)}
input[type=range]::-moz-range-track{height:3px;border-radius:999px;background:var(--surface-3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--dry);border:2px solid var(--surface);box-shadow:var(--sh-2);margin-top:-5.5px;transition:transform .12s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--dry);
  border:2px solid var(--surface);box-shadow:var(--sh-2)}

const REFS=['J. Mol. Biol. 2019, 431(4):812','Protein Eng. Des. Sel. 2021, 34:gzab009',
  'Nat. Commun. 2023, 14:3425','PNAS 2020, 117(31):18456'];

/* ===== 数据模型（ARCHITECTURE 第一节）=====
   变体是项目级实体，不属于任何一轮。Variant : Round 多对多，经 DesignInstance 连接。
   这是查重与反查历史的前提。 */
/* 变体在某一轮的处置。「测定失败」与「未测」必须分开——
   前者是有信息的负样本参与重训，后者什么都不是。 */
const DISPOSITION={
  designed:{n:'已设计',train:false,note:'生成出来了，本轮没选上'},
  deduped:{n:'查重排除',train:false,note:'与历史重复，不占板位也不花钱'},
  selected:{n:'已入选',train:false,note:'选上了，还没排板'},
  plated:{n:'已排板',train:false,note:'占了孔位，还没送检'},
  ordered:{n:'已送检',train:false,note:'在服务商手里'},
  measured:{n:'有结果',train:true,note:'有有效数值，参与重训'},
  failed:{n:'测定失败',train:true,note:'有信息的负样本，参与重训'},
  untested:{n:'未测',train:false,note:'没有任何信息，不参与重训'}};
/* 失败是有类型的；「未测」没有类型，因为它不是一种结果 */
const FAIL_REASON={
  no_expression:'表达量为零',aggregation:'聚集',purification:'纯化失败',
  degraded:'蛋白降解',no_binding:'无结合信号',bad_fit:'拟合质量不达标',
  other:'其他（见备注）'};
/* 从服务商返回的质量字段推断缺失原因——接口里没有 missing_reason，这是我们的推断 */
function inferFailure(r){
  if(r.expression==='none'||r.expression==='low')return {k:'no_expression',by:'expression 字段'};
  if(r.fit_quality==='poor')return {k:'bad_fit',by:'fit_quality 字段'};
  if(r.rmse>30)return {k:'bad_fit',by:'rmse_max_signal_pct > 30'};
  if(r.binding==='none')return {k:'no_binding',by:'binding 字段'};
  return null;
}
/* 变体按项目生成。此前 DB.cands 是一个全局列表，切项目看到的是同一批变体——
   项目页说 p2 有 48 条，变体库却摆着 p1 的 96 条。
   测定值放在 c.m 里，**按该项目实际测的字段**生成：
   PD-L1 binder 只做亲和力就只有 KD，酶活项目就只有 kcat / Km。 */
(function seed(){let s=42;const r=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;
 const aa='ACDEFGHIKLMNPQRSTVWY';
 const PLAN=[['p1',96,['dTm','kd'],[27,33,46,55,97,102],[2,3,4,4,5]],
             ['p2',24,['kd'],      [31,44,58,71],        [1,1,2,2]],
             ['p3',36,['kcat','km'],[88,121,154,190],    [6,6,6,6]]];
 let no=0;
 PLAN.forEach(([pid,n,fields,sites,rounds])=>{
 for(let i=0;i<n;i++){const pos=sites[Math.floor(r()*sites.length)];
  const to=aa[Math.floor(r()*20)];
  const ip=Math.round((.32+r()*.64)*1000)/1000;
  const lit=r()>.75;
  const m={};
  if(fields.indexOf('dTm')>=0)m.dTm=Math.round((-2+ip*9)*10)/10;
  if(fields.indexOf('kd')>=0){m.kd=Math.round((.6+(1-ip)*22)*10)/10;
    m.kdLogSd=Math.round((.08+r()*.22)*100)/100}
  if(fields.indexOf('kcat')>=0)m.kcat=Math.round((1.2+ip*7.4)*100)/100;
  if(fields.indexOf('km')>=0)m.km=Math.round((12+(1-ip)*180)*10)/10;
  DB.cands.push({pid:pid,id:'V-'+String(++no).padStart(3,'0'),mut:'N'+pos+to,pos:pos,to:to,
   iptm:ip,rmsd:Math.round((.8+(1-ip)*4.2)*100)/100,dev:Math.round((.4+ip*.58)*100)/100,
   cys:to==='C',                                        // 游离半胱氨酸，业务语义过滤用
   m:m,                                                 // 测定值；没测的字段根本不存在，不是 0
   src:lit?'文献推断':'本环境计算',
   ref:lit?REFS[Math.floor(r()*REFS.length)]:null,
   firstRound:rounds[Math.floor(r()*rounds.length)],    // 首次被设计出来的轮次
   batch:null,                                          // 所属送检批次，下面按轮次补
   
   // 下面三个测定值只有「有结果 / 测定失败」才存在；未测与未入选的一律为 null，
   // 见 Tricky 审查 T-04：没测过的变体不该带数值
   origin:lit?'reuse':'new',
   selection:['high','high','uncertain','cover','complement'][Math.floor(r()*5)],
   disposition:(function(){const x=r();
     return x<.62?'measured':x<.74?'failed':x<.80?'untested':x<.86?'deduped':'designed'})(),
   // 服务商返回的质量字段。失败类型不直接存——由 inferFailure 从这些字段推出来，
   // 否则界面上写着「由 expression / fit_quality 推断」而数据里根本没有这些字段。
   qual:(function(){const x=r();
     return x<.30?{expression:'none',fit_quality:'ok',rmse:8,binding:'yes'}
          :x<.52?{expression:'ok',fit_quality:'poor',rmse:12,binding:'yes'}
          :x<.70?{expression:'ok',fit_quality:'ok',rmse:41,binding:'yes'}
          :x<.86?{expression:'ok',fit_quality:'ok',rmse:9,binding:'none'}
                :{expression:'low',fit_quality:'ok',rmse:7,binding:'yes'}})(),
   dims:{seq:Math.round((.45+r()*.54)*100)/100,       // 序列合理性
         str:Math.round((.40+ip*.56)*100)/100,        // 结构稳定性
         con:Math.round((.35+r()*.62)*100)/100,       // 进化保守性
         aff:Math.round((.30+r()*.68)*100)/100,       // 亲和力变化
         dev:Math.round((.40+ip*.58)*100)/100}});}});})();
/* 当前项目的变体。读变体一律走这个，不要直接读 DB.cands——
   那是全部项目的总表，切项目就不会变。 */
function CANDS(pid){const id=pid||S.pid;return DB.cands.filter(c=>c.pid===id)}
/* 变体谱系。定向进化里最有价值的结构就是谱系：V-081(K12A/N55Q) 是从 V-034(K12A) 长出来的，
   这个关系决定了「哪条路走通了、哪条路走死了」。设计页已经在说「最优亲本延伸」，
   说了亲本就必须存亲本，否则口径和数据对不上。
   规则：亲本只能从更早轮次里**有结果**的变体里挑——没测过的不能当亲本，
   因为那等于拿一条不知道好坏的序列当起点。 */
(function lineage(){
  const byR={};DB.cands.forEach(c=>(byR[c.firstRound]=byR[c.firstRound]||[]).push(c));
  const rounds=Object.keys(byR).map(Number).sort((a,b)=>a-b);
  rounds.forEach((rn,i)=>{
    if(i===0){byR[rn].forEach(c=>{c.parent=null;c.muts=[c.mut]});return}
    const pool=rounds.slice(0,i).reduce((a,x)=>a.concat(byR[x]),[])
      .filter(c=>c.disposition==='measured');
    byR[rn].forEach((c,j)=>{
      const pa=pool.length?pool[(j*7+rn*3)%pool.length]:null;
      c.parent=pa?pa.id:null;
      /* 同一个位点被改第二次是覆盖，不是并列：N55V 之后再改成 R，写出来是 N55R，
         不能写成 N55V/N55R——那读起来像两个突变。 */
      const base=pa?pa.muts.slice():[];
      const posOf=m=>m.replace(/^[A-Z]/,'').replace(/[A-Z]$/,'');
      const k=base.findIndex(m=>posOf(m)===String(c.pos));
      if(k>=0)base[k]=c.mut; else base.push(c.mut);
      c.muts=base;
    });
  });
  DB.cands.forEach(c=>{if(!c.muts)c.muts=[c.mut];c.mut=c.muts.join('/')});

/* 查重。「查重排除」这个处置一直存在，但数据里有两条变体突变集完全相同却都没被标出来——
   一个声称会查重的产品里躺着没查出来的重复，比不查更糟。
   口径：突变集相同（与顺序无关）即为重复，保留第一条，其余标 deduped 并指向保留的那条。 */
(function dedupe(){
  const seen=new Map();
  DB.cands.forEach(c=>{
    const key=c.muts.slice().sort().join('+');
    if(!seen.has(key)){seen.set(key,c);c.dupOf=null;return}
    const first=seen.get(key);
    c.dupOf=first.id;
    if(c.disposition!=='deduped'){c.disposition='deduped';c.m={}}
  });
})();
function variantById(id){return DB.cands.find(c=>c.id===id)||null}
/* 从野生型到这条变体的完整路径。环路保护：坏数据不该让界面崩。 */
function lineageOf(c){const out=[];let cur=c,guard=0;
  while(cur&&guard++<12){out.unshift(cur);cur=cur.parent?variantById(cur.parent):null}
  return out}
/* 变体归到批次：R3 → B-2409；R4 的一半到 B-2411、一半到 B-2412（这两个批次宿主不同，
   正好让「跨上下文不可直接比」在界面上真的出现）。R2 的批次不在本环境的跟踪列表里，
   R5 还没下单——这两种都没有批次，分组时退回该轮的计划上下文并标明是计划。 */
DB.cands.forEach((c,i)=>{
  if(c.firstRound===3)c.batch='B-2409';
  else if(c.firstRound===4)c.batch=(i%2?'B-2412':'B-2411')});

DB.cands.forEach(c=>{const f=inferFailure(c.qual);
  c.failKind=f?f.k:'no_binding'; c.failBy=f?f.by:'服务商备注 + 人工确认'});
/* KD 跨好几个数量级，线性平均没有意义——服务商返回 kd_mean 与 kd_log_std，
   并给 KineticInterval{value, ci_low, ci_high}。这里照同样的口径算。 */
function kdCI(c){
  if(mv(c,'kd')==null)return null;
  const lg=Math.log10(mv(c,'kd')), sd=sdOf(c,'kd')||0.15;
  return {lo:Math.pow(10,lg-1.96*sd), hi:Math.pow(10,lg+1.96*sd)};
}
const kdFmt=c=>{const n=mv(c,'kd');if(n==null)return '—';return n<10?n.toFixed(1):Math.round(n)};
function kdCell(c){const ci=kdCI(c);
  if(!ci)return `<span class="col" style="gap:0"><span class="num mut2">—</span>
    <span class="t-xs mut2">${DISPOSITION[c.disposition].n}</span></span>`;
  return `<span class="col" style="gap:0"><span class="num">${kdFmt(c)} nM</span>
    <span class="t-xs mut2 num">${ci.lo<10?ci.lo.toFixed(1):Math.round(ci.lo)}–${ci.hi<10?ci.hi.toFixed(1):Math.round(ci.hi)}</span></span>`}
/* 几何平均：对数空间求均值再还原 */
function kdGeoMean(list){
  const L=list.filter(c=>mv(c,'kd')!=null);
  if(!L.length)return 0;
  const m=L.reduce((a,c)=>a+Math.log10(mv(c,'kd')),0)/L.length;
  return Math.pow(10,m);

  <section class="card">
    <div class="card-h"><strong>轮次${ann('M1-F02')}</strong><span class="grow"></span>

          <p class="t-md grow" style="font-weight:550;line-height:1.5;min-width:220px">${esc(c.text)}</p>

        <div class="row wrap" style="gap:var(--s2)">
          ${EV_KINDS.map(([n])=>`<span class="chip ${cov.have.has(n)?'c-ok':''}"
            style="${cov.have.has(n)?'':'opacity:.5'}" title="${cov.have.has(n)?'已挂证据':'缺这一类'}">${n}</span>`).join('')}
        </div>
        ${cov.missing.length?`<p class="t-sm" style="color:var(--err)">缺 ${cov.missing.join('、')}——
          缺了数据与代码，这条结论就只是一句话，没法重跑。</p>`:''}
        ${c.ev.map(e=>`<div class="row" style="align-items:flex-start;gap:var(--s3)">
          <span class="chip ${EV_MAP[e.k]?EV_MAP[e.k][1]:'c-mut'}" style="min-width:52px">${e.k}</span>
          <span class="col grow" style="gap:1px">
            <span class="t-sm mut">${esc(e.t)}</span>
            <span class="t-xs mut2 num">${esc(evDetail(e))}${evValid(e)?'':'　⚠ '+EV_MAP[e.k][4]}</span></span>
        </div>`).join('')}
      </div>`}).join('')}
        <p class="hint">六要素口径与端砚一致：文献、数据、代码、工具调用、计算结果、实验记录。</p>
<details class="why"><summary>为什么要凑齐六类</summary><div class="why-b">缺字段的证据不予接受。三个月后回头看，没有版本号和 n 值的数字没人说得清是怎么来的，等于没有。
少了数据与代码更糟：结论连重跑的入口都没有。端砚的证据链就是按这六类组织的，这里对齐它的口径，
是为了这条链能直接接上去，而不是到时候再做一次映射。</div></details>
      </div>
    </section>

    ${(function(){const sc=reviewSelfCheck();
      const localN=REVIEW_DIMS.filter(d=>d.local).length;
      const pass=REVIEW_DIMS.filter(d=>d.local&&sc[d.k]&&sc[d.k].ok).length;
      return `<section class="card"><div class="card-h"><strong>评审七维${ann('M8-F08')}</strong>
        <span class="grow"></span>

               :`<span class="chip">需端砚评审</span>`}

        <div class="row wrap" style="gap:var(--s3)">
          <span class="hint grow">正确性、产物质量、历史审查这三项，本地自查做不了——

</div>`};

/* M9 假设页。一轮从「这一轮要回答什么问题」开始。 */
V.hypo=()=>{const p=PRJ();const r=p.rounds.find(x=>x.i===S.round)||p.rounds[p.rounds.length-1];
 const hs=hypoOf(p.id).sort((a,b)=>b.round-a.round);
 const mine=hs.filter(h=>h.round===r.i);
 const picked=CANDS().filter(c=>S.sel.has(c.id));
 const roundSet=CANDS().filter(c=>c.firstRound===r.i);
 const dr=designReview(picked.length?picked:roundSet,CANDS());
 const t=tcpOf(p);
 const det=t?detectable(t.primary.k,parseInt(String(roundCtx().reps||'n = 3').replace(/\D/g,''),10)||3):null;
return `<div class="page">
  ${roundTabs('hypo')}
  <div class="row wrap">
    <div class="col grow" style="gap:6px">
      <h1 style="font-size:26px;letter-spacing:-.03em">这一轮要回答什么</h1>
      <p class="mut t-md">先写下可证伪的陈述与判据，再去生成候选${ann('M9-F01')}</p>
    </div>
    <button class="btn btn-pri" type="button" data-act="newhypo">新建假设</button>
  </div>

  ${mine.length?'':`<section class="card"><div class="card-b col" style="gap:var(--s3)">
    <strong class="t-md">Round ${r.i} 还没有写下假设</strong>
    <p class="t-md mut">不写也能往下走——但那样这一轮结束时，没人说得清它验证了什么。
      一个没有问题的实验，拿到任何结果都解释得通。</p>
    <div class="row"><button class="btn btn-pri" type="button" data-act="newhypo">写一条</button></div>
  </div></section>`}

  ${hs.map(h=>{const ev=evidenceFor(h),vd=hypoVerdict(h);
    const st=HYPO_STATE[h.pre?vd.state:'draft'];
    return `<section class="card">
    <div class="card-h"><strong>${esc(h.id)}${h.round===r.i?'':`　<span class="t-sm mut2">Round ${h.round}</span>`}</strong>
      <span class="grow"></span><span class="chip ${st[1]}" title="${esc(st[2])}">${st[0]}</span></div>
    <div class="card-b col" style="gap:var(--s5)">
      <p class="t-md" style="font-weight:550;line-height:1.6">${esc(h.text)}</p>
      <div class="row wrap" style="gap:var(--s4)">
        <span class="t-sm mut2">位点 <span class="num">${h.sites.join('、')}</span></span>
        <span class="t-sm mut2">预期效应 <span class="num">${ruleText({k:h.effect.k,cmp:h.effect.dir,v:h.effect.v})}</span></span>
      </div>

      <div class="col" style="gap:var(--s3);padding-top:var(--s4);border-top:1px solid var(--line-2)">
        <div class="row"><span class="lbl grow">花钱之前有什么佐证${ann('M9-F02')}</span>
          <span class="t-sm mut2">支持 ${ev.支持} · 不支持 ${ev.不支持} · 其余无信息</span></div>
        ${ev.rows.map(x=>`<div class="row wrap" style="gap:var(--s3);align-items:flex-start">
          <span class="chip ${x.v==='支持'?'c-ok':x.v==='不支持'?'c-err':''}"
            style="min-width:58px;${x.v==='无信息'?'opacity:.55':''}">${x.v}</span>
          <span class="col grow" style="gap:1px;min-width:220px">
            <span class="t-md">${x.k}</span>
            <span class="t-sm mut2">${x.say}</span></span>
        </div>`).join('')}
        <p class="hint">四类佐证都来自本环境已有的数据，没有一条是现编的。
          全是「无信息」说明这个想法还没有任何支撑，先去查，别先去花钱。</p>
      </div>

      <div class="col" style="gap:var(--s3);padding-top:var(--s4);border-top:1px solid var(--line-2)">
        <span class="lbl">什么结果算验证${ann('M9-F03')}</span>
        ${h.pre?`<div class="row wrap" style="gap:var(--s5)">
            <span class="t-md">达成率 ≥ <span class="num">${pct(h.pre.support)}</span> 算支持</span>
            <span class="t-md">&lt; <span class="num">${pct(h.pre.refute)}</span> 算推翻</span>
            <span class="t-sm mut2">${esc(h.pre.lockedAt)} 由 ${esc(h.pre.by)} 锁定</span>
          </div>
          <div class="row wrap" style="gap:var(--s5)">
            <span class="t-md">当前 <span class="num" style="color:${vd.state==='supported'?'var(--dry)':vd.state==='refuted'?'var(--err)':'var(--ink-2)'}">${pct(vd.rate)}</span>
              <span class="t-sm mut2">（${vd.good||0} / ${vd.n} 条有结果的相关变体）</span></span>
          </div>
          ${vd.state==='inconclusive'?`<p class="t-md" style="color:var(--wet)">
            落在支持线与推翻线之间，<strong>这一批分不出来</strong>。
            要么加样本，要么把判据定得更可分辨——不要事后挪线。</p>`:''}
          <p class="hint">判据是送检前锁定的，锁了就不能改。事后调判据等于没有判据。</p>`
        :`<p class="t-md mut">判据还没锁。锁定之后这条假设才会被自动判定。</p>
          <div class="row"><button class="btn" type="button" data-lock="${h.id}">锁定判据</button></div>`}
      </div>
    </div></section>`}).join('')}

  <section class="card">
    <div class="card-h"><strong>这一批能验得出来吗${ann('M9-F04')}</strong>
      <span class="grow"></span><span class="t-sm mut2">${picked.length?`按当前选中的 ${picked.length} 条`:`按 Round ${r.i} 的 ${roundSet.length} 条`}</span></div>
    <div class="card-b col" style="gap:var(--s5)">

      ${(function(){const nrep=det?det.n:3;
        const all=projFields(p).map(k=>detectable(k,nrep));
        return `<div class="col" style="gap:var(--s3)">
        <span class="lbl">可检出效应（α=0.05 双侧，功效 80%，n=${nrep}）</span>
        ${all.map(d=>d.sigma==null
          ? `<div class="row wrap" style="gap:var(--s3);align-items:flex-start">
              <span class="chip c-err" style="min-width:58px">算不出</span>
              <span class="col grow" style="gap:1px;min-width:220px">
                <span class="t-md"><span class="sym">${FIELD[d.k].n}</span></span>
                <span class="t-sm mut2">${esc(d.why)}</span></span></div>`
          : `<div class="row wrap" style="gap:var(--s3);align-items:flex-start">
              <span class="chip c-ok" style="min-width:58px">${d.log?d.fold.toFixed(2)+'×':d.delta.toFixed(2)+FIELD[d.k].unit}</span>
              <span class="col grow" style="gap:1px;min-width:220px">
                <span class="t-md"><span class="sym">${FIELD[d.k].n}</span>　小于这个差别就分辨不了</span>
                <span class="t-sm mut2">σ 取本项目重复数据的中位数 <span class="num">${d.sigma}</span>${d.log?'（对数空间）':''}</span></span></div>`).join('')}
        <p class="hint">公式 δ = 2.80 · σ · √(2/n)。σ 来自本项目自己的重复测量，不是查表来的。
          算不出来的那几项，说明这个项目从来没对同一条变体做过重复——那就不知道测定本身有多准。</p>
      </div>`})()}

      ${(function(){ if(!t)return '';
        /* 哪些约束落在噪声里：对每个有重复标准差的字段都查一遍。 */
        const nrep2=det?det.n:3;
        const checks=projFields(p).map(k=>detectable(k,nrep2)).filter(d=>d.sigma!=null);
        if(!checks.length)return '';
        const dd=checks[0];
        /* 约束设在测不出来的精度之内，是这一块最该抓的事。 */
        const bad=t.constraints.concat([t.primary]).filter(c=>c.k===dd.k).map(c=>{
          const base=c.k==='kd'?WT.kd:null;
          if(base==null)return null;
          const fold=Math.max(base,c.v)/Math.min(base,c.v);
          return {c:c,fold:fold}}).filter(x=>x&&x.fold<dd.fold);
        if(!bad.length)return '';
        return `<div style="border-left:2px solid var(--err);padding-left:var(--s4)">
          <div class="lbl" style="color:var(--err)">有约束设在了测不出来的精度之内</div>
          ${bad.map(x=>`<p class="t-md mut" style="margin-top:4px">
            约束「${esc(x.c.n||ruleText(x.c))}」要求与野生型相差 <span class="num">${x.fold.toFixed(2)}×</span>，
            而当前测定在 n=${dd.n} 下只能分辨 <span class="num">${dd.fold.toFixed(2)}×</span>。
            <strong>这条约束现在判不了</strong>——达标与不达标之间的差，落在噪声里。</p>`).join('')}
          <p class="t-md mut" style="margin-top:var(--s2)">要么把重复数提到
            <span class="num">${(function(){const d=Math.log10(bad[0].fold);return d>0?Math.ceil(2*Math.pow(2.802*dd.sigma/d,2)):'∞'})()}</span>，

/* 重训尝试：可能失败、可能退步回滚。轮次指向的是尝试，不是结果。 */
/* 重训是「尝试」，不是必然成功的事件。轮次指向尝试，这样才查得到「那一轮试过但没用上」。 */
const RETRAINS=[
 {round:2,at:'2026-10-12 16:05',batch:'B-2407',n:44,from:'v1',to:'v1',before:.58,after:.54,
  status:'rolled_back',measured:30,failed:14},

const RETRAIN_STATUS={active:['已启用','c-ok'],rolled_back:['退步，已回滚','c-err'],
  failed:['训练失败','c-err'],running:['训练中','c-dry']};

/* 轮次状态是推导态，不是手工态。
   方向只有一个：服务商 → 批次 → 轮次。不存在反过来改。 */
const ROUND_LABEL={active:'进行中',assay:'送检中',reflux:'回流中',done:'已归档'};
function deriveRound(roundNo,archived){
  if(archived)return {state:'done',why:'用户已确认收口'};
  const bs=BATCHES_OF().filter(b=>b.round===roundNo);
  if(!bs.length)return {state:'active',why:'尚无送检批次'};
  if(bs.every(b=>b.status==='draft'))return {state:'active',why:'批次都还是草稿'};
  if(!bs.every(b=>b.status==='done'))
    return {state:'assay',why:`${bs.filter(b=>b.status!=='done').length} 个批次未完成`};
  const rt=RETRAINS.find(r=>r.round===roundNo);
  if(!rt)return {state:'reflux',why:'批次全部完成，重训尚未进行'};
  return {state:'reflux',why:'重训已完成，等待人工确认收口'};
}

/* 卡片页脚三个数字由轮次实时聚合，不手填 */
function aggregate(p){
  return {rounds:p.rounds.length,
    variants:p.rounds.reduce((a,r)=>a+r.v,0),
    returned:p.rounds.reduce((a,r)=>a+r.r,0)};
}
/* 证据链：计算类必须带模型版本，实验类必须带批次与 n */
/* 证据链六要素，口径对齐端砚（E2，上海 AI 实验室官方发布）：
   文献、数据、代码、工具调用、计算结果、实验记录。
   之前这里只有 计算 / 实验 / 文献 三类——少了 数据、代码、工具调用。
   少的那三类恰好是「能不能重跑」的关键：没有输入数据和代码，结论就只是一句话。
   所以不但要能挂这三类，还要把缺哪一类**显式标出来**，不能靠「有四条证据」糊过去。 */
const EV_KINDS=[
  ['文献','c-mut',  e=>!!e.ref,                  'ref',  '需出处'],
  ['数据','c-mut',  e=>!!(e.dataset&&e.rows),    'dataset','需数据集与条数'],
  ['代码','c-dry',  e=>!!(e.repo&&e.commit),     'repo', '需仓库与 commit'],
  ['工具调用','c-dry',e=>!!(e.tool&&e.ver),      'tool', '需工具名与版本'],
  ['计算','c-dry',  e=>!!e.model,                'model','需模型版本'],
  ['实验','c-wet',  e=>!!(e.batch&&e.n),         'batch','需批次号与 n 值']];
const EV_MAP={};EV_KINDS.forEach(k=>EV_MAP[k[0]]=k);
function evValid(e){const k=EV_MAP[e.k];return k?k[2](e):false}
function evDetail(e){
  if(e.k==='计算')return `任务 ${e.task} · 模型 ${e.model}`;
  if(e.k==='实验')return `批次 ${e.batch} · n=${e.n} · 宿主 ${e.host}`;
  if(e.k==='数据')return `${e.dataset} · ${e.rows} 条`;
  if(e.k==='代码')return `${e.repo} @ ${e.commit}`;
  if(e.k==='工具调用')return `${e.tool} ${e.ver}`;
  return e.ref||'';
}
/* 六要素覆盖：哪几类有、哪几类缺。缺的要点名。 */
function evCoverage(c){
  const have=new Set(c.ev.filter(evValid).map(e=>e.k));
  return {have:have, missing:EV_KINDS.map(k=>k[0]).filter(n=>!have.has(n))};
}
/* 评审七维，口径对齐端砚的评审智能体（E2）：
   需求完成度、正确性、证据与来源、可复现性、产物质量、工具执行、历史审查。

   为什么要在产品里立这个面板：这个项目到现在没有任何第三方评审——
   实现、验收、走查都是同一方做的。平台恰好有一个独立评审能力，
   那就应该把它的七个维度摆在产品里，而不是自己另造一套「自验证」。

   四项我们能在本地自查，三项不能——不能的那三项**明说需要端砚的评审智能体**，
   不拿自查去冒充评审。 */
const REVIEW_DIMS=[
 {k:'need', n:'需求完成度', what:'目标达成到什么程度', local:true},
 {k:'correct', n:'正确性', what:'结论能否被独立重新推出来', local:false},
 {k:'evidence',n:'证据与来源', what:'每条结论的六要素是否齐全', local:true},
 {k:'repro', n:'可复现性', what:'复现包是否能在相同条件下重跑', local:true},
 {k:'artifact',n:'产物质量', what:'导出物能否被下游直接用', local:false},
 {k:'tool', n:'工具执行', what:'工具调用是否真的成功过', local:true},
 {k:'history',n:'历史审查', what:'上一轮遗留问题是否复查', local:false}];
function reviewSelfCheck(){
  const P=PRJ(), st=hitStats(CANDS(),P), t=tcpOf(P);
  const goal=t&&t.primary?ruleText(t.primary):'（本项目未设结构化目标）';
  const cov=CLAIMS.map(evCoverage);
  const full=cov.filter(x=>!x.missing.length).length;
  const keyKinds=['数据','代码'];
  const reproOk=CLAIMS.every(c=>keyKinds.every(k=>evCoverage(c).have.has(k)));
  return {
    need:{ok:st.hits>0,
      say:st.hits>0?`已有 ${st.hits} 条命中（${goal} 且约束全满足）`
                   :`命中 0 条，主目标 ${goal} 尚未与约束同时满足`},
    evidence:{ok:full===CLAIMS.length,
      say:`${full}/${CLAIMS.length} 条结论六要素齐全`+
        (full<CLAIMS.length?`；缺口：${cov.filter(x=>x.missing.length).map(x=>x.missing.join('、')).join('｜')}`:'')},
    repro:{ok:reproOk,
      say:reproOk?'每条结论都挂了数据与代码，复现包三件套齐全'
                 :'有结论没挂数据或代码，相同条件下重跑不出来'},
    /* 「没报错」不等于「成功过」。从没调用过的工具不能算自查通过——
       那正是把空白当成绿色，和被预先勾好的质检框一个毛病。 */
    tool:(function(){
      const st=LS.get('mstat',null);          // {ok:bool, at:'…', msg:'…'}，连通性测试写入
      if(!st)return {ok:false,say:MC.ready()?'密钥已填，但还没成功调用过——去设置页跑一次连通性测试'
                                            :'基模未配置密钥，尚未成功调用过'};
      return {ok:!!st.ok, say:st.ok?`最近一次调用成功（${st.at}）`:`最近一次调用失败：${st.msg||'未知错误'}`};
    })()
  };
}
/* ================= M9 假设与实验设计 =================
   研究员关心的是：我有一个想法，怎么佐证它、怎么验它、这批实验能不能验得出来。
   而这个产品在加这一块之前只回答「怎么让这个数变大」——它是个优化引擎，不是科研仪器。
   数据模型里原本只有「结论」（CLAIMS，事后的），**没有「假设」**。

   一条假设是可证伪的陈述 + 它覆盖哪些位点 + 预期效应的方向与大小。 */
const HYPO=[
 {id:'H-01',pid:'p1',round:4,
  text:'N55 区域的突变能在不损失亲和力的前提下把 ΔTm 提到 +5℃ 以上',
  sites:[55],effect:{k:'dTm',dir:'>=',v:5},
  /* 预先声明的判据。锁定之后不能改——事后调判据等于没有判据。 */
  pre:{support:0.20,refute:0.05,lockedAt:'2026-11-05 09:12',by:'张哲娴'},
  state:'testing'},
 {id:'H-02',pid:'p1',round:3,
  text:'W33 位点任何突变都会破坏折叠',
  sites:[33],effect:{k:'iptm',dir:'<=',v:0.5},
  pre:{support:0.60,refute:0.20,lockedAt:'2026-10-21 15:40',by:'李'},
  state:'testing'},
 {id:'H-03',pid:'p1',round:5,
  text:'N46 与 N97 的双突变有正向上位效应',
  sites:[46,97],effect:{k:'dTm',dir:'>=',v:6},
  pre:null,state:'draft'}];
function hypoOf(pid,round){return HYPO.filter(h=>h.pid===(pid||S.pid)&&(round==null||h.round===round))}
const HYPO_STATE={draft:['草稿','',  '判据还没锁，锁定之后才能算验证'],
  testing:['验证中','c-dry','判据已锁，等数据'],
  supported:['被支持','c-ok','达到预先声明的支持线'],
  refuted:['被推翻','c-err','低于预先声明的推翻线'],
  inconclusive:['不确定','c-wet','落在支持线与推翻线之间，这一批分不出来']};
const posOfMut=m=>+String(m).replace(/^[A-Z]/,'').replace(/[A-Z]$/,'');
function hitsSite(c,sites){return (c.muts||[c.mut]).some(m=>sites.indexOf(posOfMut(m))>=0)}

/* ---- 佐证：一个想法在花钱之前有什么支持 ----
   四类，每类给「支持 / 不支持 / 无信息」，并把实际数字摆出来。
   全部来自本环境已有的数据，不编。 */
function evidenceFor(h){
  const rel=CANDS(h.pid).filter(c=>hitsSite(c,h.sites));
  const measured=rel.filter(c=>c.disposition==='measured');
  const out=[];
  // 1 文献
  const lit=rel.filter(c=>c.src==='文献推断'&&c.ref);
  out.push({k:'文献',v:lit.length?'支持':'无信息',
    say:lit.length?`${lit.length} 条同位点变体来自文献推断，出处 ${[...new Set(lit.map(c=>c.ref))].slice(0,2).join('；')}`
                  :'本环境没有这些位点的文献记录',
    n:lit.length});
  // 2 进化保守性：越保守越不该随便改
  const con=measured.length?measured.reduce((a,c)=>a+c.dims.con,0)/measured.length:null;
  out.push({k:'进化保守性',v:con==null?'无信息':(con<0.5?'支持':con>0.75?'不支持':'无信息'),
    say:con==null?'这些位点还没有有结果的变体':
      `这些位点的平均保守性 ${con.toFixed(2)}` +
      (con<0.5?'，不保守，容忍突变':con>0.75?'，高度保守，改动风险大':'，中等，看不出倾向'),
    n:measured.length});
  // 3 结构：折得出来吗
  const fold=rel.filter(c=>c.iptm>=S.gate).length;
  out.push({k:'结构',v:rel.length?(fold/rel.length>=0.5?'支持':'不支持'):'无信息',
    say:rel.length?`${rel.length} 条里 ${fold} 条过准入闸门（${pct(fold/rel.length)}）`:'还没有这些位点的设计',
    n:rel.length});
  // 4 本项目历史
  const k=h.effect.k;
  const good=measured.filter(c=>ruleOk({k:k,cmp:h.effect.dir,v:h.effect.v},c)).length;
  out.push({k:'本项目历史',v:!measured.length?'无信息':(good/measured.length>=0.15?'支持':'不支持'),
    say:measured.length?`${measured.length} 条有结果，其中 ${good} 条达到 ${ruleText({k:k,cmp:h.effect.dir,v:h.effect.v})}（${pct(good/measured.length)}）`
                       :'这些位点还没有回流数据',
    n:measured.length});
  return {rows:out,rel:rel,measured:measured,
    支持:out.filter(x=>x.v==='支持').length,不支持:out.filter(x=>x.v==='不支持').length};
}

/* ---- 验证：按预先声明的判据判定，不事后改判据 ---- */
function hypoVerdict(h){
  if(!h.pre)return {state:'draft',rate:null,n:0};
  const rel=CANDS(h.pid).filter(c=>hitsSite(c,h.sites)&&c.disposition==='measured');
  if(!rel.length)return {state:'testing',rate:null,n:0};
  const rule={k:h.effect.k,cmp:h.effect.dir,v:h.effect.v};
  const good=rel.filter(c=>ruleOk(rule,c)).length;
  const rate=good/rel.length;
  const st=rate>=h.pre.support?'supported':rate<h.pre.refute?'refuted':'inconclusive';
  return {state:st,rate:rate,n:rel.length,good:good,rule:rule};
}

/* ---- 设计实验（一）：可检出效应 ----
   两样本均值比较，α=0.05 双侧，功效 80%：δ = 2.80 · σ · √(2/n)
   σ 必须来自本项目自己的重复数据。没有重复数据就给不出来——
   这时候要说「先测重复」，而不是编一个 σ。 */
function detectable(k,nrep){
  const f=FIELD[k];if(!f)return null;
  const L=CANDS().filter(c=>c.disposition==='measured'&&sdOf(c,k)!=null);
  if(!L.length)return {sigma:null,k:k,
    why:`本项目的 ${f.n} 没有重复测量的标准差，算不出可检出效应。先在一批里对同一条变体做重复，才知道这个测定能分辨多小的差。`};
  const sd=L.map(c=>sdOf(c,k)).sort((a,b)=>a-b);
  const sigma=sd[Math.floor(sd.length/2)];
  const n=Math.max(1,nrep||3);
  const delta=2.802*sigma*Math.sqrt(2/n);
  return {sigma:sigma,n:n,delta:delta,k:k,log:!!f.log,
    fold:f.log?Math.pow(10,delta):null,nFor:(d)=>Math.ceil(2*Math.pow(2.802*sigma/d,2))};
}

/* ---- 设计实验（二）：这板子能不能分辨主效应 ----
   依据：部分因子设计那篇（bioRxiv 298273）。七个位点两水平全因子 128 条，
   1/8 部分因子 16 条就能估主效应，工作量降为 1/8；
   代价是二因子效应之间部分混杂，必须说清谁和谁混。 */
function designReview(list,history){
  const sets=list.map(c=>(c.muts||[c.mut]).map(posOfMut));
  const pos=[...new Set([].concat.apply([],sets))].sort((a,b)=>a-b);
  /* 主效应能不能分辨，要看整个项目的历史——单突变可能来自更早的轮次，
     那时候测过的单点效应现在仍然算数。只看这一板会得出「什么都分辨不了」的错结论。 */
  const hist=(history||list).map(c=>(c.muts||[c.mut]).map(posOfMut));
  const aloneOf={};pos.forEach(p=>{aloneOf[p]=hist.filter(s=>s.length===1&&s[0]===p).length});
  const noAlone=pos.filter(p=>!aloneOf[p]);
  const conf=[];
  for(let i=0;i<pos.length;i++)for(let j=i+1;j<pos.length;j++){
    const a=pos[i],b=pos[j];
    const tog=sets.filter(s=>s.indexOf(a)>=0&&s.indexOf(b)>=0).length;
    if(tog>0&&!aloneOf[a]&&!aloneOf[b])conf.push([a,b,tog]);
  }
  return {n:list.length,pos:pos,aloneOf:aloneOf,noAlone:noAlone,conf:conf,histN:hist.length,
    full:pos.length?Math.pow(2,pos.length):0,
    maxOrder:sets.length?Math.max.apply(null,sets.map(s=>s.length)):0};
}

function idType(v){

/* M2-F01 三种格式解析：FASTA / 带编号 / 裸序列 */
function parseSeq(raw){
  const txt=String(raw||'').trim();
  if(!txt)return {ok:false,err:'空输入'};
  let fmt,chains=[];
  if(/^\s*>/.test(txt)){
    fmt='FASTA';
    txt.split(/^>/m).filter(x=>x.trim()).forEach((blk,i)=>{
      const nl=blk.indexOf('\n');
      const hdr=(nl<0?blk:blk.slice(0,nl)).trim();
      const body=(nl<0?'':blk.slice(nl)).replace(/[\s\d]/g,'').toUpperCase();
      chains.push({id:hdr.split(/[|\s]/)[0]||String.fromCharCode(65+i),seq:body,hdr:hdr})});
  }else if(/^\s*\d+\s+[A-Za-z]/.test(txt)||/[A-Za-z]{5,}\s+\d+\s*$/m.test(txt)){
    fmt='带编号';
    chains=[{id:'A',seq:txt.replace(/[\s\d]/g,'').toUpperCase()}];
  }else{
    fmt='裸序列';
    chains=[{id:'A',seq:txt.replace(/[\s\d]/g,'').toUpperCase()}];
  }
  chains=chains.filter(c=>c.seq.length);
  if(!chains.length)return {ok:false,err:'没有解析出任何残基',fmt:fmt};
  /* 非标准与非法残基逐个定位 */
  const ns=[],bad=[];
  chains.forEach(c=>{for(let i=0;i<c.seq.length;i++){const ch=c.seq[i];
    if(AA20.indexOf(ch)>=0)continue;
    (NONSTD[ch]?ns:bad).push({chain:c.id,pos:i+1,ch:ch})}});
  const tooLong=chains.filter(c=>c.seq.length>MAX_SEQ_LEN);
  return {ok:bad.length===0&&!tooLong.length,fmt:fmt,chains:chains,ns:ns,bad:bad,raw:txt,
    tooLong:tooLong.map(c=>({id:c.id,len:c.seq.length})),
    total:chains.reduce((a,c)=>a+c.seq.length,0)};
}
/* M2-F03 批量导入：CSV / FASTA，输出接受 / 拒绝 / 重复 */
function parseBatch(raw,max){
  max=max||384;
  const txt=String(raw||'').trim();
  const acc=[],rej=[],dup=[];const seen=new Set();
  if(!txt)return {acc:acc,rej:rej,dup:dup,fmt:'—'};
  if(/^\s*>/.test(txt)){
    const r=parseSeq(txt);
    (r.chains||[]).forEach((c,i)=>{
      const key=c.seq;
      if(!c.seq.length){rej.push({line:i+1,id:c.id,why:'序列为空'});return}
      const ill=[...c.seq].filter(x=>AA20.indexOf(x)<0&&!NONSTD[x]);
      if(ill.length){rej.push({line:i+1,id:c.id,why:`含非法字符 ${[...new Set(ill)].join('')}`});return}
      if(seen.has(key)){dup.push({line:i+1,id:c.id,why:'与前面某条序列完全相同'});return}
      seen.add(key);acc.push({id:c.id,seq:c.seq,line:i+1})});
    return {acc:acc,rej:rej,dup:dup,fmt:'FASTA'};
  }
  const lines=txt.split(/\r?\n/);
  let start=0;
  if(/[a-z_]/i.test(lines[0])&&/(id|name|seq|sequence|变体|序列)/i.test(lines[0])&&lines[0].indexOf(',')>=0)start=1;
  for(let i=start;i<lines.length;i++){
    const ln=lines[i].trim();const no=i+1;
    if(!ln)continue;
    const cells=ln.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
    if(cells.length<2){rej.push({line:no,id:cells[0]||'—',why:'列数不足，至少需要 变体名,序列'});continue}
    const id=cells[0],seq=(cells[1]||'').toUpperCase().replace(/\s/g,'');
    if(!id){rej.push({line:no,id:'—',why:'变体名为空'});continue}
    if(!seq){rej.push({line:no,id:id,why:'序列为空'});continue}
    const ill=[...seq].filter(x=>AA20.indexOf(x)<0&&!NONSTD[x]);
    if(ill.length){rej.push({line:no,id:id,why:`第 ${seq.indexOf(ill[0])+1} 位是非法字符「${ill[0]}」`});continue}
    if(seq.length>MAX_SEQ_LEN){rej.push({line:no,id:id,why:`长度 ${seq.length} 超过单条上限 ${MAX_SEQ_LEN}`});continue}
    if(seen.has(seq)){dup.push({line:no,id:id,why:'序列与前面某条重复'});continue}
    if(acc.length>=max){rej.push({line:no,id:id,why:`超出单次上限 ${max} 条`});continue}
    seen.add(seq);acc.push({id:id,seq:seq,line:no});
  }
  return {acc:acc,rej:rej,dup:dup,fmt:'CSV'};
}
/* M2-F05 残基选择：区间与单点混写 */
function parseRanges(str,maxLen){
  const out=new Set(),bad=[];
  String(str||'').split(/[,，;；]/).forEach(tok=>{
    tok=tok.trim();if(!tok)return;
    const m=tok.match(/^(\d+)\s*[-–~]\s*(\d+)$/);
    if(m){let a=+m[1],b=+m[2];if(a>b){const t=a;a=b;b=t}
      if(maxLen&&b>maxLen){bad.push(tok+'（超出序列长度）');return}
      for(let i=a;i<=b;i++)out.add(i);return}
    if(/^\d+$/.test(tok)){const n=+tok;
      if(maxLen&&n>maxLen){bad.push(tok+'（超出序列长度）');return}
      out.add(n);return}
    bad.push(tok+'（格式无法识别）');
  });
  return {set:out,bad:bad};
}
function fmtRanges(set){
  const a=[...set].sort((x,y)=>x-y);if(!a.length)return '';
  const out=[];let s0=a[0],prev=a[0];
  for(let i=1;i<=a.length;i++){const v=a[i];
    if(v===prev+1){prev=v;continue}
    out.push(s0===prev?String(s0):s0+'-'+prev);s0=v;prev=v}
  return out.join(', ');
}

/* M2-F04 回显：四项齐全、非标准残基定位、可编辑、未确认不能提交 */
function echoPanel(P){
  if(!P.ok&&P.err)return `<section class="card"><div class="card-b">
    <div style="border-left:2px solid var(--err);padding-left:var(--s4)">
      <div class="lbl" style="color:var(--err)">解析失败</div>
      <p class="t-md mut" style="margin-top:4px">${esc(P.err)}</p></div></div></section>`;
  const known=P.pdb?`${P.pdb}`:'无';
return `<section class="card">
  <div class="card-h"><strong>回显与确认${ann('M2-F04')}</strong>
    <span class="chip ${P.ok?'c-ok':'c-err'}">${P.ok?'可用':'有非法残基'}</span>
    <span class="grow"></span>
    <button class="btn btn-gh" type="button" data-act="rawin">看原始输入</button></div>
  <div class="card-b col" style="gap:var(--s5)">
    <div class="kpi" style="grid-template-columns:repeat(auto-fit,minmax(118px,1fr));border-bottom:0;padding-bottom:0">
      <div><div class="t-sm">链数</div><div class="v">${P.chains.length}</div></div>
      <div><div class="t-sm">残基数</div><div class="v">${P.total}</div></div>
      <div><div class="t-sm">非标准残基</div><div class="v" style="${P.ns.length?'color:var(--wet)':''}">${P.ns.length}</div></div>
      <div><div class="t-sm">已知结构</div><div class="v" style="font-size:20px">${esc(known)}</div></div>
      <div><div class="t-sm">输入格式</div><div class="v" style="font-size:20px">${esc(P.fmt)}</div></div>
    </div>
    ${(P.tooLong&&P.tooLong.length)?`<div style="border-left:2px solid var(--err);padding-left:var(--s4)">
      <div class="lbl" style="color:var(--err)">超出单条长度上限</div>
      <p class="t-sm mut num" style="margin-top:4px">${P.tooLong.map(x=>`链 ${x.id} 共 ${x.len} 残基`).join('　')}</p>
      <p class="hint" style="margin-top:4px">单条上限 ${MAX_SEQ_LEN} 残基，与批量导入同一口径。超长的请拆开或截取目标结构域。</p></div>`:''}
    ${P.bad.length?`<div style="border-left:2px solid var(--err);padding-left:var(--s4)">
      <div class="lbl" style="color:var(--err)">非法残基 ${P.bad.length} 处</div>
      <p class="t-sm mut num" style="margin-top:4px">${P.bad.slice(0,12).map(x=>`链 ${x.chain} 第 ${x.pos} 位「${x.ch}」`).join('　')}${P.bad.length>12?' …':''}</p>
      <p class="hint" style="margin-top:4px">改掉这些位置才能继续。可在上方输入框直接编辑后重新解析。</p></div>`:''}
    ${P.ns.length?`<div style="border-left:2px solid var(--wet);padding-left:var(--s4)">
      <div class="lbl" style="color:var(--wet)">非标准残基 ${P.ns.length} 处</div>
      <p class="t-sm mut num" style="margin-top:4px">${P.ns.slice(0,12).map(x=>`链 ${x.chain} 第 ${x.pos} 位 ${x.ch}（${NONSTD[x.ch]}）`).join('　')}${P.ns.length>12?' …':''}</p>
      <p class="hint" style="margin-top:4px">可以继续，但多数设计模型不支持非标准残基，会被当作最接近的标准残基处理。</p></div>`:''}
    <div class="col" style="gap:var(--s3)">
      <span class="lbl">序列（可直接编辑）</span>
      ${P.chains.map((c,i)=>`<div class="col" style="gap:4px">
        <div class="row"><span class="t-sm mut2">链 ${esc(c.id)}</span><span class="grow"></span>
          <span class="t-sm mut2 num">${c.seq.length} 残基</span></div>
        <textarea class="input num" data-chain="${i}" style="min-height:62px;font-size:11.5px;line-height:1.75">${esc(c.seq)}</textarea>
      </div>`).join('')}
      <div class="row"><span class="grow"></span>
        <button class="btn btn-gh" type="button" data-act="reparse">重新解析编辑后的序列</button></div>
    </div>
    <label class="row" style="gap:var(--s3);cursor:pointer;padding-top:var(--s3);border-top:1px solid var(--line-2)">
      <input type="checkbox" data-act2="confirm" ${IN.confirmed?'checked':''} ${P.ok?'':'disabled'}>
      <span class="t-md">我已核对上面的链数、残基数与序列内容</span></label>
  </div>
</section>`}

/* M2-F05 残基选择 */
function sitePanel(P){
  const c0=P.chains[0];const L=c0.seq.length;
  const txt=fmtRanges(IN.sel);
  const chunk=10;
  let html='';
  for(let i=0;i<L;i+=chunk){
    html+=`<span class="num" style="display:inline-block;margin:0 7px 5px 0">
      <span class="t-xs mut2" style="display:block;line-height:1">${i+1}</span>`;
    for(let j=i;j<Math.min(i+chunk,L);j++){
      const on=IN.sel.has(j+1);
      html+=`<i data-res="${j+1}" style="font-style:normal;cursor:pointer;padding:1px 0;border-radius:2px;
        background:${on?'var(--dry)':'transparent'};color:${on?'var(--on-dry)':'inherit'}">${c0.seq[j]}</i>`}
    html+='</span>';
  }
return `<section class="card">
  <div class="card-h"><strong>选择设计位点${ann('M2-F05')}</strong>
    <span class="grow"></span><span class="t-sm mut2">已选 <span class="num">${IN.sel.size}</span> 个残基</span></div>
  <div class="card-b col" style="gap:var(--s4)">
    <div id="seqmap" style="font-size:12.5px;line-height:2;background:var(--surface-2);
      border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);user-select:none">${html}</div>
    <div class="row wrap" style="gap:var(--s3);align-items:flex-end">
      <div class="field grow" style="max-width:360px"><label class="label" for="res">位点（区间与单点可混写）</label>
        <input id="res" class="input num" value="${esc(txt)}" placeholder="34-42, 55, 73-80">
        ${IN.resErr?`<span class="hint" style="color:var(--err)">${esc(IN.resErr)}</span>`
          :`<span class="hint">点序列上的字母可直接勾选，与这里双向同步</span>`}</div>
      <button class="btn btn-gh" type="button" data-act="clearsel">清空</button>
    </div>
  </div></section>`}

/* M2-F06 实验上下文：四个必填 + 受控词表 + 批次级批量填写 */
function ctxPanel(miss){
  const CX=roundCtx();
  const F=CTX_FIELDS.map(([k,n,v,req,multi])=>[k,n,k==='host'?HOSTS:k==='assay'?ASSAYS:v,req,multi]);
return `<section class="card">
  <div class="card-h"><strong>实验上下文${ann('M2-F06')}</strong>
    <span class="chip ${miss.length?'c-err':'c-ok'}">${miss.length?`缺 ${miss.length} 项必填`:'已填齐'}</span>
    <span class="grow"></span>
    <button class="btn btn-gh" type="button" data-act="ctxbatch">套用上一批次</button></div>
  <div class="card-b col" style="gap:var(--s4)">
    <div style="display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(176px,1fr))">
      ${F.map(([k,n,vocab,req,multi])=>{
        const sel=multi?asList(CX[k]):[];
        const empty=multi?!sel.length:!CX[k];
        return `<div class="field">
        <span class="label">${n}${req?'':' <span style="font-weight:400;text-transform:none;letter-spacing:0">选填</span>'}${multi?' <span style="font-weight:400;text-transform:none;letter-spacing:0">可多选</span>':''}</span>
        ${multi?`<div class="row wrap" style="gap:var(--s2);${req&&empty?'outline:1px solid var(--err);outline-offset:3px;border-radius:4px':''}">
            ${vocab.map(o=>`<label class="chip" style="cursor:pointer;${sel.indexOf(o)>=0?'background:var(--dry-soft);border-color:var(--dry);color:var(--dry-ink);font-weight:600':''}">
              <input type="checkbox" data-cxm="${k}" value="${esc(o)}" ${sel.indexOf(o)>=0?'checked':''}
                style="margin-right:4px;vertical-align:-1px" aria-label="${esc(o)}">${esc(o)}</label>`).join('')}
          </div>`
        :vocab?`<select id="cx_${k}" class="input" data-cx="${k}" style="${req&&empty?'border-color:var(--err)':''}">
            <option value="">未选择</option>
            ${vocab.map(o=>`<option ${CX[k]===o?'selected':''}>${o}</option>`).join('')}</select>`
          :`<input id="cx_${k}" class="input" data-cx="${k}" value="${esc(CX[k]||'')}"
             placeholder="${k==='buffer'?'PBS pH 7.4':'25℃'}"
             style="${req&&empty?'border-color:var(--err)':''}">`}
      </div>`}).join('')}
    </div>
    <p class="hint">宿主与测定方法是受控词表，不接受自由填写。</p>
<details class="why"><summary>为什么这样定</summary><div class="why-b">这两项是结果可比性的前提。自由文本会让同一个测定在统计时被拆成几种，聚合出来的数字就不能用了。</div></details>
    ${annNote('实验上下文是字段不是备注（垂域差异 D2）。必填四项有出处：Cradle 的样本追踪 schema 要求样本 ID 能还原出蛋白、实验轮次与目标。缓冲体系与温度为选填，Cradle schema 中无此字段，标 E4。')}
  </div></section>`}

function batchPreview(B){
return `<div class="col" style="gap:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line)">

    </tbody></table></div>`:''}
  ${B.acc.length?`<div class="row"><span class="t-sm mut2 grow">接受的 ${B.acc.length} 条将作为一批进入确认步骤</span>
    <button class="btn btn-pri" type="button" data-act="usebatch">用这 ${B.acc.length} 条</button></div>`
    :`<p class="hint" style="color:var(--err)">没有任何一条通过校验，修正后重新预览。</p>`}
</div>`}

/* MSA 是整条链上唯一的长耗时环节，粒度是轮次不是单条序列。
   依据：ColabFold 官方数据，数据库约 195–221 GB，批量检索约 128 GB 内存，
   单条交互式检索至少 768 GB 内存——自建环境下「点一下等着看」这个交互不成立。 */
const MSA={mode:'batch', queued:2, done:34, total:88, eta:'约 40 分钟'};
const MSA_MODES={
  batch:{n:'自建批量',note:'序列不出本地。整轮一起排队，约 128 GB 内存',priv:'不外流'},
  public:{n:'公共 MSA 服务',note:'免费、零运维，但有限流',priv:'序列发往外部'},
  cached:{n:'复用已有 MSA',note:'同一靶点上一轮算过的直接用',priv:'不外流'}};
function msaPanel(){
  const m=MSA_MODES[MSA.mode];
  const pct=Math.round(MSA.done/MSA.total*100);
return `<section class="card" style="border-left:2px solid var(--dry);padding-left:var(--s4)">
  <div class="row wrap" style="gap:var(--s3)">
    <span class="lbl" style="color:var(--dry)">MSA 构建</span>
    <span class="grow"></span>
    <span class="t-sm mut2 num">${MSA.done}/${MSA.total} · 队列第 ${MSA.queued} 位 · ${MSA.eta}</span>
  </div>
  <div class="bar" style="margin-top:var(--s3)"><i style="width:${pct}%;background:var(--dry)"></i></div>
  <div class="row wrap" style="gap:var(--s2);margin-top:var(--s3)">
    ${Object.keys(MSA_MODES).map(k=>`<button class="btn ${MSA.mode===k?'':'btn-gh'}" type="button" data-msa="${k}"
      style="min-height:24px;font-size:12px${MSA.mode===k?';border-color:var(--dry);color:var(--dry-ink);background:var(--dry-soft);font-weight:600':''}">${MSA_MODES[k].n}</button>`).join('')}
  </div>
  <p class="t-sm mut" style="margin-top:var(--s3)">${esc(m.note)}</p>
  ${MSA.mode==='public'?`<p class="hint" style="color:var(--err);margin-top:4px">
    这条路会把序列发到外部，与「序列不外流」的承诺冲突。未发表序列不要走这条。</p>`
   :`<p class="hint" style="margin-top:4px">序列${esc(m.priv)}。</p>`}
</section>`}

/* M2-F06 最后一条：结果页按实验上下文分组。
   不同宿主、不同测定方法、不同缓冲体系测出来的数不能直接比——
   放在同一张表里按同一列排序，等于在比不可比的东西。
   分组不是为了好看，是为了让人看见「这两段数来自不同条件」。 */
function ctxSig(c0){
  const {ctx,src,planned}=ctxOf(c0);
  const parts=[ctx.host,asList(ctx.assay).join('+'),ctx.buffer,ctx.temp].filter(Boolean);
  return {key:(planned?'plan|':'')+(parts.join('|')||'未填'),
    label:parts.length?parts.join(' · '):'未填实验上下文',
    src:src, planned:planned};
}
function groupRows(rows){
  const m=new Map();
  rows.forEach(c=>{const g=ctxSig(c);
    if(!m.has(g.key))m.set(g.key,{label:g.label,src:g.src,planned:g.planned,rows:[]});
    m.get(g.key).rows.push(c)});
  const multi=m.size>1;
  return [...m.values()].map(v=>[{label:v.label,src:v.src,planned:v.planned,warn:multi},v.rows]);
}

function greet(){const h=new Date().getHours();

/* 工作台主视觉：接触图。对角带 = 序列上相邻的残基必然接触；
   两块对称的离对角簇 = 两个结构域之间的界面。固定尺寸、硬边、带框。 */
function ribbonArt(){
  const N=16,cell=9,gap=2,q=cell+gap,S0=N*q-gap,PAD=9;
  let seed=7;const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648};
  let cells='';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const d=Math.abs(i-j);let v=0;
    if(d<=1)v=1;
    else if(d===2)v=.62;
    else if(d===3)v=.3;
    else if((i>=3&&i<=6&&j>=11&&j<=14)||(j>=3&&j<=6&&i>=11&&i<=14))v=.5+rnd()*.42;
    else if((i>=8&&i<=10&&j>=0&&j<=2)||(j>=8&&j<=10&&i>=0&&i<=2))v=.34+rnd()*.26;
    else if(rnd()<.045)v=.2;
    if(v)cells+=`<rect x="${(PAD+j*q).toFixed(1)}" y="${(PAD+i*q).toFixed(1)}" width="${cell}" height="${cell}" rx="1.5" fill="var(--dry)" opacity="${v.toFixed(2)}"/>`;
  }
  const T=S0+PAD*2;
  return `<svg width="${T}" height="${T}" viewBox="0 0 ${T} ${T}" aria-hidden="true">
    <rect x=".5" y=".5" width="${T-1}" height="${T-1}" rx="7" fill="none" stroke="var(--dry)" stroke-opacity=".3"/>

/* 从结构里取每残基 pLDDT（B 因子列）*/
function molStats(){
  const per={},order=[];
  (VW.struct||'').split('\n').forEach(l=>{
    if(l.slice(0,4)!=='ATOM')return;
    if(l.slice(12,16).trim()!=='CA')return;
    const resi=parseInt(l.slice(22,26)),b=parseFloat(l.slice(60,66)),resn=l.slice(17,20).trim(),ch=l.slice(21,22);
    if(isNaN(resi))return;
    if(per[resi]===undefined){per[resi]={b:isNaN(b)?0:b,resn:resn,ch:ch};order.push(resi)}
  });
  VW.per=order.map(r=>({resi:r,b:per[r].b,resn:per[r].resn,ch:per[r].ch}));
  VW.avg=VW.per.length?VW.per.reduce((a,x)=>a+x.b,0)/VW.per.length:0;
  VW.bands=[0,0,0,0];
  VW.per.forEach(x=>{const i=x.b>90?0:x.b>70?1:x.b>50?2:3;VW.bands[i]++});
}
function plddtCurve(){
  const P=VW.per||[];if(!P.length)return '<p class="hint">结构里没有 B 因子列</p>';
  const W=320,H=68;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="每残基 pLDDT 曲线">

    <path d="${d}" fill="none" stroke="var(--dry)" stroke-width="1.3"/></svg>`;
}
function bandBars(){

function seqTrack(){

/* M5-F02 PAE：单色渐变、标链边界、悬停给残基对与误差 */
function pae(){
  const N=24,CH=12,cs=13;let seed=99;const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648};
  let cells='',vals=[];
  for(let i=0;i<N;i++){vals.push([]);for(let j=0;j<N;j++){
    const near=Math.abs(i-j)<4,same=(i<CH)===(j<CH);
    const v=near?.05:same?.25+rnd()*.2:.6+rnd()*.3;
    vals[i].push(v);
    cells+=`<rect x="${j*cs}" y="${i*cs}" width="${cs}" height="${cs}" fill="rgba(63,56,201,${(1-v).toFixed(2)})"/>`}}
  const T=N*cs;
  return `<div class="col" style="gap:var(--s2)">
    <svg id="paeSvg" viewBox="0 0 ${T} ${T}" style="width:100%;height:auto;border-radius:var(--r1);display:block"
      role="img" aria-label="PAE 误差矩阵，两条链，边界在残基 ${CH*4}"
      data-vals="${vals.map(r=>r.map(v=>v.toFixed(2)).join(',')).join(';')}" data-n="${N}" data-ch="${CH}">
      ${cells}
      <line x1="${CH*cs}" y1="0" x2="${CH*cs}" y2="${T}" stroke="var(--surface)" stroke-width="1.5"/>
      <line x1="0" y1="${CH*cs}" x2="${T}" y2="${CH*cs}" stroke="var(--surface)" stroke-width="1.5"/>
      <text x="${CH*cs/2}" y="-3" text-anchor="middle" font-size="9" fill="var(--ink-3)">链 A</text>
      <text x="${CH*cs+CH*cs/2}" y="-3" text-anchor="middle" font-size="9" fill="var(--ink-3)">链 B</text>
    </svg>
    <div id="paeOut" class="t-sm mut2 num" style="min-height:17px">悬停查看残基对</div>
  </div>`;}

function loadStruct(text,name,src,fmt){
  VW.struct=text;VW.name=name;VW.src=src;VW.fmt=fmt||'pdb';VW.err=null;VW.sel=new Set();
  molStats();render();
}

/* ================= M6 设计循环　M7 湿实验 ================= */
const PLATE={fmt:96, ctrl:8};
const PLATE_FMT={96:[8,12],192:[8,24],384:[16,24]};
/* M6-F04 构成按「生成路径」给，不按「筛选桶」给——裁决：批次由生成产生，不由事后筛选产生。
   多样性来自多路径本身，不设显式多样性项；不确定性参与但权重调低（0.75）。
   四级浓度同一色相：浓度本身编码比重，比换色相好读。 */
const COMPO=[['R4 最优亲本延伸','var(--dry)',41],['R3 退步分支再探','var(--dry-dim)',22],
  ['未试位点起点','color-mix(in srgb,var(--dry) 45%,transparent)',16],
  ['失败样本反向','color-mix(in srgb,var(--dry) 22%,transparent)',9]];
/* M6-F02 裁决后的生成模型：先定容量，再生成；硬约束只排除、不排序，排除后补位。 */
const GEN={paths:16, iters:3, uncWeight:0.75,
  hard:[['非法残基或长度越界',6,false],['自洽 RMSD 不达标',11,false],['游离半胱氨酸',7,true]],
  hamming:2.38, hammingCtl:2.07};
/* M6-F01 零样本只分档，不给精确排名——排名会被当成置信度用。 */
const ZS={bands:[['A 档','前 15%','var(--dry)',13],['B 档','中间 70%','var(--dry-dim)',61],
  ['C 档','后 15%','var(--ink-3)',14]]};
/* 对照有两套，之前混着用了，必须分开：
   our_control  = 我们在板位上安排的实验对照（野生型、空载体…），我们拥有
   positive_control = 服务商结果里的阳性对照标记，服务商拥有
   两者不互相覆盖，也不能互相推断。 */
/* H1 命中判定。来源：Chai-2 技术报告把「命中」定义成一条可执行的仪器判据
   （BLI 信号高于背景 0.1 nm 且达到背景 300% 以上）。
   我们的服务商返回的是拟合后的 KD，不是原始信号，所以判据落在导出量上——
   这一点要说清，不能假装我们在读仪器原始信号。

   没有命中判定，这个闭环就没有成功指标：研究员答不出「第四轮比第三轮好了吗」，
   而 M6-F02 的裁决整条论证都建立在命中率上。 */
const WT={kd:2.1,dTm:0,src:'B-2411 野生型对照孔实测'};   // 所有相对值的基准

/* 目标候选画像（Target Candidate Profile，概念取自 Cradle 平台页，E2）：
   一个**主目标**加若干**约束**。命中 = 主目标达成且约束全部满足。
   不做成「几项加权求和」：那等于替研究员定权重，而我们没有依据定（同 M5-F06）。
   分主次的理由很实在：这个项目的目标是「Tm +5℃ 且 KD 不劣于野生型」，
   四轮下来 Tm 在涨而 KD 在掉。单条 AND 规则只给出一个 0%，
   分开给才看得出是哪一项卡住、是不是两个目标在互相拉扯。

   **判据从项目目标推导，不另写一套。** 项目页上那行目标文字以前是装饰——
   写在那里但没有任何判定用它。现在它和判据是同一份数据的两种呈现。 */
/* ===== 字段登记表（C6 结果字段可配置）=====
   把 KD / ΔTm 写死在表格、判据、导出三处，第一个做酶活或表达量筛查的项目就撞墙。
   所有字段登记在这里，只有一份；表格列、命中判据、导出列、详情页全读它。

   两类字段分清楚：
     assay  湿实验测出来的，**不同测定产出不同字段**，按项目声明
     calc   干实验算出来的，所有项目都有（ipTM、自洽 RMSD、可开发性）
   混在一起就会出现「这个项目为什么有 ΔTm 这一列」——因为它根本没做热稳定性测定。 */
const FIELD={
  // —— 测定字段 ——
  dTm:   {n:'ΔTm', unit:' ℃',  better:'high',dec:1,kind:'assay',sign:true, from:['DSF','nanoDSF']},
  kd:    {n:'KD',  unit:' nM', better:'low', dec:1,kind:'assay',log:true,  sdKey:'kdLogSd', from:['SPR','BLI']},
  ec50:  {n:'EC50',unit:' nM', better:'low', dec:1,kind:'assay',log:true,  sdKey:'ec50LogSd',from:['ELISA']},

/* 读一个字段的值。测定字段从 c.m 里取——没测过就是 null，不是 0。 */
function mv(c,k){const f=FIELD[k];if(!f||!c)return null;
  if(k==='cys')return c.cys?1:0;
  if(f.kind!=='assay')return c[k]==null?null:c[k];
  return (c.m&&c.m[k]!=null)?c.m[k]:null}

function fmtv(c,k){const v=mv(c,k),f=FIELD[k];if(v==null)return null;
  return (f.sign&&v>0?'+':'')+v.toFixed(f.dec)+f.unit}

function projFields(pr){const P=pr||PRJ();return (P.fields||['dTm','kd']).filter(k=>FIELD[k])}
const asList=v=>v==null||v===''?[]:(Array.isArray(v)?v:String(v).split(/[、,]\s*/).filter(Boolean));
function BATCHES_OF(pid){const id=pid||S.pid;return BATCHES.filter(b=>b.pid===id)}
function assayMethods(pr){const P=pr||PRJ();const out=[];
  P.rounds.forEach(r=>asList(r.plan&&r.plan.assay).forEach(x=>{if(out.indexOf(x)<0)out.push(x)}));
  BATCHES_OF(P.id).forEach(b=>asList(b.ctx&&b.ctx.assay).forEach(x=>{if(out.indexOf(x)<0)out.push(x)}));
  return out}
function fieldMismatch(pr){const P=pr||PRJ();const ms=assayMethods(P);
  if(!ms.length)return [];
  return projFields(P).filter(k=>{const f=FIELD[k];
    return f.from&&!f.from.some(m=>ms.indexOf(m)>=0)})}
const CMP={'>=':'≥','<=':'≤','==':'='};
function ruleOk(r,c){const v=mv(c,r.k);if(v==null)return false;
  return r.cmp==='>='?v>=r.v:r.cmp==='<='?v<=r.v:v===r.v}
function ruleText(r){return `${FIELD[r.k].n} ${CMP[r.cmp]} ${r.v}${FIELD[r.k].unit}`}
function goalText(pr){const t=pr.tcp;if(!t)return pr.goal||'未设定';
  return ruleText(t.primary)+(t.constraints.length?'，且 '+t.constraints.map(ruleText).join('、'):'')}
function tcpOf(pr){return (pr||PRJ()).tcp}
function tcpEval(c,pr){const t=tcpOf(pr);if(!t)return null;
  return {primary:ruleOk(t.primary,c),
    constraints:t.constraints.map(r=>({n:r.n||ruleText(r),ok:ruleOk(r,c),rule:r})),
    allConstraints:t.constraints.every(r=>ruleOk(r,c))}}
function isHit(c,pr){
  if(c.disposition!=='measured')return false;
  const e=tcpEval(c,pr);return !!e&&e.primary&&e.allConstraints}
/* 逐目标达成率。只看有结果的——没测过的既不算达成也不算未达成。 */
function tcpRates(list,pr){const t=tcpOf(pr);const m=list.filter(c=>c.disposition==='measured');
  const rate=f=>m.length?m.filter(f).length/m.length:null;
  const cnt=f=>m.filter(f).length;
  return {n:m.length,
    primary:t?rate(c=>ruleOk(t.primary,c)):null, primaryN:t?cnt(c=>ruleOk(t.primary,c)):0,
    primaryRule:t&&t.primary,
    perConstraint:t?t.constraints.map(r=>({n:r.n||ruleText(r),rule:r,
      rate:rate(c=>ruleOk(r,c)),count:cnt(c=>ruleOk(r,c))})):[]}}
/* 命中率的分母是个坑：按「有结果」算和按「已送检」算不是一个数，
   而两者差的正是测定失败与未测那部分。两个都给出来，并写明分母。 */
function hitStats(list,pr){
  const ordered=list.filter(c=>['ordered','measured','failed','untested'].indexOf(c.disposition)>=0);
  const measured=list.filter(c=>c.disposition==='measured');
  const hits=measured.filter(c=>isHit(c,pr));
  return {hits:hits.length, measured:measured.length, ordered:ordered.length,
    byMeasured:measured.length?hits.length/measured.length:null,

   我们没有校准数据，所以走后者，并且把这件事写在界面上——
   一个来历不明的「预期命中率 18%」比没有更糟。 */
function forecast(n,pr){
  const P=pr||PRJ();
  if(!tcpOf(P))return {basis:'none',rounds:[]};
  const past=P.rounds.map(r=>({i:r.i,st:hitStats(CANDS().filter(c=>c.firstRound===r.i),P),
                               rt:tcpRates(CANDS().filter(c=>c.firstRound===r.i),P)}))
    .filter(x=>x.st.measured>0);
  if(!past.length)return {basis:'none',rounds:[]};
  const rates=past.map(x=>x.st.byMeasured);
  const lo=Math.min.apply(null,rates), hi=Math.max.apply(null,rates);
  const last=rates[rates.length-1];
  return {basis:'empirical', rounds:past,
    lo:lo, hi:hi, last:last,
    nLo:Math.round(n*lo), nHi:Math.round(n*hi), nLast:Math.round(n*last),
    primaryLo:Math.min.apply(null,past.map(x=>x.rt.primary)),
    primaryHi:Math.max.apply(null,past.map(x=>x.rt.primary)),
    /* 「不现实」的判据：某条约束在历史上的满足率低到一个程度，
       再加轮次也很难同时满足它和主目标。这不是预言，是把历史摆出来。 */
    weak:(past[past.length-1].rt.perConstraint||[]).filter(x=>x.rate!=null&&x.rate<0.15)};
}

/* C2 这一轮该继续、重设计，还是收手。
   三个可测信号：边际收益（主目标达成率的轮间变化）、headroom（最好值距目标还差多少）、

function roundAdvice(pr){
  const P=pr||PRJ();const t=tcpOf(P);
  if(!t||!t.primary||!FIELD[t.primary.k])return null;   // 没设目标就不给建议，别崩
  const f=FIELD[t.primary.k], better=f.better;
  const per=P.rounds.map(r=>{const L=CANDS().filter(c=>c.firstRound===r.i);
    const vals=L.filter(c=>c.disposition==='measured').map(c=>mv(c,t.primary.k)).filter(v=>v!=null);
    return {i:r.i, rt:tcpRates(L,P), st:hitStats(L,P),
      best:vals.length?(better==='high'?Math.max.apply(null,vals):Math.min.apply(null,vals)):null}})
    .filter(x=>x.rt.n>0);
  if(per.length<2)return {verdict:'continue',per:per,field:f,primaryRule:t.primary,head:null,
    why:[per.length?'只有一轮有结果，还看不出趋势':'还没有任何结果，先把这一轮跑完']};
  const a=per[per.length-2], b=per[per.length-1];
  const dPrimary=(b.rt.primary||0)-(a.rt.primary||0);
  const reached=b.best!=null&&(better==='high'?b.best>=t.primary.v:b.best<=t.primary.v);
  const head=b.best==null?null:(better==='high'?t.primary.v-b.best:b.best-t.primary.v);
  const totalHits=hitStats(CANDS(),P).hits;
  const conflict=(b.rt.primary||0)>0.1&&b.st.hits===0;
  const plateau=Math.abs(dPrimary)<0.05&&(a.best!=null&&b.best!=null&&Math.abs(b.best-a.best)<0.3);
  let verdict='continue',why=[];
  /* 「停」有两种，不能用一个词盖过去：目标达成了该去验证，和这条路走不通该放弃。 */
  if(totalHits>0&&reached){verdict='verify';
    why.push(`已有 ${totalHits} 条命中，本轮最好值 ${f.n} ${b.best}${f.unit} 已达目标 ${t.primary.v}${f.unit}`);
    why.push('该做的不是再加一轮，是拿这几条去放大表达、做重复验证')}
  else if(conflict){verdict='redesign';
    why.push(`主目标达成 ${pct(b.rt.primary)}，命中却是 0——卡在约束上，不是轮次不够`)}
  else if(plateau){verdict='abandon';
    why.push(`主目标达成率两轮变化 ${(dPrimary*100).toFixed(1)} 个百分点，最好值也几乎没动，已经平台期`);

function plate(rows,cols,scaled){
  const letters='ABCDEFGHIJKLMNOP';
  const seq=[];
  for(let i=0;i<PLATE.ctrl;i++)seq.push(['我们的对照','var(--wet)']);
  scaled.forEach(([n,c,k])=>{for(let i=0;i<k;i++)seq.push([n,c])});
  const cell=cols>12?12:17;   // 和全局的 9px 像素格同一尺度，不喧宾夺主
  let h=`<div style="overflow-x:auto"><div style="display:grid;gap:3px;width:max-content;
    grid-template-columns:18px repeat(${cols},${cell}px)">`;
  h+='<span></span>';
  for(let c=1;c<=cols;c++)h+=`<span class="t-xs mut2 num" style="text-align:center">${c}</span>`;
  for(let r=0;r<rows;r++){
    h+=`<span class="t-xs mut2 num" style="line-height:1;align-self:center">${letters[r]}</span>`;
    for(let c=0;c<cols;c++){const i=r*cols+c,w=seq[i]||['对照','var(--ink-3)'];
      h+=`<i title="${letters[r]}${c+1}　${w[0]}" style="aspect-ratio:1;border-radius:2px;background:${w[1]}"></i>`}
  }
  return h+'</div></div>';
}

V.wetlab=()=>{
  const _tabs=roundTabs('wetlab');
  const T=EXP_TYPES.find(x=>x.k===WET.type);
  /* 未识别的状态 findIndex 会给 −1，EXP_STATUS[-1] 是 undefined——进度条会直接崩。
     兜底到生产段的第一格，并在界面上标明这是没认出来的值。 */
  const STEPS=EXP_STATUS.filter(x=>x.k!=='canceled');
  const siRaw=STEPS.findIndex(x=>x.k===WET.status);
  const si=siRaw<0?STEPS.findIndex(x=>x.k==='in_queue'):siRaw;
  const usable=PLATE.fmt-PLATE.ctrl;
  const SELF_MAX=96;            // 超出自助上限转人工报价（阈值未查实，见 FEASIBILITY 第五节）
  const staffQuote=usable>SELF_MAX;
  /* 报价不在视图里算。接口以分为单位返回明细与 pricing_version，这里渲染的是它的样例响应；
     上线后换成真实返回体，渲染逻辑不用改。界面上标明是样例，不能让人当成实时价。 */
  const nSel=CANDS().filter(c=>S.sel.has(c.id)).length||usable;
  const INCLUDED_REPS=2;                       // 官网起步价含 2 次重复（E2，查证于 2026-11-11）
  const extraReps=Math.max(0,WET.nrep-INCLUDED_REPS);
  const QUOTE={pricing_version:'官网公开价 2026-11-11', fetched_at:'2026-11-11', demo:true,
    lines:[{label:`测定（${T.n}）· 含 ${INCLUDED_REPS} 次重复`,unit_cents:14900,qty:nSel}]};
  /* 超出 2 次的重复，官网没有公开单价——不编一个出来。标成待报价，并让合计显示为不完整。 */
  if(extraReps)QUOTE.lines.push({label:`额外重复 ×${extraReps}`,unit_cents:null,qty:extraReps*nSel});
  QUOTE.lines.forEach(l=>l.subtotal_cents=l.unit_cents==null?null:l.unit_cents*l.qty);
  const partial=QUOTE.lines.some(l=>l.subtotal_cents==null);
  const cents=QUOTE.lines.reduce((a,l)=>a+(l.subtotal_cents||0),0);
  const usd=c=>'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  /* 闸门要在出口再校验一次。入口把勾选框 disabled 只是提示，选中集可能来自上一次会话，

  const picked=CANDS().filter(c=>S.sel.has(c.id));
  const blocked=picked.filter(c=>c.iptm<S.gate);
  const orderBlocked=staffQuote||blocked.length>0||picked.length===0;

/* M5 筛选器 */
const CAP=96, CTRL=8, USABLE=CAP-CTRL;
function fltApply(L){const f=S.flt;
  return L.filter(c=>(!f.noCys||!c.cys)&&(c.dev>=f.devMin)
    &&(f.src==='全部'||c.src===f.src)&&(!f.passOnly||c.iptm>=S.gate))}
function fltCount(){const f=S.flt;let n=0;
  if(f.noCys)n++;if(f.devMin>0)n++;if(f.src!=='全部')n++;if(f.passOnly)n++;return n}

/* M2-F02 公共库取回。先走真实接口，失败再回落到内置样本；错误区分三类 */
async function fetchAcc(){
  const v=(IN.acc||'').trim(), t=idType(v);
  IN.err=null;
  if(!t){IN.err={kind:'标识符格式不对',
    msg:`「${v}」不符合任何一个库的编号规则。`,
    hint:'PDB 是四位且首位为数字（1BRS）；UniProt 形如 P00644；AFDB 形如 AF-P00644-F1。'};
    render();return}
  IN.busy=true;render();
  const urls={PDB:`https://www.rcsb.org/fasta/entry/${v.toUpperCase()}`,
    UniProt:`https://rest.uniprot.org/uniprotkb/${v.toUpperCase()}.fasta`,
    AFDB:`https://rest.uniprot.org/uniprotkb/${(v.match(/^AF-([A-Z0-9]+)-F\d+$/i)||[,''])[1].toUpperCase()}.fasta`};
  let txt=null,netErr=null,missing=false;
  try{
    const res=await fetch(urls[t],{headers:{Accept:'text/plain'}});
    if(res.status===404)missing=true;
    else if(!res.ok)netErr='HTTP '+res.status;
    else txt=await res.text();
  }catch(e){netErr=e.message||'请求未发出'}
  IN.busy=false;
  const key=Object.keys(BUILTIN).find(k=>k.toUpperCase()===v.toUpperCase());
  if(!txt&&key){
    const B=BUILTIN[key];
    IN.parsed=parseSeq(B.chains.map(c=>'>'+c.id+'|'+B.name+'\n'+c.seq).join('\n'));
    IN.parsed.pdb=key;IN.rawSeq=IN.parsed.raw;IN.confirmed=false;IN.sel=new Set();
    IN.err=netErr?{kind:'用的是内置样本',
      msg:`连不上 ${B.src}（${netErr}），已改用内置的这条记录。`,
      hint:'托管页面会被跨域策略拦住第三方接口；本地打开通常可以直连。'}:null;
    render();toast(`已载入 ${key}：${B.chains.length} 条链`);return;
  }
  if(missing){IN.err={kind:'库里没有这条',
    msg:`${t} 中不存在 ${v}。`,hint:'检查编号是否打错，或该条目是否已被撤销合并。'};render();return}
  if(netErr){IN.err={kind:'取回失败',
    msg:`请求 ${t} 时出错：${netErr}。`,
    hint:'可能是网络不通或跨域被拦。可改用「粘贴序列」直接贴入，或先试内置样本。'};render();return}
  IN.parsed=parseSeq(txt);IN.parsed.pdb=v.toUpperCase();IN.rawSeq=txt;
  IN.parsed.rawResp=txt;IN.confirmed=false;IN.sel=new Set();render();
  toast(`已从 ${t} 取回：${IN.parsed.chains.length} 条链 ${IN.parsed.total} 个残基`);
}

/* ---------------- 基础模型接入 ---------------- */
const MODELS={
  'deepseek-flash':{label:'deepseek-flash',note:'DeepSeek-V4.1-Flash',
    price:'输入 2 元 / 输出 8 元每百万 token（闲时半价）',ctx:'1M 上下文'},
  'deepseek-v4-pro':{label:'deepseek-v4-pro',note:'DeepSeek-V4-Pro',
    price:'输入 9 元 / 输出 27 元每百万 token（闲时半价）',ctx:'1M 上下文'}
};
const MC={
  cfg(){return LS.get('model',{base:'https://api.deepseek.com',name:'deepseek-flash',key:''})},
  save(c){LS.set('model',c)},
  ready(){return !!MC.cfg().key},
  async chat(messages,opt){
    const c=MC.cfg();
    if(!c.key)throw new Error('NOKEY');
    const res=await fetch(c.base.replace(/\/$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify({model:c.name,messages:messages,stream:false,
        max_tokens:(opt&&opt.max)||900,temperature:(opt&&opt.temp)!=null?opt.temp:0.2})
    }).catch(e=>{throw new Error('NET:'+e.message)});
    if(!res.ok){const t=await res.text().catch(()=>'');throw new Error('HTTP '+res.status+' '+t.slice(0,180))}
    const j=await res.json();
    return {text:(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'',
            usage:j.usage||null};

async function dl(name,data,mime){

/* 最小 ZIP（仅存储，不压缩）*/
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const name of Object.keys(files)){
    const nb=enc.encode(name),db=enc.encode(files[name]),crc=crc32(db);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),
      ...u16(0),...u16(0),...u32(crc),...u32(db.length),...u32(db.length),
      ...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]), nb);
    off+=lh.length+nb.length+db.length;
  }
  const cs=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(central.length),...u16(central.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}

      const j=Math.floor((e.clientX-r.left)/r.width*N),i=Math.floor((e.clientY-r.top)/r.height*N);
      if(i<0||j<0||i>=N||j>=N)return;
      const ra=i*4+1,rb=j*4+1,ca=i<CH?'A':'B',cb=j<CH?'A':'B';
      out.textContent=`${ca}:${ra} ↔ ${cb}:${rb}　预期位置误差 ${(vals[i][j]*30).toFixed(1)} Å`};

function act(a){
  if(!canAct(a)){const k=ACT_PERM[a];

  /* 只留真正会走到这里的动作。被上游 if 处理掉的动作如果还在这里留一条提示，
     改了上游就会出现两套说法，而没人知道哪条是真的。 */
  const M={usetool:'已加入当前任务',
    newskill:'新建 Skill 需声明轮次感知、实验上下文字段与准入输出',
    invite:'邀请链接已复制',topup:'已跳转充值',bell:'没有新通知'};
